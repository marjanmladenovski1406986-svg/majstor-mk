<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мајстор.мк</title>
<script defer src="/_vercel/insights/script.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; }

header { background: #1a1a1a; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2a2a; flex-wrap: wrap; gap: 10px; }
.logo { font-size: 20px; font-weight: 700; color: #ff6b35; cursor: pointer; }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lang-switch { display: flex; gap: 5px; }
.lang-btn { background: #2a2a2a; border: 1px solid #333; color: #999; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
.lang-btn.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
.user-box { display: flex; align-items: center; gap: 10px; }
.user-email { color: #ff6b35; font-size: 13px; font-weight: 600; }
.btn-auth { background: #ff6b35; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; }
.btn-auth.logout { background: transparent; border: 1px solid #333; color: #999; }
.btn-auth:hover { opacity: 0.9; }

.hero { text-align: center; padding: 40px 20px 30px; }
.hero h1 { font-size: 32px; margin-bottom: 15px; color: #ff6b35; }
.hero p { color: #999; font-size: 16px; max-width: 600px; margin: 0 auto; }

.categories { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
.cat-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; padding: 10px 18px; border-radius: 25px; cursor: pointer; font-size: 14px; font-family: inherit; }
.cat-btn.active { background: #ff6b35; border-color: #ff6b35; }

.main-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 0 20px 40px; max-width: 1400px; margin: 0 auto; }
.section-title { padding: 0 20px; margin-bottom: 20px; font-size: 22px; }

.majstori-list { background: #1a1a1a; border-radius: 12px; padding: 15px; max-height: 700px; overflow-y: auto; }
.majstori-list h3 { color: #ff6b35; margin-bottom: 15px; font-size: 18px; }
.majstor-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #252525; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: background 0.2s; }
.majstor-card:hover { background: #2f2f2f; }
.majstor-avatar { width: 45px; height: 45px; border-radius: 50%; background: #ff6b35; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
.majstor-info { flex: 1; min-width: 0; }
.majstor-name { font-weight: 600; font-size: 14px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.majstor-meta { font-size: 12px; color: #999; display: flex; gap: 8px; align-items: center; }
.majstor-rating { color: #ffb84d; font-weight: 600; }
.no-majstori { text-align: center; color: #666; padding: 20px; font-size: 13px; }

.loading { text-align: center; color: #999; padding: 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.card { background: #1a1a1a; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
.card:hover { transform: translateY(-3px); }
.thumb { width: 100%; aspect-ratio: 16/9; background: #2a2a2a; position: relative; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb::after { content: '▶'; position: absolute; width: 50px; height: 50px; background: rgba(255,107,53,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.card-body { padding: 15px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }
.card-meta { display: flex; justify-content: space-between; font-size: 13px; color: #999; }
.cat-tag { background: #2a2a2a; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
.cat-tag.elektrika { background: #4a3a1a; color: #ffb84d; }
.cat-tag.vodovod { background: #1a3a4a; color: #4db8ff; }
.cat-tag.gradeznistvo { background: #3a2a1a; color: #d4a373; }
.cat-tag.popravki { background: #2a3a1a; color: #8bc34a; }
.cat-tag.finalni { background: #3a1a3a; color: #e91e63; }

footer { background: #1a1a1a; padding: 30px; text-align: center; color: #666; }

.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
.modal.open { display: flex; }
.modal-content { background: #1a1a1a; padding: 30px; border-radius: 16px; max-width: 450px; width: 100%; border: 1px solid #2a2a2a; margin: auto; }
.modal-content h2 { color: #ff6b35; text-align: center; margin-bottom: 20px; }
.modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 10px; font-family: inherit; }
.modal-content input:focus, .modal-content select:focus, .modal-content textarea:focus { outline: none; border-color: #ff6b35; }
.modal-content button { width: 100%; padding: 12px; background: #ff6b35; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 10px; }
.modal-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.modal-tab { flex: 1; padding: 12px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #999; cursor: pointer; font-size: 14px; font-family: inherit; }
.modal-tab.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
.modal-msg { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; }
.modal-msg.error { background: #3a1a1a; color: #ff6b6b; display: block; }
.modal-msg.success { background: #1a3a1a; color: #6bff6b; display: block; }
.modal-msg.info { background: #1a2a3a; color: #6bb8ff; display: block; }
.hidden { display: none; }

.type-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.type-btn { padding: 20px 10px; background: #2a2a2a; border: 2px solid #333; border-radius: 12px; color: #fff; cursor: pointer; font-family: inherit; text-align: center; transition: all 0.2s; }
.type-btn:hover { border-color: #ff6b35; }
.type-btn.active { background: #3a2515; border-color: #ff6b35; }
.type-btn .icon { font-size: 30px; display: block; margin-bottom: 8px; }
.type-btn .label { font-size: 14px; font-weight: 600; }

.video-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 1001; align-items: center; justify-content: center; padding: 20px; }
.video-modal.open { display: flex; }
.video-modal-content { max-width: 900px; width: 100%; }
.video-modal iframe { width: 100%; aspect-ratio: 16/9; border-radius: 12px; border: none; }
.video-close { position: absolute; top: 20px; right: 20px; background: #ff6b35; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }

/* MAJSTOR PROFILE */
.majstor-profile { text-align: center; }
.majstor-profile .big-avatar { width: 80px; height: 80px; border-radius: 50%; background: #ff6b35; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; margin: 0 auto 15px; }
.majstor-profile .big-name { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.majstor-profile .big-rating { color: #ffb84d; font-size: 18px; margin-bottom: 15px; }
.majstor-profile .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2a2a; font-size: 14px; text-align: left; }
.majstor-profile .info-row span:first-child { color: #999; }
.majstor-profile .info-row span:last-child { font-weight: 600; text-align: right; }

/* RATING SECTION */
.rating-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #2a2a2a; text-align: left; }
.rating-section h4 { color: #ff6b35; margin-bottom: 12px; font-size: 16px; }
.stars-input { display: flex; gap: 5px; font-size: 32px; margin-bottom: 12px; cursor: pointer; justify-content: center; }
.star { color: #444; transition: color 0.15s; }
.star:hover, .star.active { color: #ffb84d; }
.rating-section textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 13px; margin-bottom: 10px; font-family: inherit; resize: vertical; min-height: 60px; }
.rating-section button { width: 100%; padding: 12px; background: #ff6b35; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.rating-section button:hover { background: #e55a2b; }
.rating-msg { padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; display: none; }
.rating-msg.success { background: #1a3a1a; color: #6bff6b; display: block; }
.rating-msg.error { background: #3a1a1a; color: #ff6b6b; display: block; }

.rating-list { margin-top: 20px; text-align: left; }
.rating-list h4 { color: #ff6b35; margin-bottom: 10px; font-size: 15px; }
.rating-item { padding: 10px; background: #252525; border-radius: 8px; margin-bottom: 8px; }
.rating-item .stars { color: #ffb84d; margin-bottom: 5px; font-size: 14px; }
.rating-item .comment { color: #ccc; font-size: 13px; }
.rating-item .date { color: #666; font-size: 11px; margin-top: 5px; }
.no-ratings { color: #666; font-size: 13px; text-align: center; padding: 15px; }
.login-hint { text-align: center; color: #999; font-size: 13px; padding: 15px; background: #252525; border-radius: 8px; }

@media (max-width: 768px) {
  .main-layout { grid-template-columns: 1fr; }
  .majstori-list { max-height: none; }
}
</style>
</head>

<script>
const SUPABASE_URL = 'https://brxdimqgujhemgpfujcq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyeGRpbXFndWpoZW1ncGZ1amNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTgxMjYsImV4cCI6MjEwNDc5NDEyNn0.gh0vekUMPmzg5EbkGvaRFLfBL8SWsjGUvB1BY4H5T5Y';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let videos = [];
let majstori = [];
let currentLang = 'mk';
let currentFilter = 'all';
let selectedType = null;
let currentUser = null;
let selectedRating = 0;

async function loadVideos() {
  document.getElementById('loading').style.display = 'block';
  const { data, error } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });
  if (error) { console.error(error); return; }
  videos = data.map(v => ({ title: v.title, titleEn: v.title_en, youtube: v.youtube_id, cat: v.category, likes: v.likes }));
  document.getElementById('loading').style.display = 'none';
  renderVideos();
}

async function loadMajstori() {
  const { data, error } = await supabaseClient.from('majstor_profiles').select('*').order('id', { ascending: true });
  if (error) { console.error(error); return; }
  
  const { data: allRatings } = await supabaseClient.from('ratings').select('majstor_id, rating');
  
  majstori = (data || []).map(m => {
    const mRatings = (allRatings || []).filter(r => r.majstor_id === m.id);
    const baseSum = (m.rating || 0) * (m.rating_count || 0);
    const newSum = mRatings.reduce((s, r) => s + r.rating, 0);
    const totalCount = (m.rating_count || 0) + mRatings.length;
    const rating = totalCount > 0 ? parseFloat(((baseSum + newSum) / totalCount).toFixed(1)) : 0;
    return { ...m, computed_rating: rating, computed_count: totalCount };
  });
  renderMajstori();
}

const catNames = {
  mk: { elektrika: "Електрика", vodovod: "Водовод", gradeznistvo: "Градежништво", popravki: "Поправки", finalni: "Финални работи" },
  en: { elektrika: "Electric", vodovod: "Plumbing", gradeznistvo: "Construction", popravki: "Repairs", finalni: "Finishing" }
};

const t = {

  en: {

    heroTitle: "Learn it. Fix it.<br>Or choose a master.",

    all: "All", elektrika: "⚡ Electric", vodovod: "💧 Plumbing", gradeznistvo: "🏗️ Construction",
    popravki: "🔧 Repairs", finalni: "🎨 Finishing",
    latest: "🔥 Latest Videos", majstori: "👷 Masters", footer: "© 2026 MasterHow",
    modalTitle: "🔨 MasterHow", tabLogin: "Login", tabRegister: "Register",
    labelMajstor: "Master", labelPosetitel: "Visitor",
    btnClose: "Close", noMajstori: "No masters in this category",
    rateTitle: "Rate this master",
    rateComment: "Comment (optional)...",
    rateBtn: "Submit rating",
    loginToRate: "Log in to rate",
    reviews: "reviews",
    noReviews: "No reviews yet",
    error: "Error: "
  }
};

function renderVideos() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const filtered = videos.filter(v => currentFilter === "all" || v.cat === currentFilter);
  if (filtered.length === 0) { grid.innerHTML = '<div class="loading">Нема видеа</div>'; return; }
  filtered.forEach(v => {
    const title = currentLang === 'mk' ? v.title : (v.titleEn || v.title);
    const thumbUrl = `https://img.youtube.com/vi/${v.youtube}/hqdefault.jpg`;
    grid.innerHTML += `
      <div class="card" onclick="openVideo('${v.youtube}')">
        <div class="thumb"><img src="${thumbUrl}" alt="${title}"></div>
        <div class="card-body">
          <div class="card-title">${title}</div>
          <div class="card-meta">
            <span class="cat-tag ${v.cat}">${catNames[currentLang][v.cat] || v.cat}</span>
            <span>❤️ ${v.likes}</span>
          </div>
        </div>
      </div>`;
  });
}

function renderMajstori() {
  const grid = document.getElementById('majstori-grid');
  grid.innerHTML = '';
  const filtered = majstori.filter(m => currentFilter === "all" || m.category === currentFilter);
  if (filtered.length === 0) { grid.innerHTML = `<div class="no-majstori">${t[currentLang].noMajstori}</div>`; return; }
  filtered.forEach(m => {
    const initial = (m.name || '?').charAt(0).toUpperCase();
    const rating = m.computed_rating ? `⭐ ${m.computed_rating}` : '';
    grid.innerHTML += `
      <div class="majstor-card" onclick="showMajstor(${m.id})">
        <div class="majstor-avatar">${initial}</div>
        <div class="majstor-info">
          <div class="majstor-name">${m.name || 'Мајстор'}</div>
          <div class="majstor-meta">
            <span>${catNames[currentLang][m.category] || m.category}</span>
            <span class="majstor-rating">${rating}</span>
          </div>
        </div>
      </div>`;
  });
}

async function showMajstor(id) {
  const m = majstori.find(x => x.id === id);
  if (!m) return;
  const initial = (m.name || '?').charAt(0).toUpperCase();
  selectedRating = 0;

  document.getElementById('majstor-profile-content').innerHTML = `
    <div class="majstor-profile">
      <div class="big-avatar">${initial}</div>
      <div class="big-name">${m.name || 'Мајстор'}</div>
      <div class="big-rating">⭐ ${m.computed_rating || 0} (${m.computed_count || 0} ${t[currentLang].reviews})</div>
      <div class="info-row"><span>Категорија</span><span>${catNames[currentLang][m.category] || m.category}</span></div>
      <div class="info-row"><span>Телефон</span><span>${m.phone || '-'}</span></div>
      <div class="info-row"><span>Град</span><span>${m.city || '-'}</span></div>
      <div class="info-row"><span>Опис</span><span>${m.description || '-'}</span></div>
    </div>
    <div id="rating-content"></div>
    <div id="ratings-list"></div>`;

  document.getElementById('majstorModal').classList.add('open');
  loadRatings(id);
}

async function loadRatings(majstorId) {
  const ratingContent = document.getElementById('rating-content');

  if (currentUser) {
    ratingContent.innerHTML = `
      <div class="rating-section">
        <h4>${t[currentLang].rateTitle}</h4>
        <div class="stars-input" id="stars-input">
          <span class="star" data-val="1">★</span>
          <span class="star" data-val="2">★</span>
          <span class="star" data-val="3">★</span>
          <span class="star" data-val="4">★</span>
          <span class="star" data-val="5">★</span>
        </div>
        <textarea id="rating-comment" placeholder="${t[currentLang].rateComment}"></textarea>
        <button onclick="submitRating(${majstorId})">${t[currentLang].rateBtn}</button>
        <div id="rating-msg" class="rating-msg"></div>
      </div>`;
    document.querySelectorAll('#stars-input .star').forEach(star => {
      star.addEventListener('click', () => {
        selectedRating = parseInt(star.dataset.val);
        document.querySelectorAll('#stars-input .star').forEach(s => {
          s.classList.toggle('active', parseInt(s.dataset.val) <= selectedRating);
        });
      });
    });
  } else {
    ratingContent.innerHTML = `<div class="login-hint">${t[currentLang].loginToRate}</div>`;
  }

  const { data } = await supabaseClient.from('ratings').select('*').eq('majstor_id', majstorId).order('created_at', { ascending: false });
  const listDiv = document.getElementById('ratings-list');
  if (!data || data.length === 0) {
    listDiv.innerHTML = `<div class="no-ratings">${t[currentLang].noReviews}</div>`;
    return;
  }
  listDiv.innerHTML = '<div class="rating-list"><h4>⭐ ' + data.length + ' ' + t[currentLang].reviews + '</h4>' +
    data.map(r => {
      const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
      const date = new Date(r.created_at).toLocaleDateString();
      return `<div class="rating-item">
        <div class="stars">${stars}</div>
        ${r.comment ? '<div class="comment">' + r.comment + '</div>' : ''}
        <div class="date">${date}</div>
      </div>`;
    }).join('') + '</div>';
}

async function submitRating(majstorId) {
  const msg = document.getElementById('rating-msg');
  const comment = document.getElementById('rating-comment').value;

  if (!selectedRating) {
    msg.textContent = 'Избери ѕвезди';
    msg.className = 'rating-msg error';
    return;
  }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { msg.textContent = 'Не си најавен'; msg.className = 'rating-msg error'; return; }

  const { error } = await supabaseClient.from('ratings').insert({
    majstor_id: majstorId,
    user_id: user.id,
    rating: selectedRating,
    comment: comment
  });

  if (error) {
    msg.textContent = error.message;
    msg.className = 'rating-msg error';
    return;
  }

  // Recalculate average
  const { data: allRatings } = await supabaseClient.from('ratings').select('rating').eq('majstor_id', majstorId);
  if (allRatings && allRatings.length > 0) {
    const avg = (allRatings.reduce((s, r) => s + r.rating, 0) / allRatings.length).toFixed(1);
    await supabaseClient.from('majstor_profiles').update({ rating: parseFloat(avg), rating_count: allRatings.length }).eq('id', majstorId);
  }

  msg.textContent = '✅ Благодариме за оценката!';
  msg.className = 'rating-msg success';

  await loadMajstori();
  setTimeout(() => { loadRatings(majstorId); }, 500);
}

function closeMajstorModal() { document.getElementById('majstorModal').classList.remove('open'); }

function openVideo(youtubeId) {
  document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
  document.getElementById('videoModal').classList.add('open');
}
function closeVideo() { document.getElementById('videoFrame').src = ''; document.getElementById('videoModal').classList.remove('open'); }

function switchLang(lang) {
  currentLang = lang;
  const tr = t[lang];
  document.getElementById('logo-text').textContent = tr.logo;
  document.getElementById('hero-title').innerHTML = tr.heroTitle;
  document.getElementById('hero-text').textContent = tr.heroText;
  document.getElementById('section-title').textContent = tr.latest;
  document.getElementById('majstori-title').textContent = tr.majstori;
  document.getElementById('footer-text').textContent = tr.footer;
  document.getElementById('cat-all').textContent = tr.all;
  document.getElementById('cat-elektrika').textContent = tr.elektrika;
  document.getElementById('cat-vodovod').textContent = tr.vodovod;
  document.getElementById('cat-gradeznistvo').textContent = tr.gradeznistvo;
  document.getElementById('cat-popravki').textContent = tr.popravki;
  document.getElementById('cat-finalni').textContent = tr.finalni;
  document.getElementById('btn-login-header').textContent = tr.login;
  document.getElementById('btn-logout-header').textContent = tr.logout;
  document.getElementById('modal-title').textContent = tr.modalTitle;
  document.getElementById('modal-tab-login').textContent = tr.tabLogin;
  document.getElementById('modal-tab-register').textContent = tr.tabRegister;
  document.getElementById('label-majstor').textContent = tr.labelMajstor;
  document.getElementById('label-posetitel').textContent = tr.labelPosetitel;
  document.getElementById('btn-close-modal').textContent = tr.btnClose;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  renderVideos();
  renderMajstori();
}

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.cat;
    renderVideos();
    renderMajstori();
  });
});

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function showModalTab(tab) {
  document.getElementById('modal-tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('modal-tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('modal-form-login').classList.toggle('hidden', tab !== 'login');
  document.getElementById('modal-form-register').classList.toggle('hidden', tab !== 'register');
  if (tab === 'register') { resetRegisterForm(); }
}

function resetRegisterForm() {
  selectedType = null;
  document.getElementById('type-majstor').classList.remove('active');
  document.getElementById('type-posetitel').classList.remove('active');
  document.getElementById('form-majstor').classList.add('hidden');
  document.getElementById('form-posetitel').classList.add('hidden');
}

function selectType(type) {
  selectedType = type;
  document.getElementById('type-majstor').classList.toggle('active', type === 'majstor');
  document.getElementById('type-posetitel').classList.toggle('active', type === 'posetitel');
  document.getElementById('form-majstor').classList.toggle('hidden', type !== 'majstor');
  document.getElementById('form-posetitel').classList.toggle('hidden', type !== 'posetitel');
}

function showModalMsg(text, type) {
  const msg = document.getElementById('modal-msg');
  msg.textContent = text;
  msg.className = 'modal-msg ' + type;
}

async function handleLogin() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showModalMsg('Внеси е-пошта и лозинка', 'error'); return; }
  showModalMsg('Се најавувам...', 'info');
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { showModalMsg('Грешка: ' + error.message, 'error'); return; }
  showModalMsg('Успешно најавување!', 'success');
  setTimeout(() => { closeModal(); showLoggedIn(data.user.email); }, 800);
}

async function handleRegisterMajstor() {
  const name = document.getElementById('m-name').value;
  const surname = document.getElementById('m-surname').value;
  const phone = document.getElementById('m-phone').value;
  const city = document.getElementById('m-city').value;
  const category = document.getElementById('m-category').value;
  const description = document.getElementById('m-description').value;
  const email = document.getElementById('m-email').value;
  const password = document.getElementById('m-password').value;

  if (!name || !email || !password || !category) { showModalMsg('Пополни име, е-пошта, лозинка и категорија', 'error'); return; }
  if (password.length < 6) { showModalMsg('Лозинката мора да има најмалку 6 знаци', 'error'); return; }

  showModalMsg('Се регистрирам...', 'info');
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) { showModalMsg('Грешка: ' + error.message, 'error'); return; }

  const userId = data.user.id;
  const fullName = name + ' ' + surname;

  await supabaseClient.from('profiles').insert({ id: userId, user_type: 'majstor', name: fullName, phone: phone, city: city });
  await supabaseClient.from('majstor_profiles').insert({ user_id: userId, name: fullName, phone: phone, city: city, category: category, description: description, rating: 0, rating_count: 0 });

  showModalMsg('Успешна регистрација!', 'success');
  setTimeout(() => { closeModal(); showLoggedIn(email); loadMajstori(); }, 800);
}

async function handleRegisterPosetitel() {
  const name = document.getElementById('p-name').value;
  const email = document.getElementById('p-email').value;
  const password = document.getElementById('p-password').value;

  if (!name || !email || !password) { showModalMsg('Пополни сите полиња', 'error'); return; }
  if (password.length < 6) { showModalMsg('Лозинката мора да има најмалку 6 знаци', 'error'); return; }

  showModalMsg('Се регистрирам...', 'info');
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) { showModalMsg('Грешка: ' + error.message, 'error'); return; }

  await supabaseClient.from('profiles').insert({ id: data.user.id, user_type: 'popravam', name: name });

  showModalMsg('Успешна регистрација!', 'success');
  setTimeout(() => { closeModal(); showLoggedIn(email); }, 800);
}

async function handleLogout() {
  await supabaseClient.auth.signOut();
  document.getElementById('auth-area').classList.remove('hidden');
  document.getElementById('user-area').classList.add('hidden');
  currentUser = null;
}

function showLoggedIn(email) {
  currentUser = email;
  document.getElementById('auth-area').classList.add('hidden');
  document.getElementById('user-area').classList.remove('hidden');
  document.getElementById('user-email-header').textContent = email;
}

async function checkUser() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (user) showLoggedIn(user.email);
}

checkUser();
loadVideos();
loadMajstori();
</script>
