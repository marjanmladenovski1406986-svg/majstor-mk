<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="48x48" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png">
<link rel="canonical" href="https://majsto.mk/">
<meta name="theme-color" content="#ff6b35">
<meta name="description" content="Најди проверен мајстор во Македонија. Бесплатна платформа со слики, оценки и контакт.">

<!-- Clerk Authentication -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA"
  src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"
></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; }

header { background: #111; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
.logo { font-size: 22px; font-weight: 800; color: #ffb84d; text-decoration: none; }
.header-right { display: flex; align-items: center; gap: 15px; }
.btn-auth { background: #ffb84d; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }

.hero { text-align: center; padding: 50px 20px 30px; }
.hero h1 { font-size: 38px; font-weight: 800; margin-bottom: 15px; line-height: 1.2; }
.hero h1 span { color: #ffb84d; }
.hero p { color: #aaa; font-size: 16px; max-width: 600px; margin: 0 auto; }

.city-filter { max-width: 600px; margin: 20px auto; text-align: center; padding: 0 20px; }
.city-filter select { width: 100%; max-width: 300px; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 25px; color: #fff; font-size: 14px; text-align: center; cursor: pointer; }

.categories-wrapper { padding: 10px 0 20px; overflow-x: auto; }
.categories { display: flex; gap: 10px; padding: 0 20px; justify-content: center; flex-wrap: wrap; }
.cat-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 18px; border-radius: 25px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.cat-btn.active { background: #ffb84d; border-color: #ffb84d; color: #000; font-weight: 700; }

.main-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 0 20px 40px; max-width: 1400px; margin: 0 auto; }

.majstori-list { background: #1a1a1a; border-radius: 12px; padding: 15px; max-height: 800px; overflow-y: auto; }
.majstori-list h3 { color: #ffb84d; margin-bottom: 15px; font-size: 18px; }
.majstor-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #222; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; border: 1px solid #333; }
.majstor-card:hover { transform: translateY(-3px); border-color: #ffb84d; box-shadow: 0 4px 12px rgba(255,184,77,0.2); }
.majstor-avatar { width: 50px; height: 50px; border-radius: 50%; background: #ffb84d; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; overflow: hidden; color: #000; }
.majstor-avatar img { width: 100%; height: 100%; object-fit: cover; }
.majstor-info { flex: 1; min-width: 0; }
.majstor-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.majstor-meta { font-size: 12px; color: #999; display: flex; gap: 8px; }
.majstor-rating { color: #ffb84d; font-weight: 600; }

.section-title { font-size: 24px; margin-bottom: 20px; color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.card { background: #1a1a1a; border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #222; }
.card:hover { transform: translateY(-5px); border-color: #ffb84d; }
.thumb { width: 100%; aspect-ratio: 1; background: #222; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: 15px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.card-author { font-size: 13px; color: #ffb84d; margin-bottom: 8px; }
.card-meta { display: flex; justify-content: space-between; font-size: 12px; color: #999; }
.cat-tag { background: #2a2a2a; padding: 3px 10px; border-radius: 12px; }

.footer { background: #111; padding: 40px 20px; border-top: 1px solid #222; text-align: center; color: #666; font-size: 14px; }

@media (max-width: 768px) {
  .main-layout { grid-template-columns: 1fr; }
  .majstori-list { max-height: none; display: flex; overflow-x: auto; gap: 10px; padding: 10px; }
  .majstori-list h3 { display: none; }
  .majstor-card { min-width: 150px; flex-direction: column; text-align: center; padding: 15px 10px; margin-bottom: 0; }
  .majstor-avatar { width: 60px; height: 60px; }
}
</style>
</head>
<body>

<header>
  <a href="/" class="logo">🔨 Мајстор.мк</a>
  <div class="header-right">
    <div id="clerk-header"></div>
  </div>
</header>

<section class="hero">
  <h1>Најди го вистинскиот<br><span>мајстор</span></h1>
  <p>Пребарај по град и услуга. Погледни ги сликите од завршените работи и избери го најдобриот.</p>
</section>

<div class="city-filter">
  <select id="city-select" onchange="filterByCity(this.value)">
    <option value="">📍 Сите градови</option>
  </select>
</div>

<div class="categories-wrapper">
  <div class="categories" id="categories-bar">
      <button class="cat-btn active" data-cat="all">Сите</button>
    <button class="cat-btn" data-cat="elektrika">⚡ Електрика</button>
    <button class="cat-btn" data-cat="vodovod">💧 Водовод</button>
    <button class="cat-btn" data-cat="gradeznistvo">🏗️ Градежништво</button>
    <button class="cat-btn" data-cat="popravki">🔧 Поправки</button>
    <button class="cat-btn" data-cat="finalni">🎨 Финални работи</button>
    <button class="cat-btn" data-cat="plockari">🔲 Плочкари</button>
    <button class="cat-btn" data-cat="gipsari">🧱 Гипсари и Молери</button>
    <button class="cat-btn" data-cat="stolari">🚪 Столари</button>
    <button class="cat-btn" data-cat="klima">❄️ Клима</button>
    <button class="cat-btn" data-cat="greenje">🔥 Греење</button>
    <button class="cat-btn" data-cat="krov">🏠 Кров</button>
    <button class="cat-btn" data-cat="sanitarii">🚿 Санитарии</button>
    <button class="cat-btn" data-cat="pvc">🪟 ПВЦ прозори и врати</button>
    <button class="cat-btn" data-cat="dvorovi">🌳 Уредување дворови</button>
    <button class="cat-btn" data-cat="cistenje">🧹 Чистење</button>
    <button class="cat-btn" data-cat="opti">🔨 Општи работници</button>
    <button class="cat-btn" data-cat="bravari">🔨 Браварски услуги</button>
    <button class="cat-btn" data-cat="belatehnika">🔌 Бела техника</button>
    <button class="cat-btn" data-cat="videonadzor">📹 Видео надзор</button>
    <button class="cat-btn" data-cat="bazeni">🏊 Базени</button>
    <button class="cat-btn" data-cat="fasadi">🎨 Фасади</button>
    <button class="cat-btn" data-cat="iskop">🚜 Ископ</button>
    <button class="cat-btn" data-cat="hidroizolacija">💧 Хидро изолација</button>
    <button class="cat-btn" data-cat="otpad">🗑️ Фрлање отпад</button>
  </div>
</div>

<div class="main-layout">
  <div class="majstori-list">
    <h3>👷 Мајстори</h3>
    <div id="majstori-grid"></div>
  </div>
  <div>
    <h2 class="section-title">📸 Најнови слики од работа</h2>
    <div class="grid" id="grid">
      <div class="loading" style="text-align:center; padding:40px; color:#666; grid-column: 1/-1;">Вчитувам слики...</div>
    </div>
  </div>
</div>

<footer class="footer">
  <p>© 2026 Мајстор.мк · Сите права задржани 🇲🇰</p>
</footer>

<script>
const CITIES = ['Скопје','Битола','Куманово','Прилеп','Тетово','Велес','Штип','Охрид','Гостивар','Струмица','Кавадарци','Кочани','Кичево','Струга','Радовиш','Гевгелија','Дебар','Крива Паланка','Свети Николе','Неготино','Делчево','Ресен','Пробиштип','Берово','Кратово','Крушево','Валандово','Македонски Брод','Демир Хисар','Демир Капија','Богданци','Дојран','Пехчево','Виница'];

const CAT_NAMES = {
  elektrika: "Електрика", vodovod: "Водовод", gradeznistvo: "Градежништво",
  popravki: "Поправки", finalni: "Финални работи", plockari: "Плочкари",
  gipsari: "Гипсари и Молери", stolari: "Столари", klima: "Клима",
  greenje: "Греење", krov: "Кров", sanitarii: "Санитарии",
  pvc: "ПВЦ прозори и врати", dvorovi: "Уредување дворови", cistenje: "Чистење",
  opti: "Општи работници", bravari: "Браварски услуги", belatehnika: "Бела техника",
  videonadzor: "Видео надзор", bazeni: "Базени", fasadi: "Фасади", iskop: "Ископ",
  hidroizolacija: "Хидро изолација", otpad: "Фрлање отпад"
};

let majstori = [];
let images = [];
let currentFilter = 'all';
let currentCityFilter = '';

// Пополнување на градови
const citySelect = document.getElementById('city-select');
CITIES.forEach(c => citySelect.innerHTML += `<option value="${c}">📍 ${c}</option>`);

// Вчитување на мајстори
async function loadMajstori() {
  try {
    const res = await fetch('/api/majstori');
    const data = await res.json();
    majstori = data.map(m => ({ ...m, computed_rating: m.rating || 0 }));
    renderMajstori();
  } catch (error) {
    console.error("Грешка при вчитување на мајстори:", error);
  }
}

// Вчитување на слики (само слики, без видеа)
async function loadImages() {
  try {
    const res = await fetch('/api/media');
    const data = await res.json();
    images = data.filter(m => m.type === 'image');
    renderImages();
  } catch (error) {
    console.error("Грешка при вчитување на слики:", error);
    document.getElementById('grid').innerHTML = '<div style="text-align:center; padding:40px; color:#666; grid-column: 1/-1;">Нема достапни слики.</div>';
  }
}

function renderMajstori() {
  const grid = document.getElementById('majstori-grid');
  grid.innerHTML = '';
  let filtered = majstori.filter(m => currentFilter === "all" || m.category === currentFilter);
  if (currentCityFilter) filtered = filtered.filter(m => m.city === currentCityFilter);
  
  if (filtered.length === 0) { 
    grid.innerHTML = `<div style="text-align:center; padding:20px; color:#666;">Нема мајстори во оваа категорија.</div>`; 
    return; 
  }

  filtered.sort((a, b) => {
    if (a.is_premium && !b.is_premium) return -1;
    if (!a.is_premium && b.is_premium) return 1;
    return (b.computed_rating || 0) - (a.computed_rating || 0);
  });

  filtered.forEach(m => {
    const rating = m.computed_rating ? `⭐ ${m.computed_rating}` : '';
    const avatar = m.photo_url ? `<img src="${m.photo_url}" alt="${m.name}">` : (m.name || '?').charAt(0).toUpperCase();
    grid.innerHTML += `
      <div class="majstor-card" onclick="window.location.href='/profile.html?id=${m.id}'">
        <div class="majstor-avatar">${avatar}</div>
        <div class="majstor-info">
          <div class="majstor-name">${m.name || 'Мајстор'}</div>
          <div class="majstor-meta">
            <span>${CAT_NAMES[m.category] || m.category}</span>
            <span class="majstor-rating">${rating}</span>
          </div>
        </div>
      </div>`;
  });
}

function renderImages() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let filtered = images.filter(v => {
    if (currentFilter === "all") return true;
    const m = majstori.find(x => x.id == v.majstor_id);
    return m && m.category === currentFilter;
  });
  
  if (currentCityFilter) {
    filtered = filtered.filter(v => {
      const m = majstori.find(x => x.id === v.majstor_id);
      return m && m.city === currentCityFilter;
    });
  }

  if (filtered.length === 0) { 
    grid.innerHTML = '<div style="text-align:center; padding:40px; color:#666; grid-column: 1/-1;">Нема слики во оваа категорија.</div>'; 
    return; 
  }

  filtered.forEach(v => {
    const majstor = majstori.find(x => x.id === v.majstor_id);
    const authorName = majstor ? majstor.name : 'Мајстор';
    const catName = majstor ? (CAT_NAMES[majstor.category] || majstor.category) : '';
    
    grid.innerHTML += `
      <div class="card" onclick="window.location.href='/profile.html?id=${v.majstor_id}'">
        <div class="thumb"><img loading="lazy" src="${v.url}" alt="Слика"></div>
        <div class="card-body">
          <div class="card-title">📸 Слика од работа</div>
          <div class="card-author">👤 ${authorName}</div>
          <div class="card-meta">
            <span class="cat-tag">${catName}</span>
            <span style="color:#ffb84d; font-weight:600;">Види профил →</span>
          </div>
        </div>
      </div>`;
  });
}

// Филтри
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.cat;
    renderMajstori();
    renderImages();
  });
});

function filterByCity(city) {
  currentCityFilter = city;
  renderMajstori();
  renderImages();
}

// ===== CLERK AUTHENTICATION =====
window.addEventListener('load', async function () {
  await window.Clerk.load();
  const clerkHeader = document.getElementById('clerk-header');
  if (!clerkHeader) return;

  function updateClerkUI() {
    clerkHeader.innerHTML = ''; 
    if (window.Clerk.user) {
               const email = window.Clerk.user.primaryEmailAddress.emailAddress;
          let myId = 35; // Стандардно за Дарко

          if (email === 'majsto.info@gmail.com') {
            myId = 29; // Ова е ID-то за "Majstor mk"
          } else if (email === 'marjanmladenovski1406986@gmail.com') {
            myId = 35; // Ова е ID-то за Дарко
          }

          const profileBtn = document.createElement('a');
          profileBtn.href = `/profile.html?id=${myId}`; 
          profileBtn.className = 'btn-auth';
          profileBtn.style.marginRight = '10px';
          profileBtn.style.textDecoration = 'none';
          profileBtn.innerHTML = `👤 Мој Профил`;
          clerkHeader.appendChild(profileBtn);;

      window.Clerk.mountUserButton(clerkHeader, { afterSignOutUrl: '/' });
    } else {
      const loginBtn = document.createElement('button');
      loginBtn.className = 'btn-auth'; 
      loginBtn.textContent = 'Најава';
      loginBtn.onclick = () => window.Clerk.redirectToSignIn(); 
      clerkHeader.appendChild(loginBtn);
    }
  }
  updateClerkUI();
  window.Clerk.addListener(() => updateClerkUI());
});

// Стартувај
loadMajstori().then(() => {
  loadImages();
});
</script>
</body>
</html>
