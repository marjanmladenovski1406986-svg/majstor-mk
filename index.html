<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мајстор.мк</title>
<script defer src="/_vercel/insights/script.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; }

header {
  background: #1a1a1a;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #2a2a2a;
  flex-wrap: wrap;
  gap: 10px;
}
.logo { font-size: 20px; font-weight: 700; color: #ff6b35; cursor: pointer; }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lang-switch { display: flex; gap: 5px; }
.lang-btn { background: #2a2a2a; border: 1px solid #333; color: #999; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
.lang-btn.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
.user-box { display: flex; align-items: center; gap: 10px; }
.user-email { color: #ff6b35; font-size: 13px; font-weight: 600; }
.btn-auth { background: #ff6b35; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; }
.btn-auth.logout { background: transparent; border: 1px solid #333; color: #999; }
.btn-auth:hover { opacity: 0.9; }

.hero { text-align: center; padding: 40px 20px 30px; }
.hero h1 { font-size: 32px; margin-bottom: 15px; color: #ff6b35; }
.hero p { color: #999; font-size: 16px; max-width: 600px; margin: 0 auto; }

.categories { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
.cat-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; padding: 10px 18px; border-radius: 25px; cursor: pointer; font-size: 14px; font-family: inherit; }
.cat-btn.active { background: #ff6b35; border-color: #ff6b35; }

.section-title { padding: 0 20px; margin-bottom: 20px; font-size: 22px; }
.loading { text-align: center; color: #999; padding: 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 0 20px 40px; }
.card { background: #1a1a1a; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
.card:hover { transform: translateY(-3px); }
.thumb { width: 100%; aspect-ratio: 16/9; background: #2a2a2a; position: relative; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb::after { content: '▶'; position: absolute; width: 50px; height: 50px; background: rgba(255,107,53,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.card-body { padding: 15px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.3; }
.card-meta { display: flex; justify-content: space-between; font-size: 13px; color: #999; }
.cat-tag { background: #2a2a2a; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
.cat-tag.elektrika { background: #4a3a1a; color: #ffb84d; }
.cat-tag.vodovod { background: #1a3a4a; color: #4db8ff; }
.cat-tag.gradeznistvo { background: #3a2a1a; color: #d4a373; }
.cat-tag.popravki { background: #2a3a1a; color: #8bc34a; }
.cat-tag.finalni { background: #3a1a3a; color: #e91e63; }

footer { background: #1a1a1a; padding: 30px; text-align: center; color: #666; }

/* MODAL ЛОГИРАЊЕ */
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal.open { display: flex; }
.modal-content { background: #1a1a1a; padding: 30px; border-radius: 16px; max-width: 400px; width: 100%; border: 1px solid #2a2a2a; }
.modal-content h2 { color: #ff6b35; text-align: center; margin-bottom: 20px; }
.modal-content input { width: 100%; padding: 14px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 12px; font-family: inherit; }
.modal-content input:focus { outline: none; border-color: #ff6b35; }
.modal-content button { width: 100%; padding: 14px; background: #ff6b35; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 10px; }
.modal-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.modal-tab { flex: 1; padding: 12px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #999; cursor: pointer; font-size: 14px; font-family: inherit; }
.modal-tab.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
.modal-msg { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; }
.modal-msg.error { background: #3a1a1a; color: #ff6b6b; display: block; }
.modal-msg.success { background: #1a3a1a; color: #6bff6b; display: block; }
.modal-msg.info { background: #1a2a3a; color: #6bb8ff; display: block; }
.hidden { display: none; }

/* ВИДЕО МОДАЛ */
.video-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 1001; align-items: center; justify-content: center; padding: 20px; }
.video-modal.open { display: flex; }
.video-modal-content { max-width: 900px; width: 100%; }
.video-modal iframe { width: 100%; aspect-ratio: 16/9; border-radius: 12px; border: none; }
.video-close { position: absolute; top: 20px; right: 20px; background: #ff6b35; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="logo">🔨 <span id="logo-text">Мајстор.мк</span></div>
  <div class="header-right">
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="mk" onclick="switchLang('mk')">🇲🇰 МК</button>
      <button class="lang-btn" data-lang="en" onclick="switchLang('en')">🇬🇧 EN</button>
    </div>
    <div id="auth-area">
      <button class="btn-auth" onclick="openModal()" id="btn-login-header">Најава</button>
    </div>
    <div id="user-area" class="user-box hidden">
      <span class="user-email" id="user-email-header"></span>
      <button class="btn-auth logout" onclick="handleLogout()" id="btn-logout-header">Одјави се</button>
    </div>
  </div>
</header>

<section class="hero">
  <h1 id="hero-title">Научи сам. Поправи сам.<br>Или одбери си мајстор.</h1>
  <p id="hero-text">Најдобрите видеа и мајстори се тука. Логирај се за да ги видиш.</p>
</section>

<div class="categories">
  <button class="cat-btn active" data-cat="all" id="cat-all">Сите</button>
  <button class="cat-btn" data-cat="elektrika" id="cat-elektrika">⚡ Електрика</button>
  <button class="cat-btn" data-cat="vodovod" id="cat-vodovod">💧 Водовод</button>
  <button class="cat-btn" data-cat="gradeznistvo" id="cat-gradeznistvo">🏗️ Градежништво</button>
  <button class="cat-btn" data-cat="popravki" id="cat-popravki">🔧 Поправки</button>
  <button class="cat-btn" data-cat="finalni" id="cat-finalni">🎨 Финални работи</button>
</div>

<h2 class="section-title" id="section-title">🔥 Најнови видеа</h2>
<div class="loading" id="loading">Вчитувам видеа...</div>
<div class="grid" id="grid"></div>

<footer>
  <p id="footer-text">© 2026 Мајстор.мк</p>
</footer>

<!-- MODAL ЛОГИРАЊЕ -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modal-title">🔨 Мајстор.мк</h2>
    <div class="modal-tabs">
      <button class="modal-tab active" id="modal-tab-login" onclick="showModalTab('login')">Најава</button>
      <button class="modal-tab" id="modal-tab-register" onclick="showModalTab('register')">Регистрација</button>
    </div>
    <div id="modal-msg" class="modal-msg"></div>
    <div id="modal-form-login">
      <input type="email" id="login-email" placeholder="Е-пошта">
      <input type="password" id="login-password" placeholder="Лозинка">
      <button onclick="handleLogin()" id="btn-modal-login">Најави се</button>
    </div>
    <div id="modal-form-register" class="hidden">
      <input type="email" id="register-email" placeholder="Е-пошта">
      <input type="password" id="register-password" placeholder="Лозинка (мин. 6 знаци)">
      <button onclick="handleRegister()" id="btn-modal-register">Регистрирај се</button>
    </div>
    <button onclick="closeModal()" style="background:transparent; border:1px solid #333; color:#999;">Затвори</button>
  </div>
</div>

<!-- VIDEO MODAL -->
<div class="video-modal" id="videoModal">
  <button class="video-close" onclick="closeVideo()">✕</button>
  <div class="video-modal-content">
    <iframe id="videoFrame" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://brxdimqgujhemgpfujcq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyeGRpbXFndWpoZW1ncGZ1amNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTgxMjYsImV4cCI6MjEwNDc5NDEyNn0.gh0vekUMPmzg5EbkGvaRFLfBL8SWsjGUvB1BY4H5T5Y';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let videos = [];

async function loadVideos() {
  document.getElementById('loading').style.display = 'block';
  const { data, error } = await supabaseClient
    .from('videos')
    .select('*')
    .order('id', { ascending: false });

  if (error) {
    console.error('Грешка при вчитување:', error);
    document.getElementById('loading').textContent = 'Грешка при вчитување видеа';
    return;
  }

  videos = data.map(v => ({
    title: v.title,
    titleEn: v.title_en,
    youtube: v.youtube_id,
    cat: v.category,
    likes: v.likes
  }));

  document.getElementById('loading').style.display = 'none';
  render();
}

const catNames = {
  mk: { elektrika: "Електрика", vodovod: "Водовод", gradeznistvo: "Градежништво", popravki: "Поправки", finalni: "Финални работи" },
  en: { elektrika: "Electric", vodovod: "Plumbing", gradeznistvo: "Construction", popravki: "Repairs", finalni: "Finishing" }
};

const t = {
  mk: {
    logo: "Мајстор.мк", login: "Најава", logout: "Одјави се",
    heroTitle: "Научи сам. Поправи сам. Или одбери си мајстор.",
    heroText: "Најдобрите видеа и мајстори се тука. Логирај се за да ги видиш.",
    all: "Сите", elektrika: "⚡ Електрика", vodovod: "💧 Водовод", gradeznistvo: "🏗️ Градежништво",
    popravki: "🔧 Поправки", finalni: "🎨 Финални работи",
    latest: "🔥 Најнови видеа", footer: "© 2026 Мајстор.мк",
    modalTitle: "🔨 Мајстор.мк", tabLogin: "Најава", tabRegister: "Регистрација",
    email: "Е-пошта", password: "Лозинка", passwordMin: "Лозинка (мин. 6 знаци)",
    btnLogin: "Најави се", btnRegister: "Регистрирај се",
    enterBoth: "Внеси е-пошта и лозинка", loggingIn: "Се најавувам...", loginSuccess: "Успешно најавување!",
    registering: "Се регистрирам...", registerSuccess: "Успешна регистрација!",
    passwordShort: "Лозинката мора да има најмалку 6 знаци", logoutSuccess: "Одјавен си",
    error: "Грешка: "
  },
  en: {
    logo: "MasterHow", login: "Login", logout: "Sign out",
    heroTitle: "Learn it. Fix it. Or choose a master.",
    heroText: "The best videos and masters are here. Log in to see them.",
    all: "All", elektrika: "⚡ Electric", vodovod: "💧 Plumbing", gradeznistvo: "🏗️ Construction",
    popravki: "🔧 Repairs", finalni: "🎨 Finishing",
    latest: "🔥 Latest Videos", footer: "© 2026 MasterHow",
    modalTitle: "🔨 MasterHow", tabLogin: "Login", tabRegister: "Register",
    email: "Email", password: "Password", passwordMin: "Password (min. 6 chars)",
    btnLogin: "Sign in", btnRegister: "Sign up",
    enterBoth: "Enter email and password", loggingIn: "Signing in...", loginSuccess: "Login successful!",
    registering: "Registering...", registerSuccess: "Registration successful!",
    passwordShort: "Password must be at least 6 characters", logoutSuccess: "Signed out",
    error: "Error: "
  }
};

let currentLang = 'mk';
let currentFilter = 'all';

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (videos.length === 0) {
    grid.innerHTML = '<div class="loading">Нема видеа</div>';
    return;
  }
  videos.filter(v => currentFilter === "all" || v.cat === currentFilter).forEach(v => {
    const title = currentLang === 'mk' ? v.title : (v.titleEn || v.title);
    const thumbUrl = `https://img.youtube.com/vi/${v.youtube}/hqdefault.jpg`;
    grid.innerHTML += `
      <div class="card" onclick="openVideo('${v.youtube}')">
        <div class="thumb"><img src="${thumbUrl}" alt="${title}"></div>
        <div class="card-body">
          <div class="card-title">${title}</div>
          <div class="card-meta">
            <span class="cat-tag ${v.cat}">${catNames[currentLang][v.cat] || v.cat}</span>
            <span>❤️ ${v.likes}</span>
          </div>
        </div>
      </div>`;
  });
}

function openVideo(youtubeId) {
  document.getElementById('videoFrame').src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
  document.getElementById('videoModal').classList.add('open');
}

function closeVideo() {
  document.getElementById('videoFrame').src = '';
  document.getElementById('videoModal').classList.remove('open');
}

function switchLang(lang) {
  currentLang = lang;
  const tr = t[lang];
  document.getElementById('logo-text').textContent = tr.logo;
  document.getElementById('hero-title').textContent = tr.heroTitle;
  document.getElementById('hero-text').textContent = tr.heroText;
  document.getElementById('section-title').textContent = tr.latest;
  document.getElementById('footer-text').textContent = tr.footer;
  document.getElementById('cat-all').textContent = tr.all;
  document.getElementById('cat-elektrika').textContent = tr.elektrika;
  document.getElementById('cat-vodovod').textContent = tr.vodovod;
  document.getElementById('cat-gradeznistvo').textContent = tr.gradeznistvo;
  document.getElementById('cat-popravki').textContent = tr.popravki;
  document.getElementById('cat-finalni').textContent = tr.finalni;
  document.getElementById('btn-login-header').textContent = tr.login;
  document.getElementById('btn-logout-header').textContent = tr.logout;
  document.getElementById('modal-title').textContent = tr.modalTitle;
  document.getElementById('modal-tab-login').textContent = tr.tabLogin;
  document.getElementById('modal-tab-register').textContent = tr.tabRegister;
  document.getElementById('login-email').placeholder = tr.email;
  document.getElementById('login-password').placeholder = tr.password;
  document.getElementById('register-email').placeholder = tr.email;
  document.getElementById('register-password').placeholder = tr.passwordMin;
  document.getElementById('btn-modal-login').textContent = tr.btnLogin;
  document.getElementById('btn-modal-register').textContent = tr.btnRegister;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  render();
}

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.cat;
    render();
  });
});

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function showModalTab(tab) {
  document.getElementById('modal-tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('modal-tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('modal-form-login').classList.toggle('hidden', tab !== 'login');
  document.getElementById('modal-form-register').classList.toggle('hidden', tab !== 'register');
}

function showModalMsg(text, type) {
  const msg = document.getElementById('modal-msg');
  msg.textContent = text;
  msg.className = 'modal-msg ' + type;
}

async function handleLogin() {
  const tr = t[currentLang];
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showModalMsg(tr.enterBoth, 'error'); return; }
  showModalMsg(tr.loggingIn, 'info');
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { showModalMsg(tr.error + error.message, 'error'); return; }
  showModalMsg(tr.loginSuccess, 'success');
  setTimeout(() => { closeModal(); showLoggedIn(data.user.email); }, 800);
}

async function handleRegister() {
  const tr = t[currentLang];
  const email = document.getElementById('register-email').value;
  const password = document.getElementById('register-password').value;
  if (!email || !password) { showModalMsg(tr.enterBoth, 'error'); return; }
  if (password.length < 6) { showModalMsg(tr.passwordShort, 'error'); return; }
  showModalMsg(tr.registering, 'info');
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) { showModalMsg(tr.error + error.message, 'error'); return; }
  showModalMsg(tr.registerSuccess, 'success');
  setTimeout(() => { closeModal(); showLoggedIn(data.user.email); }, 800);
}

async function handleLogout() {
  await supabaseClient.auth.signOut();
  document.getElementById('auth-area').classList.remove('hidden');
  document.getElementById('user-area').classList.add('hidden');
}

function showLoggedIn(email) {
  document.getElementById('auth-area').classList.add('hidden');
  document.getElementById('user-area').classList.remove('hidden');
  document.getElementById('user-email-header').textContent = email;
}

async function checkUser() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (user) showLoggedIn(user.email);
}

checkUser();
loadVideos();
</script>

</body>
</html>
