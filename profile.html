<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Мајстор — Majsto.mk</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ff6b35">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }

header { background: #111; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
.logo { font-size: 20px; font-weight: 700; color: #ffb84d; text-decoration: none; }
.btn-back { background: transparent; border: 1px solid #444; color: #999; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; text-decoration: none; }

.container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
.profile-header { background: #1a1a1a; border-radius: 16px; padding: 30px; margin-bottom: 25px; border: 1px solid #333; }
.profile-top { display: flex; align-items: center; gap: 25px; flex-wrap: wrap; margin-bottom: 25px; position: relative; }
.big-avatar { width: 120px; height: 120px; border-radius: 50%; background: #ffb84d; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 700; flex-shrink: 0; overflow: hidden; color: #000; }
.big-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-name-block { flex: 1; min-width: 200px; }
.profile-name { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
.profile-category { color: #ffb84d; font-size: 16px; margin-bottom: 8px; }
.profile-rating { color: #ffb84d; font-size: 20px; font-weight: 600; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 25px; }
.stat-box { background: #111; border-radius: 12px; padding: 18px; text-align: center; border: 1px solid #222; }
.stat-box .num { font-size: 28px; font-weight: 700; color: #ffb84d; }
.stat-box .lbl { font-size: 12px; color: #999; margin-top: 5px; }

.info-section { margin-bottom: 25px; }
.info-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #222; font-size: 15px; }
.info-row span:first-child { color: #999; }
.info-row span:last-child { font-weight: 600; text-align: right; }

.contact-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.btn-contact { padding: 14px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; font-family: inherit; }
.btn-phone { background: #ffb84d; color: #000; }
.btn-fb { background: #1877f2; color: #fff; }
.btn-web { background: #222; color: #fff; border: 1px solid #ffb84d; }

.section { background: #1a1a1a; border-radius: 12px; padding: 25px; margin-bottom: 25px; border: 1px solid #333; }
.section h2 { color: #ffb84d; font-size: 22px; margin-bottom: 20px; }

.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.media-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #222; cursor: pointer; }
.media-item img { width: 100%; height: 100%; object-fit: cover; }

/* 10 празни полиња за качување */
.upload-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.upload-slot { aspect-ratio: 1; border: 2px dashed #444; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #666; transition: 0.2s; background: #111; }
.upload-slot:hover { border-color: #ffb84d; color: #ffb84d; }
.upload-slot span { font-size: 30px; margin-bottom: 5px; }

.loading { text-align: center; color: #999; padding: 60px 20px; font-size: 16px; }
.error-box { text-align: center; color: #ff6b6b; padding: 60px 20px; }

.share-btn { position: absolute; top: 0; right: 0; background: transparent; border: 1px solid #ffb84d; color: #ffb84d; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }

@media (max-width: 768px) {
  .profile-top { flex-direction: column; text-align: center; }
  .share-btn { position: static; margin-top: 15px; width: 100%; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<header>
  <a href="/" class="logo">🔨 Majsto.mk</a>
  <a href="/" class="btn-back">← Назад кон сајтот</a>
</header>

<div class="container" id="content">
  <div class="loading">Вчитувам профил...</div>
</div>

<script>
const CAT_NAMES = {
  elektrika: "⚡ Електрика", vodovod: "💧 Водовод", gradeznistvo: "🏗️ Градежништво",
  popravki: "🔧 Поправки", finalni: "🎨 Финални работи", plockari: "🔲 Плочкари",
  gipsari: "🧱 Гипсари и Молери", stolari: "🚪 Столари", klima: "❄️ Клима",
  greenje: "🔥 Греење", krov: "🏠 Кров", sanitarii: "🚿 Санитарии",
  pvc: "🪟 ПВЦ прозори и врати", dvorovi: "🌳 Уредување дворови", cistenje: "🧹 Чистење",
  opti: "🔨 Општи работници", bravari: "🔨 Браварски услуги", belatehnika: "🔌 Бела техника",
  videonadzor: "📹 Видео надзор", bazeni: "🏊 Базени", fasadi: "🎨 Фасади", iskop: "🚜 Ископ",
  hidroizolacija: "💧 Хидро изолација", otpad: "🗑️ Фрлање отпад"
};

let majstorId = null;
let majstorData = null;
let currentUser = null;

async function init() {
  const urlParams = new URLSearchParams(window.location.search);
  majstorId = urlParams.get('id');

  if (!majstorId) {
    showError('Не е пронајден мајстор', 'Не е специфициран ID на мајстор.');
    return;
  }

  await loadMajstor();
  await loadMedia();
  await loadRatings();
}

function showError(title, msg) {
  document.getElementById('content').innerHTML = `
    <div class="error-box">
      <h2>❌ ${title}</h2>
      <p>${msg}</p>
      <p style="margin-top:20px;"><a href="/" style="color:#ffb84d;">← Назад кон сајтот</a></p>
    </div>`;
}

async function loadMajstor() {
  try {
    const res = await fetch('/api/majstori');
    const data = await res.json();
    const majstor = data.find(m => m.id == majstorId);

    if (!majstor) {
      showError('Мајстор не е најден', 'Овој мајстор не постои.');
      return;
    }
    
    majstorData = majstor;

    const resRatings = await fetch('/api/ratings');
    const allRatings = await resRatings.json();
    const ratings = allRatings.filter(r => r.majstor_id == majstorId);

    const baseSum = (majstor.rating || 0) * (majstor.rating_count || 0);
    const newSum = ratings.reduce((s, r) => s + r.rating, 0);
    const totalCount = (majstor.rating_count || 0) + ratings.length;
    const avgRating = totalCount > 0 ? ((baseSum + newSum) / totalCount).toFixed(1) : 0;

    const catText = CAT_NAMES[majstor.category] || majstor.category;
    const avatar = majstor.photo_url ? `<img src="${majstor.photo_url}" alt="${majstor.name}">` : (majstor.name || '?').charAt(0).toUpperCase();

    document.getElementById('page-title').textContent = `${majstor.name} - ${catText} | Majsto.mk`;

    document.getElementById('content').innerHTML = `
      <div class="profile-header">
        <div class="profile-top">
          <div class="big-avatar">${avatar}</div>
          <div class="profile-name-block">
            <div class="profile-name">${majstor.name || 'Majstor'} ${majstor.is_premium ? '👑' : ''}</div>
            <div class="profile-category">${catText}</div>
            <div class="profile-rating">⭐ ${avgRating} (${totalCount} оценки)</div>
          </div>
          <button class="share-btn" onclick="alert('Линкот е копиран!')">📤 Сподели</button>
        </div>

        <div class="info-section">
          <div class="info-row"><span>📂 Категорија</span><span>${catText}</span></div>
          <div class="info-row"><span>🏙️ Град</span><span>${majstor.city || '-'}</span></div>
          ${majstor.description ? `<div class="info-row"><span>📝 Опис</span><span>${majstor.description}</span></div>` : ''}
        </div>

        <div class="contact-buttons">
          ${majstor.phone ? `<a href="tel:${majstor.phone}" class="btn-contact btn-phone">📞 ${majstor.phone}</a>` : ''}
          ${majstor.facebook_url ? `<a href="${majstor.facebook_url}" target="_blank" class="btn-contact btn-fb">📘 Facebook</a>` : ''}
          ${majstor.website_url ? `<a href="${majstor.website_url}" target="_blank" class="btn-contact btn-web">🌐 Веб-сајт</a>` : ''} 
        </div>
      </div>

      <div class="section">
        <h2>📸 Слики од работата</h2>
        <div class="media-grid" id="imagesGrid">
          <div class="loading">Вчитувам слики...</div>
        </div>
      </div>

      <div class="section" id="uploadSection" style="display: none;">
        <h2>📤 Додај слика</h2>
        <p style="color:#999; margin-bottom: 15px; font-size: 14px;">Кликни на полето за да качиш слика (автоматски се зачувува).</p>
        <div class="upload-grid">
          <!-- Овде ќе бидат 10-те полиња -->
          <div class="upload-slot" onclick="document.getElementById('fileInput').click()">
            <span>+</span>
            <p>Додај слика</p>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadImage(this)">
      </div>

      <div class="section">
        <h2>⭐ Оценки и коментари</h2>
        <div id="ratingsContent">
          <div class="loading">Вчитувам оценки...</div>
        </div>
      </div>
    `;
    
    // Прикажи го делот за качување (за сега секогаш, подоцна ќе го врземе со Clerk)
    document.getElementById('uploadSection').style.display = 'block';

  } catch (error) {
    console.error("Грешка:", error);
    showError('Грешка', 'Настана проблем при вчитување.');
  }
}

async function loadMedia() {
  try {
    const resMedia = await fetch('/api/media');
    const mediaData = await resMedia.json();
    
    const images = mediaData.filter(m => m.type === 'image' && m.majstor_id == majstorId);

    const imgGrid = document.getElementById('imagesGrid');
    if (images && images.length > 0) {
      imgGrid.innerHTML = images.map(img => `
        <div class="media-item" onclick="window.open('${img.url}', '_blank')">
          <img loading="lazy" src="${img.url}" alt="Слика">
        </div>`).join('');
    } else {
      imgGrid.innerHTML = '<p style="color:#666; text-align:center; padding:20px; grid-column: 1/-1;">Нема слики сè уште</p>';
    }
  } catch (error) {
    console.error("Грешка при медиуми:", error);
  }
}

async function loadRatings() {
  try {
    const res = await fetch('/api/ratings');
    const data = await res.json();
    const myRatings = data.filter(r => r.majstor_id == majstorId);
    
    const content = document.getElementById('ratingsContent');
    if (!myRatings || myRatings.length === 0) {
      content.innerHTML = '<p style="color:#666; text-align:center; padding:20px;">Нема оценки сè уште</p>';
      return;
    }

    content.innerHTML = myRatings.map(r => {
      const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
      const date = new Date(r.created_at).toLocaleDateString('mk-MK');
      return `<div style="padding:15px; background:#252525; border-radius:10px; margin-bottom:10px;">
        <div style="color:#ffb84d; font-size:18px; margin-bottom:8px;">${stars}</div>
        ${r.comment ? `<div style="color:#ddd; font-size:14px; margin-bottom:8px;">${r.comment}</div>` : ''}
        <div style="color:#666; font-size:11px;">${date}</div>
      </div>`;
    }).join('');
  } catch (error) {
    console.error("Грешка при оценки:", error);
  }
}

// Функција за качување на слика преку ImgBB
async function uploadImage(input) {
  const file = input.files[0];
  if (!file) return;

  alert("Почнувам качување...");

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/upload', {
      method: 'POST',
      body: formData
    });
    
    const data = await res.json();
    
    if (data.secure_url) {
      alert("✅ Сликата е качена успешно! Линк: " + data.secure_url);
      // Тука подоцна ќе додадеме код за зачувување на линкот во базата (Neon)
      // За сега, само освежи ја страницата за да видиш дека е качена
      window.location.reload();
    } else {
      alert("❌ Грешка при качување: " + JSON.stringify(data));
    }
  } catch (err) {
    alert("❌ Грешка во мрежата: " + err.message);
  }
}

init();
</script>
</body>
</html>
