<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мајстор — Majsto.mk</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#ff6b35">

<!-- Clerk Authentication -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA"
  src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"
></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
header { background: #111; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
.logo { font-size: 20px; font-weight: 700; color: #ff6b35; text-decoration: none; }
.btn-back { background: transparent; border: 1px solid #444; color: #999; padding: 8px 15px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 13px; }

.container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
.profile-header { background: #1a1a1a; border-radius: 16px; padding: 30px; margin-bottom: 25px; border: 1px solid #333; }
.profile-top { display: flex; align-items: center; gap: 25px; flex-wrap: wrap; margin-bottom: 25px; position: relative; }
.big-avatar { width: 120px; height: 120px; border-radius: 50%; background: #ff6b35; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 700; flex-shrink: 0; overflow: hidden; color: #000; }
.big-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-name-block { flex: 1; min-width: 200px; }
.profile-name { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
.profile-category { color: #ff6b35; font-size: 16px; margin-bottom: 8px; }
.profile-rating { color: #ffb84d; font-size: 20px; font-weight: 600; }

.info-section { margin-bottom: 25px; }
.info-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #222; font-size: 15px; }
.info-row span:first-child { color: #999; }
.info-row span:last-child { font-weight: 600; text-align: right; }

.contact-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.btn-contact { padding: 14px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; }
.btn-phone { background: #ff6b35; color: #fff; }
.btn-fb { background: #1877f2; color: #fff; }
.btn-web { background: #222; color: #fff; border: 1px solid #ff6b35; }

.section { background: #1a1a1a; border-radius: 12px; padding: 25px; margin-bottom: 25px; border: 1px solid #333; }
.section h2 { color: #ff6b35; font-size: 22px; margin-bottom: 20px; }

.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.media-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #222; }
.media-item img { width: 100%; height: 100%; object-fit: cover; }
.delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(220, 53, 53, 0.9); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }

/* Settings Section */
#settingsSection { display: none; }
.settings-btn { background: #222; border: 1px solid #444; color: #fff; padding: 12px 20px; border-radius: 8px; cursor: pointer; margin: 5px; font-family: inherit; font-size: 14px; transition: 0.2s; }
.settings-btn:hover { border-color: #ff6b35; }
.upload-btn { background: #ff6b35; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; }

/* Modals */
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal.open { display: flex; }
.modal-content { background: #1a1a1a; padding: 30px; border-radius: 16px; max-width: 500px; width: 100%; border: 1px solid #333; max-height: 90vh; overflow-y: auto; }
.modal-content h2 { color: #ff6b35; text-align: center; margin-bottom: 20px; }
.modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 10px; font-family: inherit; }
.modal-content button { width: 100%; padding: 12px; background: #ff6b35; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
.modal-close { background: transparent !important; border: 1px solid #333 !important; color: #999 !important; }

.loading { text-align: center; color: #999; padding: 40px; }
.error-box { text-align: center; color: #ff6b6b; padding: 40px; }

.share-btn { position: absolute; top: 0; right: 0; background: transparent; border: 1px solid #ff6b35; color: #ff6b35; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }

@media (max-width: 768px) {
  .profile-top { flex-direction: column; text-align: center; }
  .share-btn { position: static; margin-top: 15px; width: 100%; }
}
</style>
</head>
<body>

<header>
  <a href="/" class="logo">🔨 Majsto.mk</a>
  <a href="/" class="btn-back">← Назад кон сајтот</a>
</header>

<div class="container" id="content">
  <div class="loading">Вчитувам профил...</div>
</div>

<!-- MODALS -->
<div class="modal" id="editInfoModal">
  <div class="modal-content">
    <h2>✏️ Уреди Информации</h2>
    <input type="text" id="edit-name" placeholder="Име">
    <input type="tel" id="edit-phone" placeholder="Телефон">
    <select id="edit-city"></select>
    <select id="edit-category"></select>
    <textarea id="edit-description" placeholder="Опис"></textarea>
    <input type="url" id="edit-facebook" placeholder="Facebook URL">
    <input type="url" id="edit-website" placeholder="Веб-сајт URL">
    <button onclick="handleEditInfo()">Зачувај</button>
    <button class="modal-close" onclick="document.getElementById('editInfoModal').classList.remove('open')">Откажи</button>
  </div>
</div>

<div class="modal" id="changeAvatarModal">
  <div class="modal-content">
    <h2>📸 Промени Профилна Слика</h2>
    <input type="file" id="avatar-file" accept="image/*">
    <button onclick="handleChangeAvatar()">Качи Слика</button>
    <button class="modal-close" onclick="document.getElementById('changeAvatarModal').classList.remove('open')">Откажи</button>
  </div>
</div>

<div class="modal" id="changeCoverModal">
  <div class="modal-content">
    <h2>🖼️ Промени Банеř</h2>
    <input type="file" id="cover-file" accept="image/*">
    <button onclick="handleChangeCover()">Качи Банеř</button>
    <button class="modal-close" onclick="document.getElementById('changeCoverModal').classList.remove('open')">Откажи</button>
  </div>
</div>

<script>
const CAT_NAMES = {
  elektrika: "⚡ Електрика", vodovod: "💧 Водовод", gradeznistvo: "🏗️ Градежништво",
  popravki: "🔧 Поправки", finalni: "🎨 Финални работи", plockari: "🔲 Плочкари",
  gipsari: "🧱 Гипсари и Молери", stolari: "🚪 Столари", klima: "❄️ Клима",
  greenje: "🔥 Греење", krov: "🏠 Кров", sanitarii: "🚿 Санитарии",
  pvc: "🪟 ПВЦ прозори и врати", dvorovi: "🌳 Уредување дворови", cistenje: "🧹 Чистење",
  opti: "🔨 Општи работници", bravari: "🔨 Браварски услуги", belatehnika: "🔌 Бела техника"
};
const CITIES = ['Скопје','Битола','Куманово','Прилеп','Тетово','Велес','Штип','Охрид','Гостивар','Струмица','Кавадарци','Кочани','Кичево','Струга','Радовиш','Гевгелија','Дебар','Крива Паланка','Свети Николе','Неготино','Делчево','Ресен','Пробиштип','Берово','Кратово','Крушево','Валандово','Македонски Брод','Демир Хисар','Демир Капија','Богданци','Дојран','Пехчево','Виница'];

let majstorId = null;
let majstorData = null;
let currentUser = null;
let isAdmin = false;

window.addEventListener('load', async function () {
  if (window.Clerk) {
    await window.Clerk.load();
    if (window.Clerk.user) {
      currentUser = window.Clerk.user.primaryEmailAddress.emailAddress;
      isAdmin = (currentUser === 'majsto.info@gmail.com' || currentUser === 'marjanmladenovski1406986@gmail.com');
    }
  }

  const urlParams = new URLSearchParams(window.location.search);
  majstorId = urlParams.get('id');

  if (!majstorId) {
    showError('Не е пронајден мајстор', 'Не е специфициран ID на мајстор.');
    return;
  }

  populateSelects();
  await loadMajstor();
  await loadMedia();
  await loadRatings();
});

function populateSelects() {
  const citySelect = document.getElementById('edit-city');
  const catSelect = document.getElementById('edit-category');
  
  CITIES.forEach(c => { citySelect.innerHTML += `<option value="${c}">${c}</option>`; });
  Object.keys(CAT_NAMES).forEach(k => { catSelect.innerHTML += `<option value="${k}">${CAT_NAMES[k]}</option>`; });
}

function showError(title, msg) {
  document.getElementById('content').innerHTML = `
    <div class="error-box">
      <h2>❌ ${title}</h2>
      <p>${msg}</p>
      <p style="margin-top:20px;"><a href="/" style="color:#ffb84d;">← Назад кон сајтот</a></p>
    </div>`;
}

async function loadMajstor() {
  try {
    const res = await fetch('/api/majstori');
    const data = await res.json();
    const majstor = data.find(m => m.id == majstorId);

    if (!majstor) { showError('Мајстор не е најден', 'Овој мајстор не постои.'); return; }
    
    majstorData = majstor;
    const catText = CAT_NAMES[majstor.category] || majstor.category;
    const avatar = majstor.photo_url ? `<img src="${majstor.photo_url}" alt="${majstor.name}">` : (majstor.name || '?').charAt(0).toUpperCase();
    
    // Пополнување на модалите за уредување
    document.getElementById('edit-name').value = majstor.name || '';
    document.getElementById('edit-phone').value = majstor.phone || '';
    document.getElementById('edit-city').value = majstor.city || '';
    document.getElementById('edit-category').value = majstor.category || '';
    document.getElementById('edit-description').value = majstor.description || '';
    document.getElementById('edit-facebook').value = majstor.facebook_url || '';
    document.getElementById('edit-website').value = majstor.website_url || '';

    document.title = `${majstor.name} - ${catText} | Majsto.mk`;

    document.getElementById('content').innerHTML = `
      <div class="profile-header">
        ${majstor.cover_url ? `<div style="width: 100%; height: 200px; background: #000 url('${majstor.cover_url}') center/contain no-repeat; border-radius: 16px 16px 0 0; margin-bottom: 20px;"></div>` : ''}
        <div class="profile-top">
          <div class="big-avatar">${avatar}</div>
          <div class="profile-name-block">
            <div class="profile-name">${majstor.name || 'Majstor'} ${majstor.is_premium ? '👑' : ''}</div>
            <div class="profile-category">${catText}</div>
            <div class="profile-rating">⭐ ${majstor.rating || 0} (${majstor.rating_count || 0} оценки)</div>
          </div>
          <button class="share-btn" onclick="alert('Линкот е копиран!')">📤 Сподели</button>
        </div>

        <div class="info-section">
          <div class="info-row"><span>🏙️ Град</span><span>${majstor.city || '-'}</span></div>
          <div class="info-row"><span>📝 Опис</span><span>${majstor.description || '-'}</span></div>
        </div>

        <div class="contact-buttons">
          ${majstor.phone ? `<a href="tel:${majstor.phone}" class="btn-contact btn-phone">📞 ${majstor.phone}</a>` : ''}
          ${majstor.facebook_url ? `<a href="${majstor.facebook_url}" target="_blank" class="btn-contact btn-fb">📘 Facebook</a>` : ''}
          ${majstor.website_url ? `<a href="${majstor.website_url}" target="_blank" class="btn-contact btn-web">🌐 Веб-сајт</a>` : ''} 
        </div>
      </div>

      <div class="section" id="settingsSection">
        <h2>⚙️ Поставки</h2>
        <button class="settings-btn" onclick="document.getElementById('changeAvatarModal').classList.add('open')">📸 Промени Профилна Слика</button>
        <button class="settings-btn" onclick="document.getElementById('changeCoverModal').classList.add('open')">🖼️ Промени Банеř</button>
        <button class="settings-btn" onclick="document.getElementById('editInfoModal').classList.add('open')">✏️ Уреди Информации</button>
      </div>

      <div class="section" id="uploadSection">
        <h2>📤 Управувај со слики</h2>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ Додај нова слика</button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadImage(this)">
      </div>

      <div class="section">
        <h2>📸 Слики од работата</h2>
        <div class="media-grid" id="imagesGrid">
          <div class="loading">Вчитувам слики...</div>
        </div>
      </div>

      <div class="section">
        <h2>⭐ Оценки и коментари</h2>
        <div id="ratingsContent">
          <div class="loading">Вчитувам оценки...</div>
        </div>
      </div>
    `;

       const isOwner = (currentUser && majstor.email && currentUser === majstor.email);
       // Ако не е сопственик, скриј ги деловите за уредување и качување слики
    if (!isOwner) {
        const settingsSection = document.getElementById('settingsSection');
        const uploadSection = document.getElementById('uploadSection');
        if (settingsSection) settingsSection.style.display = 'none';
        if (uploadSection) uploadSection.style.display = 'none';
    } 
    
    if (isAdmin || isOwner) {
      document.getElementById('uploadSection').style.display = 'block';
      document.getElementById('settingsSection').style.display = 'block';
    }

  } catch (error) {
    console.error("Грешка:", error);
    showError('Грешка', 'Настана проблем при вчитување.');
  }
}

// (Останатите функции loadMedia, loadRatings, uploadImage, deleteImage остануваат исти како во претходниот код)

async function loadMedia() {
  try {
    const resMedia = await fetch('/api/media');
    const mediaData = await resMedia.json();
    const images = mediaData.filter(m => m.type === 'image' && m.majstor_id == majstorId);
    const imgGrid = document.getElementById('imagesGrid');
    if (images && images.length > 0) {
      imgGrid.innerHTML = images.map(img => `
        <div class="media-item">
          <img loading="lazy" src="${img.url}" alt="Слика" onclick="window.open('${img.url}', '_blank')">
          ${(isAdmin) ? `<button class="delete-btn" onclick="deleteImage(${img.id})">🗑️</button>` : ''}
        </div>`).join('');
    } else {
      imgGrid.innerHTML = '<p style="color:#666; text-align:center; padding:20px; grid-column: 1/-1;">Нема слики сè уште</p>';
    }
  } catch (error) { console.error("Грешка при медиуми:", error); }
}

async function loadRatings() {
  try {
    const res = await fetch('/api/ratings');
    const data = await res.json();
    const myRatings = data.filter(r => r.majstor_id == majstorId);
    const content = document.getElementById('ratingsContent');
    if (!myRatings || myRatings.length === 0) {
      content.innerHTML = '<p style="color:#666; text-align:center; padding:20px;">Нема оценки сè уште</p>';
      return;
    }
    content.innerHTML = myRatings.map(r => {
      const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
      const date = new Date(r.created_at).toLocaleDateString('mk-MK');
      return `<div style="padding:15px; background:#252525; border-radius:10px; margin-bottom:10px;">
        <div style="color:#ffb84d; font-size:18px; margin-bottom:8px;">${stars}</div>
        ${r.comment ? `<div style="color:#ddd; font-size:14px; margin-bottom:8px;">${r.comment}</div>` : ''}
        <div style="color:#666; font-size:11px;">${date}</div>
      </div>`;
    }).join('');
  } catch (error) { console.error("Грешка при оценки:", error); }
}

// Помошна функција за качување на слика на ImgBB и враќање на линк
async function uploadToImgBB(file) {
  const formData = new FormData();
  formData.append('file', file);
  const res = await fetch('/api/upload', { method: 'POST', body: formData });
  const data = await res.json();
  if (data.secure_url) return data.secure_url;
  throw new Error(data.error || "Грешка при качување");
}

async function uploadImage(input) {
  const file = input.files[0];
  if (!file) return;
  alert("Почнувам качување...");
  try {
    const url = await uploadToImgBB(file);
    await fetch('/api/add-media', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ majstor_id: majstorId, url: url, type: 'image' })
    });
    alert("✅ Сликата е качена!");
    loadMedia();
  } catch (err) { alert("❌ Грешка: " + err.message); }
}

async function deleteImage(id) {
  if (!confirm("Дали си сигурен?")) return;
  try {
    await fetch('/api/delete-media', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    });
    alert("✅ Сликата е избришана!");
    loadMedia();
  } catch (err) { alert("❌ Грешка: " + err.message); }
}

// Промена на Аватар
async function handleChangeAvatar() {
  const file = document.getElementById('avatar-file').files[0];
  if (!file) { alert("Избери слика."); return; }
  alert("Се качува...");
  try {
    const url = await uploadToImgBB(file);
    await fetch('/api/update-avatar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: majstorId, url: url })
    });
    alert("✅ Профилната слика е сменета!");
    document.getElementById('changeAvatarModal').classList.remove('open');
    loadMajstor(); // Освежи го профилот
  } catch (err) { alert("❌ Грешка: " + err.message); }
}

// Промена на Банеř
async function handleChangeCover() {
  const file = document.getElementById('cover-file').files[0];
  if (!file) { alert("Избери слика."); return; }
  alert("Се качува...");
  try {
    const url = await uploadToImgBB(file);
    await fetch('/api/update-cover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: majstorId, url: url })
    });
    alert("✅ Банеřот е сменет!");
    document.getElementById('changeCoverModal').classList.remove('open');
    loadMajstor();
  } catch (err) { alert("❌ Грешка: " + err.message); }
}

// Уредување на Информации
async function handleEditInfo() {
  const data = {
    id: majstorId,
    name: document.getElementById('edit-name').value,
    phone: document.getElementById('edit-phone').value,
    city: document.getElementById('edit-city').value,
    category: document.getElementById('edit-category').value,
    description: document.getElementById('edit-description').value,
    facebook_url: document.getElementById('edit-facebook').value || null,
    website_url: document.getElementById('edit-website').value || null
  };
  
  try {
    await fetch('/api/update-profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    alert("✅ Информациите се зачувани!");
    document.getElementById('editInfoModal').classList.remove('open');
    loadMajstor();
  } catch (err) { alert("❌ Грешка: " + err.message); }
}
</script>
</body>
</html>
