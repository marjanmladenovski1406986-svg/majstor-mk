<style>

.share-btn{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-weight:600;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:center}
.share-btn.fb{background:#1877f2;border-color:#1877f2}

<body>
<header><a href="/" class="logo">🔨 Majsto.mk</a><div id="headerAuth"><span style="font-size:12px;color:#888">Се вчитува...</span></div></header>
<div class="container" id="app"><p style="text-align:center;padding:40px;color:#888">Вчитувам профил...</p></div>

<div class="share-modal" id="shareModal" onclick="if(event.target===this)closeShare()">
<div class="share-box">
<h3>🔗 Сподели профил</h3>
<p style="color:#888;font-size:13px;margin-bottom:12px" id="shareText"></p>
<button class="share-btn fb" onclick="shareFB()">📘 Сподели на Facebook</button>
<button class="share-btn viber" onclick="shareViber()">💜 Сподели на Viber</button>
<button class="share-btn wa" onclick="shareWhatsApp()">💚 Сподели на WhatsApp</button>
<button class="share-btn copy" onclick="copyLink()">📋 Копирај линк</button>
<button class="btn" style="width:100%;margin-top:8px" onclick="closeShare()">Затвори</button>
</div>
</div>

<script>
const CAT_NAMES={elektrika:"⚡ Електрика",vodovod:"💧 Водовод",gradeznistvo:"🏗️ Градежништво",popravki:"🔧 Поправки",finalni:"🎨 Финални работи",plockari:"🔲 Плочкари",gipsari:"🧱 Гипсари и Молери",stolari:"🚪 Столари",klima:"❄️ Клима",greenje:"🔥 Греење",krov:"🏠 Кров",sanitarii:"🚿 Санитарии",pvc:"🪟 ПВЦ прозори и врати",dvorovi:"🌳 Уредување дворови",cistenje:"🧹 Чистење",opti:"🔨 Општи работници",bravari:"🔨 Браварски услуги",belatehnika:"🔌 Бела техника",videonadzor:"📹 Видео надзор",bazeni:"🏊 Базени",fasadi:"🎨 Фасади",iskop:"🚜 Ископ",hidroizolacija:"💧 Хидро изолација",otpad:"🗑️ Фрлање отпад"};

let majstor=null, allMedia=[], allRatings=[], currentUser=null, isOwner=false;
let shareUrl="", shareTitle="";

function getId(){ const p=new URLSearchParams(location.search); return p.get('id'); }

window.addEventListener('load', async()=>{
  if(window.Clerk){ await Clerk.load(); currentUser=Clerk.user; }
  const id=getId(); if(!id){ document.getElementById('app').innerHTML='<p>Нема ID</p>'; return; }
  loadProfile(id);
});

async function loadProfile(id){
  try{
    const [mRes, mediaRes, ratingsRes] = await Promise.all([
      fetch(`/api/majstor?id=${id}`),
      fetch(`/api/media?majstor_id=${id}`),
      fetch(`/api/ratings?majstor_id=${id}`)
    ]);
    majstor = await mRes.json();
    allMedia = await mediaRes.json(); if(!Array.isArray(allMedia)) allMedia=[];
    allRatings = await ratingsRes.json(); if(!Array.isArray(allRatings)) allRatings=[];
    
    // Track view
    fetch(`/api/track`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({majstor_id:id, type:'view'})}).catch(()=>{});

    isOwner = currentUser && (majstor.clerk_id===currentUser.id || majstor.email===currentUser.primaryEmailAddress?.emailAddress);

    shareUrl = `https://majsto.mk/majstor/${majstor.id}-${(majstor.name||'majstor').toLowerCase().replace(/\s+/g,'-')}`;
    shareTitle = `${majstor.name} - ${CAT_NAMES[majstor.category]||majstor.category} во ${majstor.city} | Majsto.mk`;

    document.title = shareTitle;
    document.getElementById('pageTitle').textContent = shareTitle;
    render();
  }catch(e){ document.getElementById('app').innerHTML=`<p style="color:#ff6b6b">Грешка: ${e.message}</p>`; }
}

function render(){
  const app=document.getElementById('app');
  const const majstorName = (majstor && majstor.name) ? majstor.name : 'Мајстор';
const avatar = (majstor && majstor.photo_url) ? `<img src="${majstor.photo_url}">` : majstorName.charAt(0).toUpperCase();
  const badgeFounder=majstor.is_founder?`<span class="badge badge-founder">🚀 FOUNDER #${majstor.founder_number||''}</span>`:'';
  const badgePremium=majstor.is_premium?`<span class="badge badge-premium">👑 PREMIUM</span>`:'';
  const badgeVerified=majstor.verified?`<span class="badge badge-verified">✅ Верификуван</span>`:'';
  const bannerUrl=majstor.banner_url||'';

  app.innerHTML=`
  <div class="hero">
    ${bannerUrl?`<img class="banner" src="${bannerUrl}">`:`<div class="banner"></div>`}
    <div class="avatar-wrap">
      <div class="avatar">${avatarContent}</div>
      <div class="hero-info">
        <h1>${majstor.name}</h1>
        <p>${CAT_NAMES[majstor.category]||majstor.category} • ${majstor.city} • ⭐ ${Number(majstor.rating||0).toFixed(1)} (${majstor.rating_count||0})</p>
        <div class="badges">${badgeFounder}${badgePremium}${badgeVerified}</div>
      </div>
    </div>
  </div>

  ${isOwner?`<div class="owner-bar"><span style="color:#4caf50;font-weight:700">👋 Ова е твој профил</span><a href="/dashboard.html" class="btn btn-orange" style="padding:6px 12px">Уреди профил</a><span style="color:#888;font-size:12px">${allMedia.length}/50 слики</span></div>`:''}

  <div class="grid">
    <div>
      <div class="card">
        <h3>🖼️ Галерија (${allMedia.length}/50)</h3>
        ${allMedia.length?`<div class="gallery">${allMedia.map(m=>`<img src="${m.url}" loading="lazy" onclick="window.open('${m.url}','_blank')" alt="${m.title||''}">`).join('')}</div>`:`<p style="color:#666">Нема слики уште</p>`}
      </div>

      <div class="card">
        <h3>⭐ Оценки и коментари (${allRatings.filter(r=>r.status==='approved'||!r.status).length})</h3>
        <div id="ratingsList">${renderRatings()}</div>
        <div style="margin-top:12px;border-top:1px solid #222;padding-top:12px">
          <h4 style="color:#ccc;font-size:14px;margin-bottom:8px">Остави оценка:</h4>
          <select id="rateStars" style="width:100%;padding:8px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:8px"><option value="5">★★★★★ 5 - Одличен</option><option value="4">★★★★ 4 - Добар</option><option value="3">★★★ 3 - Просечен</option><option value="2">★★ 2 - Слаб</option><option value="1">★ 1 - Лош</option></select>
          <textarea id="rateComment" placeholder="Коментар (опционо)..." style="width:100%;padding:8px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;min-height:60px;margin-bottom:8px"></textarea>
          <button class="btn btn-orange" onclick="submitRating()" style="width:100%">Испрати оценка</button>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <h3>📊 Статистика</h3>
        <div class="stats">
          <div class="stat"><div class="num">${majstor.views||0}</div><div class="lbl">👁️ Прегледи</div></div>
          <div class="stat"><div class="num">${majstor.phone_clicks||0}</div><div class="lbl">📞 Телефон</div></div>
          <div class="stat"><div class="num">${allMedia.length}</div><div class="lbl">🖼️ Слики</div></div>
        </div>
        <div class="actions">
          <a class="btn btn-orange" href="tel:${majstor.phone}" onclick="trackPhone()">${majstor.phone?`📞 ${majstor.phone}`:'📞 Повикај'}</a>
          <button class="btn" onclick="openShare()">🔗 Сподели</button>
        </div>
        ${majstor.description?`<p style="color:#ccc;font-size:14px;margin-top:12px;white-space:pre-wrap">${majstor.description}</p>`:''}
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
          ${majstor.facebook_url?`<a class="btn btn-ghost" href="${majstor.facebook_url}" target="_blank">📘 Facebook</a>`:''}
          ${majstor.website_url?`<a class="btn btn-ghost" href="${majstor.website_url}" target="_blank">🌐 Вебсајт</a>`:''}
          <button class="btn btn-ghost" onclick="openShare()">🔗 Сподели на FB / Viber / WhatsApp</button>
        </div>
      </div>

      <div class="card">
        <h3>📍 Инфо</h3>
        <p style="color:#aaa;font-size:13px">Категорија: <b style="color:#fff">${CAT_NAMES[majstor.category]||majstor.category}</b></p>
        <p style="color:#aaa;font-size:13px">Град: <b style="color:#fff">${majstor.city}</b></p>
        <p style="color:#aaa;font-size:13px">Оценка: <b style="color:#ffb400">★ ${Number(majstor.rating||0).toFixed(1)}</b> од ${majstor.rating_count||0} оценки</p>
        ${majstor.is_premium?`<p style="color:#ff6b35;font-size:12px;margin-top:8px">👑 Premium мајстор - 50 слики</p>`:''}
      </div>
    </div>
  </div>
  `;

  document.getElementById('headerAuth').innerHTML = currentUser ? `<span style="color:#888;font-size:12px">${currentUser.primaryEmailAddress.emailAddress}</span> <a href="/dashboard.html" class="btn" style="padding:6px 10px">Dashboard</a>` : `<a href="/dashboard.html" class="btn btn-orange" style="padding:6px 12px">Најави се</a>`;
}

function renderRatings(){
  const approved = allRatings.filter(r=>r.status==='approved' || !r.status);
  if(!approved.length) return '<p style="color:#666;font-size:13px">Нема оценки уште - биди прв!</p>';
  return approved.map(r=>{
    const stars='★'.repeat(r.rating)+'☆'.repeat(5-r.rating);
    return `<div class="comment"><div class="rating-row"><span class="stars">${stars}</span><b>${r.user_name||'Анонимен'}</b><span style="color:#666;font-size:11px">${new Date(r.created_at).toLocaleDateString('mk-MK')}</span></div><p>${r.comment||''}</p></div>`;
  }).join('');
}

async function trackPhone(){
  const id=getId();
  fetch(`/api/track`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({majstor_id:id, type:'phone_click'})}).catch(()=>{});
}

async function submitRating(){
  const id=getId();
  const rating=parseInt(document.getElementById('rateStars').value);
  const comment=document.getElementById('rateComment').value;
  const res=await fetch('/api/ratings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({majstor_id:id, rating, comment})});
  const data=await res.json();
  if(data.success){ alert('✅ Благодариме! Оценката ќе биде одобрена наскоро.'); document.getElementById('rateComment').value=''; loadProfile(id); }
  else alert('Грешка: '+(data.error||''));
}

function openShare(){
  document.getElementById('shareText').textContent=shareTitle;
  document.getElementById('shareModal').classList.add('open');
}
function closeShare(){ document.getElementById('shareModal').classList.remove('open'); }
function shareFB(){ window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`, '_blank'); trackShare('facebook'); }
function shareViber(){ window.open(`viber://forward?text=${encodeURIComponent(shareTitle+' '+shareUrl)}`, '_blank'); setTimeout(()=>{ window.open(`https://3p3x.adj.st/?adjust_t=u783g1_kw9yml&adjust_fallback=https%3A%2F%2Fwww.viber.com%2F%3Futm_source%3DPartner%26utm_medium%3DSharebutton%26utm_campaign%3DDefualt&adjust_campaign=Defualt&adjust_deeplink=viber%3A%2F%2Fforward%3Ftext%3D${encodeURIComponent(shareTitle+' '+shareUrl)}`, '_blank'); },500); trackShare('viber'); }
function shareWhatsApp(){ window.open(`https://wa.me/?text=${encodeURIComponent(shareTitle+' '+shareUrl)}`, '_blank'); trackShare('whatsapp'); }
function copyLink(){ navigator.clipboard.writeText(shareUrl).then(()=>{ alert('✅ Линкот е копиран: '+shareUrl); closeShare(); }); trackShare('copy'); }
function trackShare(platform){ fetch(`/api/track`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({majstor_id:getId(), type:'share_'+platform})}).catch(()=>{}); }
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
