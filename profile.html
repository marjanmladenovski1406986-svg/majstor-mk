<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мајстор — Majsto.mk</title>
<link rel="icon" href="/icon-192.png">
  <meta property="og:title" content="Мајстор — Majsto.mk" id="og-title">
<meta property="og:description" content="Погледни го профилот на мајсторот на Majsto.mk." id="og-desc">
<meta property="og:image" content="https://majsto.mk/icon-512.png" id="og-image">
<meta property="og:url" content="https://majsto.mk" id="og-url">
<meta name="theme-color" content="#ff6b35">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#0a0a0a;color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.85);backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px;color:#ff6b35;text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:20px}
.profile-header{background:#141414;border:1px solid #262626;border-radius:20px;padding:24px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.avatar{width:100px;height:100px;border-radius:50%;background:#ff6b35;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#000;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:250px}
.info h1{font-size:26px;font-weight:800}
.info .meta{color:#888;font-size:14px;margin-top:4px}
.badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.badge{font-size:11px;padding:4px 12px;border-radius:20px;font-weight:800}
.badge-founder{background:#4caf50;color:#000}
.badge-premium{background:#ff6b35;color:#000}
.badge-verified{background:#4db8ff;color:#000}
.contact-buttons{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-contact{background:#ff6b35;color:#fff;padding:10px 20px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn-facebook{background:#1877f2;color:#fff;padding:10px 20px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:#141414;border:1px solid #262626;border-radius:16px;padding:20px;margin-bottom:20px}
.card h2{font-size:18px;font-weight:800;color:#ff6b35;margin-bottom:16px;display:flex;justify-content:space-between}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.media-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#222;cursor:pointer}
.media-item img{width:100%;height:100%;object-fit:cover}
.rating-item{padding:12px;background:#1e1e1e;border-radius:10px;margin-bottom:8px}
.rating-stars{color:#ffb84d;font-size:14px;margin-bottom:4px}
.rating-comment{color:#ccc;font-size:13px}
.rating-meta{color:#666;font-size:11px;margin-top:6px}
.stat-box{text-align:center;padding:12px;background:#1a1a1a;border-radius:10px;margin-bottom:8px}
.stat-box b{font-size:20px;display:block;color:#ff6b35}
.stat-box span{font-size:11px;color:#888}
.rating-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #2a2a2a; text-align: left; }
.rating-section h4 { color: #ff6b35; margin-bottom: 12px; font-size: 16px; }
.rating-section select, .rating-section textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 10px; font-family: inherit; }
.rating-section button { width: 100%; padding: 12px; background: #ff6b35; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header>
  <a href="/" class="logo">🔨 Majsto.mk</a>
  <a href="/" style="color:#aaa;font-size:13px;text-decoration:none;border:1px solid #333;padding:6px 12px;border-radius:8px;">← Назад кон сајтот</a>
</header>

<div class="container" id="mainContent">
  <div style="text-align:center;padding:80px;color:#666;">Вчитувам профил...</div>
</div>

<script>
const CAT_NAMES={elektrika:"⚡ Електрика",vodovod:"💧 Водовод",gradeznistvo:"🏗️ Градежништво",popravki:"🔧 Поправки",finalni:"🎨 Финални работи",plockari:"🔲 Плочкари",gipsari:"🧱 Гипсари",stolari:"🚪 Столари",klima:"❄️ Клима",greenje:"🔥 Греење",krov:"🏠 Кров",sanitarii:"🚿 Санитарии",pvc:"🪟 ПВЦ",dvorovi:"🌳 Дворови",cistenje:"🧹 Чистење",opti:"🔨 Општи"};

function getId(){ return new URLSearchParams(window.location.search).get('id'); }

window.addEventListener('load', async () => {
  const id = getId();
  if(!id){ document.getElementById('mainContent').innerHTML='<p>Не е пронајден мајстор.</p>'; return; }

  try {
    // 1. ГИ ВЧИТУВАМЕ ПОДАТОЦИТЕ ЗА МАЈСТОРОТ
    const res = await fetch('/api/majstori?id=' + id);
    const majstor = await res.json();
    
    if(!majstor || !majstor.id){
      document.getElementById('mainContent').innerHTML='<p style="text-align:center;padding:40px;color:#ff6b6b">⚠️ Мајсторот не е пронајден во базата.</p>';
      return;
    }

    // 2. ВЧИТУВАМЕ СЛИКИ И ОЦЕНКИ
    const [mRes, rRes] = await Promise.all([
      fetch('/api/media?majstor_id=' + id),
      fetch('/api/ratings?majstor_id=' + id)
    ]);
    const media = await mRes.json();
    const ratings = await rRes.json();

    renderProfile(majstor, media, ratings);
  } catch(e) {
    document.getElementById('mainContent').innerHTML = '<p style="color:#ff6b6b;text-align:center">Грешка при вчитување: ' + e.message + '</p>';
  }
});

function renderProfile(m, media, ratings){
  const name = m.name || 'Мајстор';
  const avatar = (m.photo_url && m.photo_url.startsWith('http')) ? `<img src="${m.photo_url}">` : name.charAt(0).toUpperCase();
  
  const badges = [];
  if(m.is_founder) badges.push('<span class="badge badge-founder">🚀 FOUNDER</span>');
  if(m.is_premium) badges.push('<span class="badge badge-premium">👑 PREMIUM</span>');
  if(m.verified) badges.push('<span class="badge badge-verified">✅ Верификуван</span>');

  // Форма за оценување
  let ratingForm = `
    <div class="rating-section">
      <h4>Остави оценка</h4>
      <select id="ratingSelect">
        <option value="5">★★★★★ (5)</option>
        <option value="4">★★★★☆ (4)</option>
        <option value="3">★★★☆☆ (3)</option>
        <option value="2">★★☆☆☆ (2)</option>
        <option value="1">★☆☆☆☆ (1)</option>
      </select>
      <textarea id="ratingComment" placeholder="Коментар (опционо)..."></textarea>
      <button onclick="submitRating(${m.id})">Испрати оценка</button>
      <p id="ratingMsg" style="margin-top:10px; font-size:13px;"></p>
    </div>
  `;


    // Постави ги Open Graph таговите за Facebook
    document.getElementById('og-title').setAttribute('content', (m.name || 'Мајстор') + ' — Majsto.mk');
    document.getElementById('og-desc').setAttribute('content', 'Погледни го профилот на ' + (m.name || 'мајсторот') + ' на Majsto.mk. Слики од работа и директен контакт.');
    document.getElementById('og-image').setAttribute('content', m.photo_url || 'https://majsto.mk/icon-512.png');
    document.getElementById('og-url').setAttribute('content', window.location.href);

  
  document.getElementById('mainContent').innerHTML = `
    <div class="profile-header">
      <div class="avatar">${avatar}</div>
      <div class="info">
        <h1>${name}</h1>
        <div class="meta">${CAT_NAMES[m.category]||m.category} • 📍 ${m.city||'-'} • ⭐ ${m.rating||0} (${m.rating_count||0})</div>
        <div class="badges">${badges.join('')}</div>
        <div class="contact-buttons">
          ${m.phone ? `<a href="tel:${m.phone}" class="btn-contact">📞 ${m.phone}</a>` : ''}
          ${m.facebook_url ? `<a href="${m.facebook_url}" target="_blank" class="btn-facebook">📘 Facebook</a>` : ''}
          <button onclick="shareProfile()" class="btn-share" style="background:#4db8ff; color:#fff; padding:10px 20px; border-radius:10px; border:none; font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:6px; cursor:pointer;">📤 Сподели</button>
        </div>
      </div>
    </div>

    <div class="grid">
      <div>
        ${m.description ? `<div class="card"><h2>📝 Опис</h2><p style="color:#ccc;font-size:14px;line-height:1.6">${m.description}</p></div>` : ''}
        
        <div class="card">
          <h2>🖼️ Галерија (${media.length})</h2>
          <div class="media-grid">
            ${media.length ? media.map(img => `<div class="media-item"><img src="${img.url}" onclick="window.open('${img.url}','_blank')"></div>`).join('') : '<p style="color:#666">Нема слики.</p>'}
          </div>
        </div>

        <div class="card">
          <h2>⭐ Оценки (${ratings.length})</h2>
          ${ratings.length ? ratings.map(r => `
            <div class="rating-item">
              <div class="rating-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
              <div class="rating-comment">${r.comment || ''}</div>
              <div class="rating-meta">${new Date(r.created_at).toLocaleDateString('mk-MK')}</div>
            </div>
          `).join('') : '<p style="color:#666">Нема оценки.</p>'}
          ${ratingForm}
        </div>
      </div>

      <div>
        <div class="card">
          <h2>📊 Статистика</h2>
          <div class="stat-box"><b>${m.views||0}</b><span>👁️ Прегледи</span></div>
          <div class="stat-box"><b>${m.phone_clicks||0}</b><span>📞 Кликови на телефон</span></div>
          <div class="stat-box"><b>${m.rating||0}</b><span>⭐ Просечна оценка</span></div>
        </div>
        ${m.website_url ? `<div class="card"><h2>🌐 Вебсајт</h2><a href="${m.website_url}" target="_blank" style="color:#ff6b35;word-break:break-all;font-size:13px">${m.website_url}</a></div>` : ''}
      </div>
    </div>
  `;
}


async function submitRating(majstorId) {
  // 1. Проверка дали си најавен преку твојот локален систем
  const userEmail = localStorage.getItem('logged_email');

  if(!userEmail) {
    alert("Мора да бидеш најавен за да оставиш оценка. Те пренасочувам кон почетна страна...");
    window.location.href = '/'; // Врати го на почетна за да се најави
    return;
  }

  const rating = document.getElementById('ratingSelect').value;
  const comment = document.getElementById('ratingComment').value;
  const msg = document.getElementById('ratingMsg');

  msg.textContent = "Се испраќа...";
  msg.style.color = "#ffb84d";

  try {
    const res = await fetch('/api/add-rating', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        majstor_id: parseInt(majstorId),
        user_id: userEmail, // Го користиме мејлот на корисникот како ID
        rating: parseInt(rating),
        comment: comment
      })
    });

    const data = await res.json();

    if(res.ok) {
      msg.textContent = "✅ Благодариме за оценката! Таа ќе биде видлива по одобрување од администратор.";
      msg.style.color = "#6bff6b";
      document.getElementById('ratingComment').value = '';
    } else {
      msg.textContent = "❌ " + (data.error || "Грешка при испраќање.");
      msg.style.color = "#ff6b6b";
    }
  } catch(e) {
    msg.textContent = "❌ Грешка: " + e.message;
    msg.style.color = "#ff6b6b";
  }
}  

function shareProfile() {
  const url = window.location.href;
  const title = document.querySelector('.info h1') ? document.querySelector('.info h1').textContent : 'Мајстор на Majsto.mk';

  if (navigator.share) {
    navigator.share({
      title: title,
      text: 'Погледни го овој мајстор на Majsto.mk:',
      url: url
    }).catch((error) => console.log('Грешка при споделување', error));
  } else {
    // Ако уредот не поддржува директно споделување, го копираме линкот
    navigator.clipboard.writeText(url).then(() => {
      alert('✅ Линкот е копиран! Сподели го со пријателите.');
    }).catch(() => {
      prompt('Копирај го овој линк за да го споделиш:', url);
    });
  }
}
  

</script>
</body>
</html>
