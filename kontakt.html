<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакт — Мајстор.мк</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6b35">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{background:#1a1a1a;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a2a2a;flex-wrap:wrap;gap:10px}
.logo{font-size:20px;font-weight:700;color:#ff6b35;text-decoration:none}
.btn-auth{background:#ff6b35;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none}
.container{max-width:800px;margin:40px auto;padding:0 20px;flex:1;width:100%}
.page-title{color:#ff6b35;font-size:32px;margin-bottom:20px;text-align:center}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.contact-grid{grid-template-columns:1fr}}
.contact-info,.contact-form{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:30px}
h3{color:#ff6b35;margin-bottom:20px}
.contact-info p{margin-bottom:15px;color:#ddd;font-size:16px}
.contact-info a{color:#ddd;text-decoration:none}
.contact-info a:hover{color:#ff6b35}
.contact-form input,.contact-form textarea{width:100%;padding:14px;background:#2a2a2a;border:1px solid #333;border-radius:8px;color:#fff;font:inherit;font-size:14px;margin-bottom:15px}
.contact-form input:focus,.contact-form textarea:focus{outline:2px solid #ff6b35;border-color:#ff6b35}
.contact-form textarea{min-height:120px;resize:vertical}
.contact-form button{width:100%;padding:14px;background:#ff6b35;border:none;border-radius:8px;color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.contact-form button:disabled{opacity:.6}
.msg{padding:12px;border-radius:8px;margin-bottom:15px;font-size:14px;display:none}
.msg.success{background:#1a3a1a;color:#6bff6b;display:block}
.msg.error{background:#3a1a1a;color:#ff6b6b;display:block}
.footer{background:#1a1a1a;padding:20px;border-top:1px solid #2a2a2a;text-align:center;font-size:13px;color:#666}
</style>
</head>
<body>
<header>
  <a href="/" class="logo">🔨 Мајстор.мк</a>
  <a href="/" class="btn-auth">← Назад кон сајтот</a>
</header>

<div class="container">
  <h1 class="page-title">Контакт</h1>
  <div class="contact-grid">
    <div class="contact-info">
      <h3>📞 Контакт информации</h3>
      <p>📱 <a href="tel:076638703">076 638 703</a></p>
      <p>📧 <a href="mailto:info@majsto.mk">info@majsto.mk</a></p>
      <p>📍 Скопје, Македонија</p>
      <h3 style="margin-top:30px">🌐 Социјални мрежи</h3>
      <p>📘 <a href="https://www.facebook.com/share/19TQpzU9qL/" target="_blank" rel="noopener noreferrer">Facebook</a></p>
    </div>
    <form class="contact-form" id="form" novalidate>
      <h3>✉️ Испрати порака</h3>
      <div id="form-msg" class="msg" role="status"></div>
      <input type="text" id="contact-name" placeholder="Твоето име" maxlength="100" autocomplete="name">
      <input type="email" id="contact-email" placeholder="Твојата е-пошта" maxlength="200" autocomplete="email">
      <textarea id="contact-message" placeholder="Твојата порака..." maxlength="2000"></textarea>
      <button type="submit" id="sendBtn">Испрати порака</button>
    </form>
  </div>
</div>

<footer class="footer">© 2026 Мајстор.мк · Сите права задржани 🇲🇰</footer>

<script>
const $=id=>document.getElementById(id);
$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const box=$('form-msg'),btn=$('sendBtn');
  const name=$('contact-name').value.trim(),email=$('contact-email').value.trim(),message=$('contact-message').value.trim();
  if(!name||!email||!message){box.textContent='Пополни ги сите полиња.';box.className='msg error';return}
  btn.disabled=true;box.textContent='Се испраќа...';box.className='msg';box.style.display='block';
  try{
    const res=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,message})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||'Грешка. Обиди се повторно.');
    box.textContent='✅ Пораката е испратена. Ќе ти одговориме наскоро.';box.className='msg success';
    $('form').reset();
  }catch(err){box.textContent=err.message;box.className='msg error'}
  btn.disabled=false;
});
</script>
</body>
</html>
