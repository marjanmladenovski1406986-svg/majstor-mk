<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мој Профил - Majsto.mk</title>
    <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA" src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; padding: 20px; }
        h1 { color: #ff6b35; }
        .card { background: #141414; padding: 20px; border-radius: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🔨 Dashboard работи!</h1>
    <div class="card">
        <p>Ова е страницата за твојот профил.</p>
        <p id="status">Проверувам најава...</p>
        <button onclick="location.href='/'">← Назад на сајтот</button>
    </div>

    <script>
        window.addEventListener('load', async () => {
            if(window.Clerk) {
                await Clerk.load();
                const status = document.getElementById('status');
                if(Clerk.user) {
                    status.textContent = "Најавен си како: " + Clerk.user.primaryEmailAddress.emailAddress;
                } else {
                    status.textContent = "Не си најавен. Те пренасочувам на најава...";
                    Clerk.openSignIn({ afterSignInUrl: '/dashboard.html' });
                }
            }
        });
    </script>
</body>
</html>
