<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд — Majsto.mk</title>
<link rel="icon" href="/icon-192.png"><meta name="theme-color" content="#ff6b35">
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA" src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#0a0a0a;color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.85);backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px;color:#ff6b35;text-decoration:none}
.header-right{display:flex;align-items:center;gap:10px}
.btn-logout{background:transparent;border:1px solid #ff6b35;color:#ff6b35;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;}
.container{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:220px 1fr;gap:20px}
@media(max-width:800px){.container{grid-template-columns:1fr}}
.sidebar{background:#141414;border:1px solid #262626;border-radius:16px;padding:12px;height:fit-content;position:sticky;top:80px}
.tab{padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tab.active{background:#ff6b35;color:#000}
.tab span.count{background:#222;color:#fff;padding:2px 8px;border-radius:20px;font-size:12px}
.tab.active span.count{background:#000;color:#fff}
.card{background:#141414;border:1px solid #262626;border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:18px;font-weight:800;color:#ff6b35;margin-bottom:16px;display:flex;justify-content:space-between}
.banner{border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.banner-founder{background:linear-gradient(90deg,#1a2e0a,#2a3a0a);border:1px solid #4caf50}
.banner-premium{background:linear-gradient(90deg,#2a1a0a,#3a2510);border:1px solid #ff6b35}
.progress{height:10px;background:#222;border-radius:20px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:#ff6b35;transition:.5s}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid-2{grid-template-columns:1fr}}
.input{width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:10px;font-family:inherit}
textarea.input{resize:vertical}
.btn{padding:12px 18px;border-radius:10px;font-weight:800;border:none;cursor:pointer}
.btn-orange{background:#ff6b35;color:#fff;width:100%}
.btn-ghost{background:#222;color:#fff;border:1px solid #333}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.media-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#222}
.media-item img{width:100%;height:100%;object-fit:cover}
.media-actions{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;opacity:0;transition:.2s}
.media-item:hover .media-actions{opacity:1}
.icon-btn{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.dropzone{border:2px dashed #333;border-radius:16px;padding:30px;text-align:center;cursor:pointer;transition:.2s;background:#161616}
.dropzone:hover{border-color:#ff6b35;background:#1a1a1a}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:16px;text-align:center}
.stat b{font-size:24px;display:block}
.stat span{color:#888;font-size:12px}
.rating{padding:12px;background:#1e1e1e;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px}
.toast{position:fixed;bottom:20px;right:20px;background:#222;border:1px solid #333;padding:14px 18px;border-radius:12px;z-index:100;transform:translateY(100px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}
.loading{color:#666;text-align:center;padding:40px}
</style>
</head>
<body>
<header>
  <a href="/" class="logo">🔨 Majsto.mk</a>
  <div class="header-right">
    <span id="userName" style="color:#888;font-size:13px"></span>
    <a href="/" class="logo" style="font-size:14px;border:1px solid #333;padding:6px 12px;border-radius:8px;text-decoration:none;color:#aaa">← Сајт</a>
    <button class="btn-logout" onclick="logout()">Одјави се</button>
  </div>
</header>

<div class="container">
  <div class="sidebar" id="sidebar" style="display:none;">
    <div class="tab active" data-tab="info" onclick="switchTab('info')">📝 Основни <span class="count">•</span></div>
    <div class="tab" data-tab="gallery" onclick="switchTab('gallery')">🖼️ Галерија <span class="count" id="galCount">0/50</span></div>
    <div class="tab" data-tab="stats" onclick="switchTab('stats')">📊 Статистика</div>
    <div style="margin-top:20px;padding-top:20px;border-top:1px solid #222">
      <div style="font-size:12px;color:#666">Статус</div>
      <div id="statusBadge" style="margin-top:6px"></div>
    </div>
  </div>

  <div class="main" id="main">
    <div class="loading">Вчитувам дашборд...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CAT_NAMES={elektrika:"⚡ Електрика",vodovod:"💧 Водовод",gradeznistvo:"🏗️ Градежништво",popravki:"🔧 Поправки",finalni:"🎨 Финални работи",plockari:"🔲 Плочкари",gipsari:"🧱 Гипсари",stolari:"🚪 Столари",klima:"❄️ Клима",greenje:"🔥 Греење",krov:"🏠 Кров",sanitarii:"🚿 Санитарии",pvc:"🪟 ПВЦ",dvorovi:"🌳 Дворови",cistenje:"🧹 Чистење",opti:"🔨 Општи",bazeni:"🏊 Базени",fasadi:"🏢 Фасади",iskop:"🚜 Ископ",hidroizolacija:"🛡️ Хидроизолација",otpad:"🗑️ Отпад",videonadzor:"📹 Видео надзор"};
const CITIES=['Скопје','Битола','Куманово','Прилеп','Тетово','Велес','Штип','Охрид','Гостивар','Струмица','Кавадарци','Кочани','Кичево','Струга','Радовиш','Гевгелија','Дебар','Крива Паланка','Свети Николе','Неготино','Делчево','Ресен','Пробиштип','Берово','Кратово','Крушево','Валандово','Македонски Брод','Демир Хисар','Демир Капија','Богданци','Дојран','Пехчево','Виница'];
let majstor=null, media=[], ratings=[];

async function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelector('[data-tab="'+t+'"]').classList.add('active');
  
  if(t==='info') renderInfo();
  if(t==='gallery') {
    try {
      const r = await fetch('/api/media?majstor_id='+majstor.id);
      media = await r.json();
      if(!Array.isArray(media)) media = [];
    } catch(e) { media = []; }
    renderGallery();
  }
  if(t==='stats') renderStats();
}

window.addEventListener('load', async()=>{
  // 1. Иницијализирај Clerk
  if (window.Clerk) {
    await window.Clerk.load();
    
    if (window.Clerk.user) {
      const email = window.Clerk.user.primaryEmailAddress.emailAddress;
      localStorage.setItem('logged_email', email); 
      
      try {
        const res = await fetch('/api/majstori');
        const data = await res.json();
        let myProfile = Array.isArray(data) ? data.find(m => m.email && m.email.toLowerCase() === email.toLowerCase()) : null;
        
        // Ако не постои профил, прашајме Worker да го креира
        if(!myProfile || !myProfile.id){
          const token = await window.Clerk.session.getToken();
          const loginRes = await fetch('/api/clerk-login', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const loginData = await loginRes.json();
          
          if (loginData.success && loginData.id) {
            window.location.reload(); 
            return;
          } else {
            document.getElementById('main').innerHTML='<div class="card"><h2>⚠️ Грешка</h2><p>Не можевме да го креираме профилот.</p></div>';
            return;
          }
        }
        
        majstor = myProfile;
        const [mRes,rRes] = await Promise.all([
          fetch('/api/media?majstor_id='+majstor.id), 
          fetch('/api/ratings?majstor_id='+majstor.id)
        ]);
        media = await mRes.json(); 
        ratings = await rRes.json();
        
        document.getElementById('galCount').textContent=media.length + '/50';
        document.getElementById('sidebar').style.display='block';
        renderInfo();
        return; 
      } catch(e) {
        document.getElementById('main').innerHTML='<div class="card"><h2>❌ Грешка</h2><p>'+e.message+'</p></div>';
        return;
      }
    }
  }

  // 2. Fallback: Ако не е Clerk, провери стара локална најава
  const email = localStorage.getItem('logged_email');
  if(!email) {
    document.getElementById('main').innerHTML='<div class="card"><h2>🔒 Не си најавен</h2><p>Те пренасочувам кон најава...</p></div>';
    setTimeout(()=>{ window.location.href = '/'; }, 1500);
    return;
  }
  // ... (остатокот од кодот за стара најава, истиот како претходно)
});
</script>
</body>
</html>
