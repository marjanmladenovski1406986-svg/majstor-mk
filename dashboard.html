<!DOCTYPE html>
<html lang="mk">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Majsto.mk</title>
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA" src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Inter,system-ui}
header{position:sticky;top:0;background:#111;border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo{font-weight:900;color:#ff6b35;font-size:18px;text-decoration:none}
.btn{padding:10px 16px;border-radius:10px;border:1px solid #333;background:transparent;color:#ccc;cursor:pointer;font-weight:600}
.btn-orange{background:#ff6b35;border-color:#ff6b35;color:#fff;font-weight:800}
.container{max-width:1000px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tab{padding:10px 16px;background:#141414;border:1px solid #222;border-radius:10px;cursor:pointer;color:#888;font-weight:600}
.tab.active{background:#ff6b35;border-color:#ff6b35;color:#fff}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:16px}
.card h3{color:#ff6b35;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gallery .img-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #222;aspect-ratio:4/3}
.gallery .img-wrap img{width:100%;height:100%;object-fit:cover}
.gallery .img-wrap button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:none;color:#ff6b6b;border-radius:50%;width:24px;height:24px;cursor:pointer}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat{background:#1a1a1a;border:1px solid #222;border-radius:10px;padding:12px;text-align:center}
.stat .num{font-size:20px;font-weight:800;color:#ff6b35}
.stat .lbl{font-size:11px;color:#888}
.upload-box{border:2px dashed #333;border-radius:12px;padding:20px;text-align:center;cursor:pointer}
.upload-box:hover{border-color:#ff6b35}
</style>
</head>
<body>
<header><a href="/" class="logo">🔨 Majsto.mk</a><div id="headerAuth">Се вчитува...</div></header>
<div class="container">
<div id="loading">Се вчитува... најави се преку Clerk</div>

<div id="dashboard" style="display:none">
<h2 id="welcome"></h2>
<p id="founderBadge" style="margin:8px 0"></p>

<div class="tabs">
<button class="tab active" onclick="showTab(event,'profile')">👤 Профил</button>
<button class="tab" onclick="showTab(event,'gallery')">🖼️ Галерија (<span id="gCount">0</span>/50)</button>
<button class="tab" onclick="showTab(event,'stats')">📊 Статистика</button>
<button class="tab" onclick="showTab(event,'payment')">💳 Наплата</button>
</div>

<div class="tab-content active" id="tab-profile">
<div class="card">
<h3>👤 Уреди профил</h3>
<input id="pName" placeholder="Име и презиме">
<input id="pPhone" placeholder="Телефон 070...">
<select id="pCity"></select>
<select id="pCategory"></select>
<textarea id="pDesc" rows="3" placeholder="Опис - што работиш, искуство..."></textarea>
<input id="pFb" placeholder="Facebook линк (опционо)">
<input id="pWeb" placeholder="Вебсајт (опционо)">
<input id="pPhoto" placeholder="URL на профилна слика (или качи подолу)">
<input type="file" id="photoFile" accept="image/*" style="margin-bottom:8px" onchange="uploadAvatar(this)">
<button class="btn btn-orange" style="width:100%" onclick="saveProfile()">💾 Зачувај профил</button>
<div id="pMsg" style="margin-top:8px;font-size:13px"></div>
</div>
</div>

<div class="tab-content" id="tab-gallery">
<div class="card">
<h3>🖼️ Твои слики (макс 50)</h3>
<div class="upload-box" onclick="document.getElementById('galleryFile').click()">
📁 Кликни за качување слика
<input type="file" id="galleryFile" accept="image/*" style="display:none" onchange="uploadGallery(this)">
</div>
<p style="color:#888;font-size:12px;margin:8px 0">Можеш до 50 слики од твоја работа. Првата е главна.</p>
<div class="gallery" id="galleryList"></div>
</div>
</div>

<div class="tab-content" id="tab-stats">
<div class="card">
<h3>📊 Статистика</h3>
<div class="stats-grid" id="statsGrid"></div>
</div>
<div class="card">
<h3>⭐ Оценки</h3>
<div id="ratingsList"></div>
</div>
</div>

<div class="tab-content" id="tab-payment">
<div class="card" id="paymentCard"></div>
</div>
</div>
</div>

<script>
const CITIES=['Скопје','Битола','Куманово','Прилеп','Тетово','Велес','Штип','Охрид','Гостивар','Струмица','Кавадарци','Кочани','Кичево','Струга','Радовиш','Гевгелија','Дебар','Крива Паланка','Свети Николе','Неготино','Делчево','Ресен','Пробиштип','Берово','Кратово','Крушево','Валандово','Македонски Брод','Демир Хисар','Демир Капија','Богданци','Дојран','Пехчево','Виница'];
const CAT_NAMES={elektrika:"⚡ Електрика",vodovod:"💧 Водовод",gradeznistvo:"🏗️ Градежништво",popravki:"🔧 Поправки",finalni:"🎨 Финални работи",plockari:"🔲 Плочкари",gipsari:"🧱 Гипсари и Молери",stolari:"🚪 Столари",klima:"❄️ Клима",greenje:"🔥 Греење",krov:"🏠 Кров",sanitarii:"🚿 Санитарии",pvc:"🪟 ПВЦ прозори и врати",dvorovi:"🌳 Уредување дворови",cistenje:"🧹 Чистење",opti:"🔨 Општи работници",bravari:"🔨 Браварски услуги",belatehnika:"🔌 Бела техника",videonadzor:"📹 Видео надзор",bazeni:"🏊 Базени",fasadi:"🎨 Фасади",iskop:"🚜 Ископ",hidroizolacija:"💧 Хидро изолација",otpad:"🗑️ Фрлање отпад"};

let currentUser=null, myProfile=null, myMedia=[], myRatings=[];

function showTab(e,tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
}

window.addEventListener('load', async()=>{
  if(!window.Clerk){ document.getElementById('loading').textContent='Clerk не се вчита'; return; }
  await Clerk.load();
  currentUser=Clerk.user;
  document.getElementById('pCity').innerHTML=CITIES.map(c=>`<option value="${c}">${c}</option>`).join('');
  document.getElementById('pCategory').innerHTML=Object.entries(CAT_NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  
  if(!currentUser){
    document.getElementById('loading').innerHTML='<div style="text-align:center;padding:40px"><h2>🔐 Најави се</h2><p style="color:#888;margin:12px 0">Мора да се најавиш за да го уредуваш профилот</p><button class="btn btn-orange" onclick="Clerk.openSignIn()">Најави се / Регистрирај се</button><br><br><a href="/" class="btn">← Кон почетна</a></div>';
    document.getElementById('headerAuth').innerHTML='<button class="btn btn-orange" onclick="Clerk.openSignIn()">Најава</button>';
    return;
  }
  document.getElementById('headerAuth').innerHTML=`<span style="color:#888;font-size:12px">${currentUser.primaryEmailAddress.emailAddress}</span> <button class="btn" onclick="Clerk.signOut().then(()=>location.reload())">Одјава</button> <a href="/" class="btn">Почетна</a>`;
  loadMe();
});

async function loadMe(){
  try{
    const res=await fetch(`/api/me?clerk_id=${currentUser.id}&email=${encodeURIComponent(currentUser.primaryEmailAddress.emailAddress)}`);
    const data=await res.json();
    if(data.error){ document.getElementById('loading').textContent='Грешка: '+data.error; return; }
    myProfile=data;
    document.getElementById('loading').style.display='none';
    document.getElementById('dashboard').style.display='block';
    document.getElementById('welcome').textContent=`Здраво, ${myProfile.name||currentUser.firstName||'Мајсторе'}!`;
    if(myProfile.is_founder){
      document.getElementById('founderBadge').innerHTML=`<span style="background:linear-gradient(90deg,#4caf50,#8bc34a);color:#000;padding:6px 12px;border-radius:20px;font-weight:900">🚀 FOUNDER #${myProfile.founder_number} — бесплатно засекогаш</span>`;
    } else if(myProfile.is_premium){
      document.getElementById('founderBadge').innerHTML=`<span style="background:#ff6b35;color:#000;padding:6px 12px;border-radius:20px;font-weight:900">👑 PREMIUM до ${myProfile.paid_until?new Date(myProfile.paid_until).toLocaleDateString('mk-MK'):'активен'}</span>`;
    } else {
      document.getElementById('founderBadge').innerHTML=`<span style="background:#333;color:#aaa;padding:6px 12px;border-radius:20px;font-weight:600">🆓 Бесплатен - <a href="/naplata.html" style="color:#ff6b35">Стани Premium 1000 ден/год</a></span>`;
    }
    document.getElementById('pName').value=myProfile.name||'';
    document.getElementById('pPhone').value=myProfile.phone||'';
    document.getElementById('pCity').value=myProfile.city||'Скопје';
    document.getElementById('pCategory').value=myProfile.category||'elektrika';
    document.getElementById('pDesc').value=myProfile.description||'';
    document.getElementById('pFb').value=myProfile.facebook_url||'';
    document.getElementById('pWeb').value=myProfile.website_url||'';
    document.getElementById('pPhoto').value=myProfile.photo_url||'';
    loadMedia(); loadStats(); loadPayment();
  }catch(e){ document.getElementById('loading').textContent='Грешка: '+e.message; }
}

async function loadMedia(){
  const res=await fetch(`/api/media?majstor_id=${myProfile.id}`);
  myMedia=await res.json(); if(!Array.isArray(myMedia)) myMedia=[];
  document.getElementById('gCount').textContent=myMedia.length;
  document.getElementById('galleryList').innerHTML=myMedia.map(m=>`<div class="img-wrap"><img src="${m.url}"><button onclick="deleteMedia(${m.id})">✕</button></div>`).join('') || '<p style="color:#666">Нема слики</p>';
}

async function loadStats(){
  document.getElementById('statsGrid').innerHTML=`<div class="stat"><div class="num">${myProfile.views||0}</div><div class="lbl">👁️ Прегледи</div></div><div class="stat"><div class="num">${myProfile.phone_clicks||0}</div><div class="lbl">📞 Телефон</div></div><div class="stat"><div class="num">${myMedia.length}</div><div class="lbl">🖼️ Слики</div></div><div class="stat"><div class="num">${myProfile.rating||0}</div><div class="lbl">⭐ Оценка</div></div>`;
  const rRes=await fetch(`/api/ratings?majstor_id=${myProfile.id}`);
  myRatings=await rRes.json(); if(!Array.isArray(myRatings)) myRatings=[];
  document.getElementById('ratingsList').innerHTML=myRatings.map(r=>`<div style="background:#1a1a1a;border:1px solid #222;border-radius:8px;padding:8px;margin-bottom:6px"><b>${'★'.repeat(r.rating)} ${r.user_name||'Анонимен'}</b><p style="color:#ccc;font-size:13px">${r.comment||''}</p></div>`).join('') || '<p style="color:#666">Нема оценки</p>';
}

function loadPayment(){
  const card=document.getElementById('paymentCard');
  if(myProfile.is_founder){
    card.innerHTML='<h3>🚀 Founder - бесплатно засекогаш</h3><p style="color:#ccc">Ти си меѓу првите 50 - не плаќаш ништо, засекогаш.</p><a href="/profile.html?id='+myProfile.id+'" class="btn btn-orange" style="display:inline-block;margin-top:12px">Види мој профил</a>';
  } else if(myProfile.is_premium && myProfile.paid_until && new Date(myProfile.paid_until)>new Date()){
    card.innerHTML=`<h3>👑 Premium активен</h3><p style="color:#4caf50;font-weight:800">Активен до ${new Date(myProfile.paid_until).toLocaleDateString('mk-MK')}</p><a href="/profile.html?id=${myProfile.id}" class="btn btn-orange" style="margin-top:12px;display:inline-block">Види профил</a>`;
  } else {
    card.innerHTML='<h3>💳 Стани Premium - 1000 ден / година</h3><p style="color:#ccc">50 слики, статистика, приоритет во пребарување.</p><a href="/naplata.html" class="btn btn-orange" style="display:block;text-align:center;margin-top:12px;text-decoration:none">→ Кон наплата (Стопанска директно)</a>';
  }
}

async function saveProfile(){
  const body={id:myProfile.id, name:document.getElementById('pName').value, phone:document.getElementById('pPhone').value, city:document.getElementById('pCity').value, category:document.getElementById('pCategory').value, description:document.getElementById('pDesc').value, facebook_url:document.getElementById('pFb').value, website_url:document.getElementById('pWeb').value, photo_url:document.getElementById('pPhoto').value, clerk_id:currentUser.id, email:currentUser.primaryEmailAddress.emailAddress};
  const res=await fetch('/api/update-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  document.getElementById('pMsg').textContent=data.success?'✅ Зачувано!':'Грешка: '+(data.error||'');
  if(data.success) loadMe();
}

async function uploadAvatar(input){
  const file=input.files[0]; if(!file) return;
  const fd=new FormData(); fd.append('file',file);
  const res=await fetch('/api/upload',{method:'POST',body:fd});
  const data=await res.json();
  if(data.url){ document.getElementById('pPhoto').value=data.url; }
}

async function uploadGallery(input){
  const file=input.files[0]; if(!file) return;
  if(myMedia.length>=50){ alert('Максимум 50 слики!'); return; }
  const fd=new FormData(); fd.append('file',file); fd.append('majstor_id',myProfile.id);
  const res=await fetch('/api/upload',{method:'POST',body:fd});
  const data=await res.json();
  if(data.url){ await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({majstor_id:myProfile.id, url:data.url})}); loadMedia(); }
  else alert('Грешка: '+(data.error||''));
}

async function deleteMedia(id){
  if(!confirm('Избриши слика?')) return;
  await fetch('/api/delete-media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  loadMedia();
}
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
