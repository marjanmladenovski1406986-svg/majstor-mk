<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд — Majsto.mk</title>
<link rel="icon" href="/icon-192.png"><meta name="theme-color" content="#ff6b35">
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA" src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#0a0a0a;color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.85);backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px;color:#ff6b35;text-decoration:none}
.header-right{display:flex;align-items:center;gap:10px}
.btn-logout{background:transparent;border:1px solid #ff6b35;color:#ff6b35;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;}
.container{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:220px 1fr;gap:20px}
@media(max-width:800px){.container{grid-template-columns:1fr}}
.sidebar{background:#141414;border:1px solid #262626;border-radius:16px;padding:12px;height:fit-content;position:sticky;top:80px}
.tab{padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tab.active{background:#ff6b35;color:#000}
.tab span.count{background:#222;color:#fff;padding:2px 8px;border-radius:20px;font-size:12px}
.tab.active span.count{background:#000;color:#fff}
.card{background:#141414;border:1px solid #262626;border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:18px;font-weight:800;color:#ff6b35;margin-bottom:16px;display:flex;justify-content:space-between}
.banner{border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.banner-founder{background:linear-gradient(90deg,#1a2e0a,#2a3a0a);border:1px solid #4caf50}
.banner-premium{background:linear-gradient(90deg,#2a1a0a,#3a2510);border:1px solid #ff6b35}
.progress{height:10px;background:#222;border-radius:20px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:#ff6b35;transition:.5s}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid-2{grid-template-columns:1fr}}
.input{width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:10px;font-family:inherit}
textarea.input{resize:vertical}
.btn{padding:12px 18px;border-radius:10px;font-weight:800;border:none;cursor:pointer}
.btn-orange{background:#ff6b35;color:#fff;width:100%}
.btn-ghost{background:#222;color:#fff;border:1px solid #333}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.media-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#222}
.media-item img{width:100%;height:100%;object-fit:cover}
.media-actions{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;opacity:0;transition:.2s}
.media-item:hover .media-actions{opacity:1}
.icon-btn{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.dropzone{border:2px dashed #333;border-radius:16px;padding:30px;text-align:center;cursor:pointer;transition:.2s;background:#161616}
.dropzone:hover{border-color:#ff6b35;background:#1a1a1a}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:16px;text-align:center}
.stat b{font-size:24px;display:block}
.stat span{color:#888;font-size:12px}
.rating{padding:12px;background:#1e1e1e;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px}
.toast{position:fixed;bottom:20px;right:20px;background:#222;border:1px solid #333;padding:14px 18px;border-radius:12px;z-index:100;transform:translateY(100px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}
.loading{color:#666;text-align:center;padding:40px}
</style>
</head>
<body>
<header>
  <a href="/" class="logo">🔨 Majsto.mk</a>
  <div class="header-right">
    <span id="userName" style="color:#888;font-size:13px"></span>
    <a href="/" class="logo" style="font-size:14px;border:1px solid #333;padding:6px 12px;border-radius:8px;text-decoration:none;color:#aaa">← Сајт</a>
    <button class="btn-logout" onclick="logout()">Одјави се</button>
  </div>
</header>

<div class="container">
  <div class="sidebar" id="sidebar" style="display:none;">
    <div class="tab active" data-tab="info" onclick="switchTab('info')">📝 Основни <span class="count">•</span></div>
    <div class="tab" data-tab="gallery" onclick="switchTab('gallery')">🖼️ Галерија <span class="count" id="galCount">0/50</span></div>
    <div class="tab" data-tab="stats" onclick="switchTab('stats')">📊 Статистика</div>
    <div style="margin-top:20px;padding-top:20px;border-top:1px solid #222">
      <div style="font-size:12px;color:#666">Статус</div>
      <div id="statusBadge" style="margin-top:6px"></div>
    </div>
  </div>

  <div class="main" id="main">
    <div class="loading">Вчитувам дашборд...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CAT_NAMES={elektrika:"⚡ Електрика",vodovod:"💧 Водовод",gradeznistvo:"🏗️ Градежништво",popravki:"🔧 Поправки",finalni:"🎨 Финални работи",plockari:"🔲 Плочкари",gipsari:"🧱 Гипсари",stolari:"🚪 Столари",klima:"❄️ Клима",greenje:"🔥 Греење",krov:"🏠 Кров",sanitarii:"🚿 Санитарии",pvc:"🪟 ПВЦ",dvorovi:"🌳 Дворови",cistenje:"🧹 Чистење",opti:"🔨 Општи",bazeni:"🏊 Базени",fasadi:"🏢 Фасади",iskop:"🚜 Ископ",hidroizolacija:"🛡️ Хидроизолација",otpad:"🗑️ Отпад",videonadzor:"📹 Видео надзор"};
const CITIES=['Скопје','Битола','Куманово','Прилеп','Тетово','Велес','Штип','Охрид','Гостивар','Струмица','Кавадарци','Кочани','Кичево','Струга','Радовиш','Гевгелија','Дебар','Крива Паланка','Свети Николе','Неготино','Делчево','Ресен','Пробиштип','Берово','Кратово','Крушево','Валандово','Македонски Брод','Демир Хисар','Демир Капија','Богданци','Дојран','Пехчево','Виница'];
let majstor=null, media=[], ratings=[];

async function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelector('[data-tab="'+t+'"]').classList.add('active');
  
  if(t==='info') renderInfo();
  if(t==='gallery') {
    try {
      const r = await fetch('/api/media?majstor_id='+majstor.id);
      media = await r.json();
      if(!Array.isArray(media)) media = [];
    } catch(e) { media = []; }
    renderGallery();
  }
  if(t==='stats') renderStats();
}

window.addEventListener('load', async()=>{
  if (window.Clerk) {
    await window.Clerk.load();
    
    if (window.Clerk.user) {
      const email = window.Clerk.user.primaryEmailAddress.emailAddress;
      localStorage.setItem('logged_email', email); 
      
      try {
        const res = await fetch('/api/majstori');
        const data = await res.json();
        let myProfile = Array.isArray(data) ? data.find(m => m.email && m.email.toLowerCase() === email.toLowerCase()) : null;
        
        if(!myProfile || !myProfile.id){
          const token = await window.Clerk.session.getToken();
          const loginRes = await fetch('/api/clerk-login', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const loginData = await loginRes.json();
          
          if (loginData.success && loginData.id) {
            window.location.reload(); 
            return;
          } else {
            document.getElementById('main').innerHTML='<div class="card"><h2>⚠️ Грешка</h2><p>Не можевме да го креираме профилот.</p></div>';
            return;
          }
        }
        
        majstor = myProfile;
        const [mRes,rRes] = await Promise.all([
          fetch('/api/media?majstor_id='+majstor.id), 
          fetch('/api/ratings?majstor_id='+majstor.id)
        ]);
        media = await mRes.json(); 
        ratings = await rRes.json();
        
        document.getElementById('galCount').textContent=media.length + '/50';
        document.getElementById('sidebar').style.display='block';
        renderInfo();
        return; 
      } catch(e) {
        document.getElementById('main').innerHTML='<div class="card"><h2>❌ Грешка</h2><p>'+e.message+'</p></div>';
        return;
      }
    }
  }

  const email = localStorage.getItem('logged_email');
  if(!email) {
    document.getElementById('main').innerHTML='<div class="card"><h2>🔒 Не си најавен</h2><p>Те пренасочувам кон најава...</p></div>';
    setTimeout(()=>{ window.location.href = '/'; }, 1500);
    return;
  }

  document.getElementById('userName').textContent = email;

  try {
    const res = await fetch('/api/majstori');
    const data = await res.json();
    let myProfile = Array.isArray(data) ? data.find(m => m.email && m.email.toLowerCase() === email.toLowerCase()) : null;
    
             if(!myProfile || !myProfile.id){
          document.getElementById('main').innerHTML='<div class="card"><h2>⚠️ Немате профил на мајстор</h2><p>Мејлот <b>'+email+'</b> не е поврзан со мајстор.</p><button class="btn btn-orange" onclick="registerAsMajstor()" style="margin-top:15px;">Регистрирај се како мајстор</button></div>';
          return;
        }
    
    majstor = myProfile;
    const [mRes,rRes] = await Promise.all([
      fetch('/api/media?majstor_id='+majstor.id), 
      fetch('/api/ratings?majstor_id='+majstor.id)
    ]);
    media = await mRes.json(); 
    ratings = await rRes.json();
    
    document.getElementById('galCount').textContent=media.length + '/50';
    document.getElementById('sidebar').style.display='block';
    renderInfo();
  } catch(e) {
    document.getElementById('main').innerHTML='<div class="card"><h2>❌ Грешка</h2><p>'+e.message+'</p></div>';
  }
});

function renderInfo(){
  const isFounder = majstor.is_founder;
  const banner = isFounder 
    ? '<div class="banner banner-founder"><div><b>🚀 FOUNDER</b><br><span style="font-size:13px">Ти си меѓу првите 50 - имаш бесплатно засекогаш!</span></div></div>'
    : (majstor.is_premium 
        ? '<div class="banner banner-premium"><b>👑 PREMIUM</b> - Активен профил</div>'
        : '<div class="banner banner-premium" style="border-color:#ff6b35; background:#2a1a0a"><b>⚠️ Профилот не е активен</b></div>');
  
  document.getElementById('main').innerHTML=
    banner +
    '<div class="card">' +
      '<h2>📝 Основни информации</h2>' +
      '<div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:16px;">' +
        '<div style="text-align:center;">' +
          '<div style="width:80px; height:80px; border-radius:50%; background:#ff6b35; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; overflow:hidden; margin:0 auto 8px;">' +
            (majstor.photo_url ? '<img src="'+majstor.photo_url+'" style="width:100%; height:100%; object-fit:cover;">' : (majstor.name||'?').charAt(0).toUpperCase()) +
          '</div>' +
          '<button class="btn-ghost" style="padding:6px 12px; border-radius:6px; border:1px solid #333; background:#222; color:#fff; font-size:12px; cursor:pointer;" onclick="document.getElementById(\'avatarInput\').click()">📸 Смени слика</button>' +
          '<input type="file" id="avatarInput" hidden accept="image/*" onchange="uploadAvatar(this)">' +
        '</div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<input id="e-name" class="input" value="' + (majstor.name||'') + '" placeholder="Име">' +
        '<input id="e-phone" class="input" value="' + (majstor.phone||'') + '" placeholder="Телефон">' +
      '</div>' +
      '<div class="grid-2">' +
        '<select id="e-city" class="input">' + CITIES.map(c=>'<option value="'+c+'" '+(c===majstor.city?'selected':'')+'>'+c+'</option>').join('') + '</select>' +
        '<select id="e-cat" class="input">' + Object.entries(CAT_NAMES).map(([k,v])=>'<option value="'+k+'" '+(k===majstor.category?'selected':'')+'>'+v+'</option>').join('') + '</select>' +
      '</div>' +
      '<textarea id="e-desc" class="input" rows="4" placeholder="Опис">' + (majstor.description||'') + '</textarea>' +
      '<div class="grid-2">' +
        '<input id="e-fb" class="input" value="' + (majstor.facebook_url||'') + '" placeholder="Facebook URL">' +
        '<input id="e-web" class="input" value="' + (majstor.website_url||'') + '" placeholder="Вебсајт">' +
      '</div>' +
      '<button class="btn btn-orange" onclick="saveInfo()">💾 Зачувај промени</button>' +
      '<div style="margin-top:12px;text-align:center"><a href="/profile.html?id=' + majstor.id + '" target="_blank" style="color:#ff6b35;font-size:13px">👁️ Види јавен профил →</a></div>' +
    '</div>';
    
  document.getElementById('statusBadge').innerHTML = majstor.is_founder 
    ? '<span style="background:#4caf50;color:#000;padding:4px 10px;border-radius:20px;font-weight:800;font-size:11px">🚀 FOUNDER</span>' 
    : (majstor.is_premium ? '<span style="background:#ff6b35;color:#000;padding:4px 10px;border-radius:20px;font-weight:800;font-size:11px">👑 PREMIUM</span>' : '');
}

async function saveInfo(){
  const body = {
    id: majstor.id,
    name: document.getElementById('e-name').value,
    phone: document.getElementById('e-phone').value,
    city: document.getElementById('e-city').value,
    category: document.getElementById('e-cat').value,
    description: document.getElementById('e-desc').value,
    facebook_url: document.getElementById('e-fb').value,
    website_url: document.getElementById('e-web').value
  };
  const res = await fetch('/api/update-profile', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  toast(res.ok ? '✅ Зачувано' : 'Грешка при зачувување');
}

async function uploadAvatar(input) {
  const file = input.files[0]; if(!file) return;
  const compressed = await compressImage(file, 400, 0.6);
  const fd = new FormData(); fd.append('file', compressed);
  toast('Се качува...');
  try {
    const up = await fetch('/api/upload', {method:'POST', body:fd});
    const j = await up.json();
    if(j.secure_url) {
      await fetch('/api/update-avatar', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:majstor.id, url:j.secure_url}) });
      toast('✅ Сликата е сменета!');
      setTimeout(() => window.location.reload(), 1000);
    } else { toast('❌ Грешка: ' + (j.error || 'Непозната')); }
  } catch(e) { toast('❌ Грешка: ' + e.message); }
}

function renderGallery(){
  let gridHtml = media.map(m=>'<div class="media-item"><img src="'+m.url+'"><div class="media-actions"><button class="icon-btn" onclick="deleteImg('+m.id+')">🗑️</button></div></div>').join('');
  if(media.length === 0) gridHtml = '<p style="color:#666;text-align:center;grid-column:1/-1">Нема слики уште</p>';

  document.getElementById('main').innerHTML=
    '<div class="card">' +
      '<h2>🖼️ Галерија <span style="color:#888;font-weight:400">' + media.length + '/50</span></h2>' +
      '<div class="progress"><div class="progress-fill" style="width:' + (media.length/50*100) + '%"></div></div>' +
      '<p style="color:#888;font-size:13px;margin:10px 0">' + (media.length>=50?'Достигнат лимит':'Можеш да додадеш уште ' + (50-media.length) + ' слики') + '</p>' +
      (media.length >= 50 
        ? '<div class="dropzone" style="border-color:#ff6b6b; cursor:not-allowed;"><div style="font-size:24px">🚫</div><b>Достигнат лимит од 50 слики</b></div>'
        : '<div class="dropzone" onclick="document.getElementById(\'fileInput\').click()">' +
            '<div style="font-size:24px">📤</div><b>Кликни за качување слики</b>' +
            '<input type="file" id="fileInput" hidden accept="image/*" multiple onchange="handleFiles(this.files)">' +
          '</div>') +
    '</div>' +
    '<div class="card"><div class="media-grid">' + gridHtml + '</div></div>';
}

async function handleFiles(files){
  if (media.length >= 50) { toast('❌ Достигнат лимит од 50 слики!'); return; }
  const toUpload = Array.from(files).slice(0, 50-media.length);
  for(const file of toUpload){
    toast('Се качува ' + file.name + '...');
    const compressed = await compressImage(file, 1200, 0.5);
    const fd = new FormData(); fd.append('file', compressed);
    try {
      const up = await fetch('/api/upload', {method:'POST', body:fd});
      const j = await up.json();
      if(j.secure_url){
        await fetch('/api/add-media', { 
          method:'POST', 
          headers:{'Content-Type':'application/json'}, 
          body:JSON.stringify({majstor_id:majstor.id, url:j.secure_url, type:'image', file_id:j.fileId}) 
        });
      }
    } catch(e) { toast('❌ Грешка: ' + e.message); }
  }
  
  setTimeout(async () => {
    const r = await fetch('/api/media?majstor_id='+majstor.id); 
    media = await r.json(); 
    document.getElementById('galCount').textContent=media.length + '/50'; 
    renderGallery(); 
    toast('✅ Сликите се качени');
  }, 1000);
}

async function deleteImg(id){
  if(!confirm('Избриши?')) return; 
  await fetch('/api/delete-media', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id}) }); 
  const r = await fetch('/api/media?majstor_id='+majstor.id); 
  media = await r.json(); 
  document.getElementById('galCount').textContent=media.length + '/50'; 
  renderGallery(); 
  toast('Избришано');
}

function renderStats(){
  let ratingsHtml = ratings.map(r=>'<div class="rating"><div><div style="color:#ffb84d">' + '★'.repeat(r.rating) + '☆'.repeat(5-r.rating) + '</div><div style="margin-top:4px;color:#ccc;font-size:13px">' + (r.comment||'') + '</div></div></div>').join('');
  if(ratings.length === 0) ratingsHtml = '<p style="color:#666;text-align:center">Нема оценки</p>';

  document.getElementById('main').innerHTML=
    '<div class="stats-grid">' +
      '<div class="stat"><b>' + (majstor.views||0) + '</b><span>Прегледи</span></div>' +
      '<div class="stat"><b>' + (majstor.phone_clicks||0) + '</b><span>Кликови на тел</span></div>' +
      '<div class="stat"><b>' + (majstor.rating||0) + ' (' + (majstor.rating_count||0) + ')</b><span>Оценка</span></div>' +
    '</div>' +
    '<div class="card"><h2>⭐ Оценки (' + ratings.length + ')</h2>' + ratingsHtml + '</div>';
}

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); }

async function logout() {
  if (window.Clerk && window.Clerk.user) {
    await window.Clerk.signOut();
  }
  localStorage.removeItem('logged_email');
  localStorage.removeItem('user_type');
  location.href = '/';
}

// АЛАТКА ЗА КОМПРЕСИЈА НА СЛИКИ
function compressImage(file, maxWidth = 1200, quality = 0.5) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          const newFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: 'image/jpeg', lastModified: Date.now() });
          resolve(newFile);
        }, 'image/jpeg', quality);
      };
    };
  });
}
async function registerAsMajstor() {
  const email = window.Clerk.user.primaryEmailAddress.emailAddress;
  
  const res = await fetch('/api/register-user', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email: email, password: 'clerk_temp', isMajstor: true })
  });
  
  if (res.ok) {
    window.location.reload();
  } else {
    alert('Грешка при регистрација. Обиди се повторно.');
  }
}
  
</script>
</body>
