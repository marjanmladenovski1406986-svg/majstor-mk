<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Majsto.mk</title>
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA" src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Inter,system-ui}
header{position:sticky;top:0;background:#111;border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo{font-weight:900;color:#ff6b35;font-size:18px;text-decoration:none}
.btn{padding:10px 16px;border-radius:10px;border:1px solid #333;background:transparent;color:#ccc;cursor:pointer;font-weight:600}
.btn-orange{background:#ff6b35;border-color:#ff6b35;color:#fff;font-weight:800}
.container{max-width:1000px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tab{padding:10px 16px;background:#141414;border:1px solid #222;border-radius:10px;cursor:pointer;color:#888;font-weight:600}
.tab.active{background:#ff6b35;border-color:#ff6b35;color:#fff}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:16px}
.card h3{color:#ff6b35;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gallery .img-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #222;aspect-ratio:4/3}
.gallery .img-wrap img{width:100%;height:100%;object-fit:cover}
.gallery .img-wrap button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:none;color:#ff6b6b;border-radius:50%;width:24px;height:24px;cursor:pointer}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat{background:#1a1a1a;border:1px solid #222;border-radius:10px;padding:12px;text-align:center}
.stat .num{font-size:20px;font-weight:800;color:#ff6b35}
.stat .lbl{font-size:11px;color:#888}
.upload-box{border:2px dashed #333;border-radius:12px;padding:20px;text-align:center;cursor:pointer}
.upload-box:hover{border-color:#ff6b35}
</style>
</head>
<body>
<header><a href="/" class="logo">Majsto.mk</a><div id="headerAuth">Се вчитува...</div></header>
<div class="container">
<div id="loading">Се вчитува... најави се преку Clerk</div>
<div id="dashboard" style="display:none">
<h2 id="welcome"></h2>
<p id="founderBadge" style="margin:8px 0"></p>
<div class="tabs">
<button class="tab active" onclick="showTab(event,'profile')">Profil</button>
<button class="tab" onclick="showTab(event,'gallery')">Galerija (<span id="gCount">0</span>/50)</button>
<button class="tab" onclick="showTab(event,'stats')">Statistika</button>
<button class="tab" onclick="showTab(event,'payment')">Naplata</button>
</div>
<div class="tab-content active" id="tab-profile">
<div class="card">
<h3>Uredi profil</h3>
<input id="pName" placeholder="Ime i prezime">
<input id="pPhone" placeholder="Telefon 070...">
<select id="pCity"></select>
<select id="pCategory"></select>
<textarea id="pDesc" rows="3" placeholder="Opis..."></textarea>
<input id="pFb" placeholder="Facebook link">
<input id="pWeb" placeholder="Vebsajt">
<label style="color:#ff6b35;font-size:13px;font-weight:700;margin-bottom:4px;display:block">📷 Профилна слика</label>
<input id="pPhoto" placeholder="URL na profilna slika">
<input type="file" id="photoFile" accept="image/*" style="margin-bottom:12px">
<label style="color:#ff6b35;font-size:13px;font-weight:700;margin-bottom:4px;display:block">🖼️ Банер / Cover слика (заднина на профил)</label>
<input id="pCover" placeholder="URL na cover/baner slika">
<input type="file" id="coverFile" accept="image/*" style="margin-bottom:8px">
<button class="btn btn-orange" style="width:100%" onclick="saveProfile()">Zacuvaj profil</button>
<div id="pMsg" style="margin-top:8px;font-size:13px"></div>
</div>
</div>
<div class="tab-content" id="tab-gallery">
<div class="card">
<h3>Tvoi sliki (max 50)</h3>
<div class="upload-box" onclick="document.getElementById('galleryFile').click()">
Klikni za kacuvanje slika
<input type="file" id="galleryFile" accept="image/*" style="display:none">
</div>
<p style="color:#888;font-size:12px;margin:8px 0">Mozes do 50 sliki.</p>
<div class="gallery" id="galleryList"></div>
</div>
</div>
<div class="tab-content" id="tab-stats">
<div class="card"><h3>Statistika</h3><div class="stats-grid" id="statsGrid"></div></div>
<div class="card"><h3>Ocenki</h3><div id="ratingsList"></div></div>
</div>
<div class="tab-content" id="tab-payment">
<div class="card" id="paymentCard"></div>
</div>
</div>
</div>
<script>
const CITIES=['Skopje','Bitola','Kumanovo','Prilep','Tetovo','Veles','Stip','Ohrid','Gostivar','Strumica','Kavadarci','Kocani','Kicevo','Struga','Radovis','Gevgelija','Debar','Kriva Palanka','Sveti Nikole','Negotino','Delcevo','Resen','Probistip','Berovo','Kratovo','Krusevo','Valandovo','Makedonski Brod','Demir Hisar','Demir Kapija','Bogdanci','Dojran','Pehcevo','Vinica'];
const CAT_NAMES={elektrika:"Elektrika",vodovod:"Vodovod",gradeznistvo:"Gradeznistvo",popravki:"Popravki",finalni:"Finalni raboti",plockari:"Plockari",gipsari:"Gipsari i Moleri",stolari:"Stolari",klima:"Klima",greenje:"Greenje",krov:"Krov",sanitarii:"Sanitarii",pvc:"PVC prozori i vrati",dvorovi:"Ureduvanje dvorovi",cistenje:"Cistenje",opti:"Opsti rabotnici",bravari:"Bravarski uslugi",belatehnika:"Bela tehnika",videonadzor:"Video nadzor",bazeni:"Bazeni",fasadi:"Fasadi",iskop:"Iskop",hidroizolacija:"Hidro izolacija",otpad:"Frlanje otpad"};
let currentUser=null, myProfile=null, myMedia=[], myRatings=[];
function showTab(e,tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
}
window.addEventListener('load', async function(){
  if(!window.Clerk){ document.getElementById('loading').textContent='Clerk ne se vcital'; return; }
  await Clerk.load();
  currentUser=Clerk.user;
  document.getElementById('pCity').innerHTML=CITIES.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');
  document.getElementById('pCategory').innerHTML=Object.entries(CAT_NAMES).map(function(entry){return '<option value="'+entry[0]+'">'+entry[1]+'</option>';}).join('');
  
  if(!currentUser){
    document.getElementById('loading').innerHTML='<p>Ne si najaven</p><button class="btn btn-orange" onclick="Clerk.openSignIn()">Najavi se</button>';
    return;
  }
  document.getElementById('headerAuth').innerHTML='<span style="color:#888;font-size:12px">'+currentUser.primaryEmailAddress.emailAddress+'</span> <button class="btn" onclick="Clerk.signOut().then(function(){location.reload()})">Odjava</button> <a href="/" class="btn">Pocetna</a>';
  loadMe();
  document.getElementById('photoFile').addEventListener('change', function(){ uploadAvatar(this); });
  document.getElementById('coverFile').addEventListener('change', function(){ uploadCover(this); });
  document.getElementById('galleryFile').addEventListener('change', function(){ uploadGallery(this); });
});
async function loadMe(){
  try{
    // Check if admin wants to edit another profile
    var urlParams = new URLSearchParams(window.location.search);
    var editId = urlParams.get('edit_id');
    var isAdminEdit = !!editId;
    
    var url;
    if(isAdminEdit){
      url = '/api/majstori?id='+encodeURIComponent(editId);
    } else {
      url = '/api/me?clerk_id='+encodeURIComponent(currentUser.id)+'&email='+encodeURIComponent(currentUser.primaryEmailAddress.emailAddress);
    }
    var res=await fetch(url);
    var data=await res.json();
    if(data.error){ document.getElementById('loading').textContent='Greska: '+data.error; return; }
    // /api/majstori?id= returns object, /api/me returns object, but sometimes array
    if(Array.isArray(data)){ myProfile=data[0]; } else { myProfile=data; }
    if(!myProfile){ document.getElementById('loading').textContent='Грешка: Профилот не постои'; return; }
    document.getElementById('loading').style.display='none';
    document.getElementById('dashboard').style.display='block';
    document.getElementById('welcome').textContent='Zdravo, '+(myProfile.name||currentUser.firstName||'Majstore')+'!';
    if(isAdminEdit){
      document.getElementById('welcome').innerHTML += ' <span style="background:#ff6b35;color:#000;padding:4px 8px;border-radius:10px;font-size:12px;margin-left:8px">ADMIN EDIT MODE - уредуваш како '+myProfile.name+'</span>';
      document.getElementById('founderBadge').innerHTML = '<span style="background:#ff6b35;color:#000;padding:6px 12px;border-radius:20px;font-weight:900">🛠️ АДМИН - уредуваш туѓ профил ID:'+myProfile.id+'</span> <a href="/admin.html" style="color:#ff6b35;margin-left:10px">← Назад во Админ</a>';
    }
    if(myProfile.is_founder){
      document.getElementById('founderBadge').innerHTML='<span style="background:#4caf50;color:#000;padding:6px 12px;border-radius:20px;font-weight:900">FOUNDER #'+myProfile.founder_number+' — besplatno zasekogas</span>';
    } else if(myProfile.is_premium){
      var paidUntil = myProfile.paid_until ? new Date(myProfile.paid_until).toLocaleDateString('mk-MK') : 'aktiven';
      document.getElementById('founderBadge').innerHTML='<span style="background:#ff6b35;color:#000;padding:6px 12px;border-radius:20px;font-weight:900">PREMIUM do '+paidUntil+'</span>';
    } else {
      document.getElementById('founderBadge').innerHTML='<span style="background:#333;color:#aaa;padding:6px 12px;border-radius:20px;font-weight:600">Besplaten - <a href="/naplata.html" style="color:#ff6b35">Stani Premium 1000 den/god</a></span>';
    }
    document.getElementById('pName').value=myProfile.name||'';
    document.getElementById('pPhone').value=myProfile.phone||'';
    document.getElementById('pCity').value=myProfile.city||'Skopje';
    document.getElementById('pCategory').value=myProfile.category||'elektrika';
    document.getElementById('pDesc').value=myProfile.description||'';
    document.getElementById('pFb').value=myProfile.facebook_url||'';
    document.getElementById('pWeb').value=myProfile.website_url||'';
    document.getElementById('pPhoto').value=myProfile.photo_url||'';
    if(document.getElementById('pCover')) document.getElementById('pCover').value=myProfile.cover_url||'';
    loadMedia(); loadStats(); loadPayment();
  }catch(e){ document.getElementById('loading').textContent='Greska: '+e.message; }
}
async function loadMedia(){
  var res=await fetch('/api/media?majstor_id='+myProfile.id);
  myMedia=await res.json(); if(!Array.isArray(myMedia)) myMedia=[];
  document.getElementById('gCount').textContent=myMedia.length;
  document.getElementById('galleryList').innerHTML=myMedia.map(function(m){return '<div class="img-wrap"><img src="'+m.url+'"><button onclick="deleteMedia('+m.id+')">X</button></div>';}).join('') || '<p style="color:#666">Nema sliki</p>';
}
async function loadStats(){
  document.getElementById('statsGrid').innerHTML='<div class="stat"><div class="num">'+(myProfile.views||0)+'</div><div class="lbl">Pregledi</div></div><div class="stat"><div class="num">'+(myProfile.phone_clicks||0)+'</div><div class="lbl">Telefon</div></div><div class="stat"><div class="num">'+myMedia.length+'</div><div class="lbl">Sliki</div></div><div class="stat"><div class="num">'+(myProfile.rating||0)+'</div><div class="lbl">Ocena</div></div>';
  var rRes=await fetch('/api/ratings?majstor_id='+myProfile.id);
  myRatings=await rRes.json(); if(!Array.isArray(myRatings)) myRatings=[];
  document.getElementById('ratingsList').innerHTML=myRatings.map(function(r){return '<div style="background:#1a1a1a;border:1px solid #222;border-radius:8px;padding:8px;margin-bottom:6px"><b>'+r.rating+' '+ (r.user_name||'Anonimen')+'</b><p style="color:#ccc;font-size:13px">'+(r.comment||'')+'</p></div>';}).join('') || '<p style="color:#666">Nema ocenki</p>';
}
function loadPayment(){
  var card=document.getElementById('paymentCard');
  if(myProfile.is_founder){
    card.innerHTML='<h3>Founder - besplatno zasekogas</h3><p style="color:#ccc">Ti si megju prvite 50 - ne plakas nisto.</p><a href="/profile.html?id='+myProfile.id+'" class="btn btn-orange" style="display:inline-block;margin-top:12px">Vidi moj profil</a>';
  } else if(myProfile.is_premium && myProfile.paid_until && new Date(myProfile.paid_until)>new Date()){
    card.innerHTML='<h3>Premium aktiven</h3><p style="color:#4caf50;font-weight:800">Aktiven do '+new Date(myProfile.paid_until).toLocaleDateString('mk-MK')+'</p><a href="/profile.html?id='+myProfile.id+'" class="btn btn-orange" style="margin-top:12px;display:inline-block">Vidi profil</a>';
  } else {
    card.innerHTML='<h3>Stani Premium - 1000 den / godina</h3><p style="color:#ccc">50 sliki, statistika, prioritet.</p><a href="/naplata.html" class="btn btn-orange" style="display:block;text-align:center;margin-top:12px;text-decoration:none">Kon naplata (Stopanska direktno)</a>';
  }
}
async function saveProfile(){
  var body={id:myProfile.id, name:document.getElementById('pName').value, phone:document.getElementById('pPhone').value, city:document.getElementById('pCity').value, category:document.getElementById('pCategory').value, description:document.getElementById('pDesc').value, facebook_url:document.getElementById('pFb').value, website_url:document.getElementById('pWeb').value, photo_url:document.getElementById('pPhoto').value, cover_url:document.getElementById('pCover').value, clerk_id:currentUser.id, email:currentUser.primaryEmailAddress.emailAddress};
  var res=await fetch('/api/update-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  var data=await res.json();
  document.getElementById('pMsg').textContent=data.success?'Zacuvano!':'Greska: '+(data.error||'');
  if(data.success) loadMe();
}
async function uploadAvatar(input){
  var file=input.files[0]; if(!file) return;
  var fd=new FormData(); fd.append('file',file);
  var res=await fetch('/api/upload',{method:'POST',body:fd});
  var data=await res.json();
  if(data.url){ document.getElementById('pPhoto').value=data.url; document.getElementById('pMsg').textContent='✅ Профилна слика качена - кликни Зачувај профил'; }
}
async function uploadGallery(input){
  var file=input.files[0]; if(!file) return;
  if(myMedia.length>=50){ alert('Maksimum 50 sliki!'); return; }
  var fd=new FormData(); fd.append('file',file); fd.append('majstor_id',myProfile.id);
  var res=await fetch('/api/upload',{method:'POST',body:fd});
  var data=await res.json();
  if(data.url){ await fetch('/api/add-media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({majstor_id:myProfile.id, url:data.url})}); loadMedia(); }
  else alert('Greska: '+(data.error||''));
}
async function deleteMedia(id){
  if(!confirm('Izbrisi slika?')) return;
  await fetch('/api/delete-media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});
  loadMedia();
}
</script>
</body>
</html>
