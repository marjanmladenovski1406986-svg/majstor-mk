<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наплата — Majsto.mk</title>
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA" src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Inter,system-ui,sans-serif;padding:20px}
.container{max-width:700px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:8px}
.logo{font-weight:900;color:#ff6b35;font-size:22px;text-decoration:none}
.card{background:#141414;border:1px solid #222;border-radius:20px;padding:22px;margin-bottom:18px}
.card.f{border-color:#4caf50;background:#16221a}
.card.p{border-color:#ff6b35;background:#22160c}
.price{font-size:40px;font-weight:900;color:#ff6b35}
.price small{font-size:15px;color:#888;font-weight:400}
.btn{display:block;width:100%;text-align:center;text-decoration:none;padding:15px;border-radius:12px;border:none;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:#ff6b35;color:#fff;margin-top:14px}
.btn.g{background:#4caf50;color:#000}
.btn:disabled{opacity:.5}
.features{list-style:none;margin:14px 0}
.features li{padding:7px 0;color:#ccc;font-size:14px}
.features li::before{content:"✅ "}
.bank{background:#1a1a1a;border:1px dashed #444;border-radius:12px;padding:14px;margin:14px 0;font-family:monospace;font-size:14px;line-height:1.7;word-break:break-all}
.ok{color:#4caf50;font-weight:800}.wait{color:#ffb84d;font-weight:800}
.muted{color:#888;font-size:13px}
</style>
</head>
<body>
<div class="container">
<header><a href="/" class="logo">🔨 Majsto.mk</a><span id="userBox" class="muted"></span></header>
<div id="view"><p class="muted">Се вчитува...</p></div>
<div class="card"><h3>❓ Зошто се наплаќа?</h3>
<p class="muted" style="margin-top:8px;line-height:1.5;font-size:14px">Сакаме само сериозни мајстори. 1000 ден годишно е 83 ден месечно, без провизија од работа. Првите 50 мајстори се бесплатни засекогаш.</p></div>
</div>

<script>
// ВАЖНО: пополни ги вистинските податоци за уплата. Додека пишува „ЗАМЕНИ“, уплатните податоци не се прикажуваат.
const BANK={recipient:'ЗАМЕНИ',iban:'ЗАМЕНИ',bank:'ЗАМЕНИ',amount:'1000 MKD'};
const PRICE='1000';
const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null) e.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null&&c!==false) e.append(c);
  return e;
}
async function api(path,opts){
  opts=opts||{};
  const token=await Clerk.session.getToken();
  opts.headers=Object.assign({},opts.headers,{Authorization:'Bearer '+token});
  const res=await fetch(path,opts);
  const data=await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data&&data.error)||'Грешка');
  return data;
}
function msg(title,text,link){
  $('view').replaceChildren(h('div',{class:'card'},h('h2',{},title),h('p',{class:'muted',style:'margin-top:8px'},text),link&&h('a',{class:'btn',href:link.href},link.label)));
}

window.addEventListener('load',async()=>{
  for(let i=0;i<50&&!window.Clerk;i++) await new Promise(r=>setTimeout(r,200));
  if(!window.Clerk) return msg('Грешка','Не успеа да се вчита најавата. Освежи ја страницата.');
  await Clerk.load();
  if(!Clerk.user){Clerk.openSignIn({afterSignInUrl:'/naplata.html'});return msg('Најави се','Најави се за да го видиш статусот на твојот профил.')}
  const em=Clerk.user.primaryEmailAddress;
  $('userBox').textContent=em?em.emailAddress:'';
  let m=null;
  try{m=await api('/api/my-profile')}catch(e){return msg('Грешка',e.message)}
  if(!m) return msg('Немаш профил','Прво создај профил на мајстор.',{href:'/dashboard.html',label:'Создај профил'});

  if(m.is_founder){
    return $('view').replaceChildren(h('div',{class:'card f'},h('h2',{},'🚀 Ти си FOUNDER'),
      h('p',{class:'muted',style:'margin-top:8px'},'Ти си меѓу првите 50 мајстори. Профилот е бесплатен засекогаш, не плаќаш ништо.'),
      h('a',{class:'btn g',href:'/dashboard.html'},'Кон мојот профил')));
  }
  const until=m.paid_until?new Date(m.paid_until):null;
  const active=m.is_premium&&until&&until>new Date();
  const card=h('div',{class:'card p'},h('h2',{},'👑 Premium — '+PRICE+' ден / година'),
    h('div',{class:'price'},PRICE,' ',h('small',{},'ден / година')),
    h('ul',{class:'features'},...['50 слики од работа','Приоритет во пребарување','Статистика на прегледи и повици','Оценки и коментари од клиенти','Директен контакт без провизија'].map(t=>h('li',{},t))));
  if(active){
    card.append(h('p',{class:'ok'},'✅ Профилот е активен до '+until.toLocaleDateString('mk-MK')),h('a',{class:'btn',href:'/dashboard.html'},'Кон мојот профил'));
  } else if(m.payment_status==='pending'){
    card.append(h('p',{class:'wait'},'⏳ Уплатата е во проверка. Ќе те активираме во рок од 24 часа.'));
  } else {
    const ready=!Object.values(BANK).some(v=>String(v).includes('ЗАМЕНИ'));
    if(ready){
      card.append(h('h3',{style:'margin-top:16px;color:#ff6b35'},'Банкарска уплата'),
        h('div',{class:'bank'},'Примач: '+BANK.recipient,h('br'),'IBAN: '+BANK.iban,h('br'),'Банка: '+BANK.bank,h('br'),'Износ: '+BANK.amount,h('br'),'Сврха: Majsto.mk Premium '+(m.phone||'')),
        h('p',{class:'muted'},'После уплатата, кликни на копчето за да ни јавиш.'));
      const btn=h('button',{class:'btn'},'Платив сум');
      btn.addEventListener('click',async()=>{
        btn.disabled=true;
        try{await api('/api/payment-request',{method:'POST'});location.reload()}catch(e){alert(e.message);btn.disabled=false}
      });
      card.append(btn);
    } else {
      card.append(h('p',{class:'muted',style:'margin-top:14px'},'Податоците за уплата наскоро ќе бидат објавени. За активација пиши на info@majsto.mk или јави се на 076 638 703.'));
    }
  }
  $('view').replaceChildren(card);
});
</script>
</body>
</html>
