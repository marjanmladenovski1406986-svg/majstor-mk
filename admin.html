<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ — Majsto.mk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#0a0a0a;color:#fff;min-height:100vh}
header{background:#111;border-bottom:1px solid #222;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#ff6b35;font-size:18px;text-decoration:none}
.btn{padding:8px 14px;border-radius:8px;border:1px solid #333;background:transparent;color:#aaa;font-size:13px;cursor:pointer}
.btn-orange{background:#ff6b35;border-color:#ff6b35;color:#fff;font-weight:700}
.container{max-width:1200px;margin:0 auto;padding:20px}
.login-box{max-width:400px;margin:100px auto;padding:30px;background:#141414;border:1px solid #2a2a2a;border-radius:16px;text-align:center}
.login-box h1{color:#ff6b35;margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:16px}
.stat-card .num{font-size:28px;font-weight:800;color:#ff6b35}
.stat-card .lbl{color:#888;font-size:12px;margin-top:4px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.avatar{width:44px;height:44px;border-radius:50%;background:#ff6b35;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:200px}
.title{font-weight:700;font-size:14px}
.meta{font-size:11px;color:#888;margin-top:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:800}
.badge-founder{background:linear-gradient(90deg,#4caf50,#8bc34a);color:#000}
.badge-premium{background:#ff6b35;color:#000}
.btn-small{padding:6px 10px;border-radius:6px;font-size:11px;border:1px solid #333;background:transparent;color:#aaa;cursor:pointer}
.btn-small.delete{border-color:#ff6b6b;color:#ff6b6b}
.btn-small.approve{background:#4caf50;color:#000;border:none;font-weight:bold;}
.section-title{border-top:1px solid #333; padding-top:20px; margin-top:30px; color:#ff6b35; margin-bottom:16px;}
.no-access{max-width:400px;margin:100px auto;padding:30px;background:#1a1a1a;border:1px solid #3a1a1a;border-radius:16px;text-align:center}
</style>
</head>
<body>

<!-- Екран за најава (ако не си најавен) -->
<div class="login-box" id="loginBox"><h1>🔐 Админ</h1><p style="color:#888;font-size:13px">Проверувам најава...</p></div>

<!-- Екран за нема пристап -->
<div class="no-access" id="noAccess" style="display:none">
  <h1 style="color:#ff6b6b">❌ Нема пристап</h1>
  <p style="color:#999;margin-top:10px">Овој панел е само за администратори. Најави се со админ мејл.</p>
  <button class="btn btn-orange" style="margin-top:16px" onclick="location.href='/'">← Кон сајтот за најава</button>
</div>

<!-- Главен Админ Панел -->
<div id="adminPanel" style="display:none">
  <header>
    <div class="logo">🔨 Админ — Majsto.mk</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="adminEmail" style="color:#888;font-size:12px"></span>
      <button class="btn" onclick="logout()">Одјави се</button>
      <button class="btn" onclick="location.href='/'">← Сајт</button>
    </div>
  </header>
  
  <div class="container">
    <!-- Статистика -->
    <h2 style="color:#ff6b35;margin-bottom:16px">📊 Статистика</h2>
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Секција за оценки на чекање -->
    <h2 class="section-title">⭐ Оценки на чекање за одобрување</h2>
    <div class="list" id="pendingRatingsList" style="margin-bottom: 40px;">
      <p style="color:#888">Вчитувам оценки...</p>
    </div>

    <!-- Секција за сите мајстори -->
    <h2 class="section-title">👷 Сите мајстори</h2>
    <div class="list" id="majList"></div>
  </div>
</div>

<script>
// Овде ги ставаш мејловите на администраторите
const ADMIN_EMAILS = ['marjanmladenovski1406986@gmail.com', 'majsto.info@gmail.com'];
let allMajstori = [];

window.addEventListener('load', () => {
  // Проверка преку локалниот систем за најава наместо Clerk
  const loggedEmail = localStorage.getItem('logged_email');

  if (!loggedEmail) {
    document.getElementById('loginBox').innerHTML = '<p style="color:#ff6b6b;margin-bottom:16px">Не си најавен.</p><button class="btn btn-orange" onclick="location.href=\'/\'">Најави се на почетна</button>';
    return;
  }

  const userEmail = loggedEmail.toLowerCase().trim();

  if (!ADMIN_EMAILS.includes(userEmail)) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('noAccess').style.display = 'block';
    return;
  }

  // Ако сè е во ред, отвори го панелот
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  document.getElementById('adminEmail').textContent = userEmail;
  
  // Вчитај ги податоците
  loadAllMajstori();
  loadPendingRatings();
});

// Функција за одјава
function logout() {
  localStorage.removeItem('logged_email');
  localStorage.removeItem('user_type');
  location.href = '/';
}

// ===== 1. ВЧИТУВАЊЕ НА МАЈСТОРИ =====
async function loadAllMajstori() {
  try {
    const res = await fetch('/api/majstori');
    allMajstori = await res.json();
    
    // Статистика
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="num">${allMajstori.length}</div><div class="lbl">👷 Вкупно мајстори</div></div>
      <div class="stat-card"><div class="num">${allMajstori.filter(m=>m.is_founder).length}</div><div class="lbl">🚀 Founders</div></div>
      <div class="stat-card"><div class="num">${allMajstori.filter(m=>m.is_premium && !m.is_founder).length}</div><div class="lbl">👑 Premium</div></div>
    `;

    // Листа на мајстори
    document.getElementById('majList').innerHTML = allMajstori.map(m => {
      const avatar = (m.photo_url && m.photo_url.startsWith('http')) ? `<img src="${m.photo_url}">` : (m.name||'?').charAt(0).toUpperCase();
      const badge = m.is_founder ? '<span class="badge badge-founder">🚀 FOUNDER</span>' : (m.is_premium ? '<span class="badge badge-premium">👑 PREMIUM</span>' : '');
      return `<div class="item">
        <div class="avatar">${avatar}</div>
        <div class="info">
          <div class="title">${m.name} ${badge}</div>
          <div class="meta">${m.category} • ${m.city} • ${m.phone||''} • ⭐ ${m.rating||0}</div>
        </div>
        <div class="actions">
          <button class="btn-small" onclick="window.open('/profile.html?id=${m.id}','_blank')">👁️ Види</button>
          <button class="btn-small delete" onclick="deleteMajstor(${m.id})">🗑️ Избриши</button>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    console.error("Грешка при вчитување на мајстори:", e);
  }
}

async function deleteMajstor(id) {
  if(!confirm('Дали сте сигурни дека сакате да го избришете мајсторот?')) return;
  await fetch('/api/delete-majstor', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id})
  });
  loadAllMajstori(); // Освежи ја листата
}

// ===== 2. ВЧИТУВАЊЕ НА ОЦЕНКИ НА ЧЕКАЊЕ =====
async function loadPendingRatings() {
  const container = document.getElementById('pendingRatingsList');
  try {
    const res = await fetch('/api/pending-ratings');
    const ratings = await res.json();

    if (ratings.length === 0) {
      container.innerHTML = '<p style="color:#666">Нема нови оценки за одобрување.</p>';
      return;
    }

    container.innerHTML = ratings.map(r => `
      <div class="item">
        <div class="info">
          <div class="title">За мајстор: <span style="color:#ff6b35">${r.majstor_name}</span></div>
          <div style="color:#ffb84d; margin: 4px 0;">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
          <div class="meta" style="font-size:13px; color:#ccc;">"${r.comment || 'Без коментар'}"</div>
          <div class="meta">Испратено на: ${new Date(r.created_at).toLocaleDateString('mk-MK')}</div>
        </div>
        <div class="actions">
          <button class="btn-small approve" onclick="approveRating(${r.id})">✅ Одобри</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = '<p style="color:#ff6b6b">Грешка при вчитување на оценките.</p>';
  }
}

// ===== 3. ОДОБРУВАЊЕ НА ОЦЕНКА =====
async function approveRating(id) {
  if(!confirm('Одобри ја оваа оценка?')) return;
  try {
    await fetch('/api/approve-rating', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id })
    });
    loadPendingRatings(); // Освежи ја листата на оценки
    loadAllMajstori();    // Освежи ја статистиката (за да се ажурира просекот)
  } catch (e) {
    alert("Грешка при одобрување.");
  }
}
</script>
</body>
</html>
