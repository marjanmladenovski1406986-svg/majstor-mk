
<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ — Мајстор.мк</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }

header { background: #1a1a1a; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2a2a; flex-wrap: wrap; gap: 10px; }
.logo { font-size: 20px; font-weight: 700; color: #ff6b35; }
.header-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.user-email { color: #999; font-size: 13px; }
.btn-logout { background: transparent; border: 1px solid #333; color: #999; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; }
.btn-logout:hover { border-color: #ff6b35; color: #ff6b35; }

.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

.login-box { max-width: 400px; margin: 100px auto; padding: 40px 30px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; text-align: center; }
.login-box h1 { color: #ff6b35; margin-bottom: 20px; font-size: 24px; }
.login-box input { width: 100%; padding: 14px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 12px; font-family: inherit; }
.login-box input:focus { outline: none; border-color: #ff6b35; }
.login-box button { width: 100%; padding: 14px; background: #ff6b35; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
.login-box .msg { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; }
.login-box .msg.error { background: #3a1a1a; color: #ff6b6b; display: block; }

.admin-panel { display: none; }
.admin-panel.active { display: block; }

.tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 12px 20px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; color: #999; font-weight: 600; }
.tab.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }

.tab-content { display: none; }
.tab-content.active { display: block; }

.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.section-header h2 { color: #ff6b35; font-size: 22px; }
.btn-add { background: #ff6b35; border: none; color: #fff; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14px; }
.btn-add:hover { background: #e55a2b; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
.stat-card { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 20px; border-radius: 12px; }
.stat-card .number { font-size: 36px; font-weight: 700; color: #ff6b35; }
.stat-card .label { color: #999; font-size: 14px; margin-top: 5px; }

.category-list { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px; }
.category-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2a2a; }
.category-row:last-child { border-bottom: none; }
.category-row .name { color: #fff; }
.category-row .count { color: #ff6b35; font-weight: 600; }

.search-bar { width: 100%; max-width: 400px; padding: 12px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 14px; font-family: inherit; margin-bottom: 15px; }
.search-bar:focus { outline: none; border-color: #ff6b35; }

.items-list { display: flex; flex-direction: column; gap: 10px; }
.item { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
.item-thumb { width: 80px; height: 45px; border-radius: 6px; background: #2a2a2a; overflow: hidden; flex-shrink: 0; }
.item-thumb img { width: 100%; height: 100%; object-fit: cover; }
.item-avatar { width: 45px; height: 45px; border-radius: 50%; background: #ff6b35; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; overflow: hidden; }
.item-avatar img { width: 100%; height: 100%; object-fit: cover; }
.item-info { flex: 1; min-width: 200px; }
.item-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.item-meta { font-size: 12px; color: #999; }
.item-actions { display: flex; gap: 8px; }
.btn-edit { background: transparent; border: 1px solid #4db8ff; color: #4db8ff; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
.btn-edit:hover { background: #4db8ff; color: #fff; }
.btn-delete { background: transparent; border: 1px solid #ff6b6b; color: #ff6b6b; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
.btn-delete:hover { background: #ff6b6b; color: #fff; }

.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
.modal.open { display: flex; }
.modal-content { background: #1a1a1a; padding: 30px; border-radius: 16px; max-width: 500px; width: 100%; border: 1px solid #2a2a2a; margin: auto; max-height: 90vh; overflow-y: auto; }
.modal-content h2 { color: #ff6b35; text-align: center; margin-bottom: 20px; }
.modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 10px; font-family: inherit; }
.modal-content input:focus, .modal-content select:focus, .modal-content textarea:focus { outline: none; border-color: #ff6b35; }
.modal-content button { width: 100%; padding: 12px; background: #ff6b35; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 10px; }
.modal-msg { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; }
.modal-msg.error { background: #3a1a1a; color: #ff6b6b; display: block; }
.modal-msg.success { background: #1a3a1a; color: #6bff6b; display: block; }
.modal-msg.info { background: #1a2a3a; color: #6bb8ff; display: block; }
.hidden { display: none; }

.no-access { max-width: 400px; margin: 100px auto; padding: 40px 30px; background: #1a1a1a; border: 1px solid #3a1a1a; border-radius: 16px; text-align: center; }
.no-access h1 { color: #ff6b6b; margin-bottom: 15px; }
</style>
</head>
<body>

<!-- LOGIN BOX -->
<div class="login-box" id="loginBox">
  <h1>🔐 Админ Панел</h1>
  <div class="msg" id="loginMsg"></div>
  <input type="email" id="adminEmail" placeholder="Е-пошта">
  <input type="password" id="adminPassword" placeholder="Лозинка">
  <button onclick="handleAdminLogin()">Најави се</button>
</div>

<!-- NO ACCESS -->
<div class="no-access hidden" id="noAccess">
  <h1>❌ Нема пристап</h1>
  <p style="color: #999;">Само администраторот може да влезе.</p>
  <button onclick="window.location.href='/'" style="margin-top: 20px; padding: 12px 20px; background: #ff6b35; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-family: inherit;">← Кон сајтот</button>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">
  <header>
    <div class="logo">🔨 Админ — Мајстор.мк</div>
    <div class="header-right">
      <span class="user-email" id="adminUserEmail"></span>
      <button class="btn-logout" onclick="handleAdminLogout()">Одјави се</button>
      <button class="btn-logout" onclick="window.location.href='/'">← Кон сајтот</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="showTab('stats')">📊 Статистика</button>
      <button class="tab" onclick="showTab('videos')">🎬 Видеа</button>
      <button class="tab" onclick="showTab('majstori')">👷 Мајстори</button>
    </div>

    <!-- STATS TAB -->
    <div class="tab-content active" id="tab-stats">
      <h2 style="color: #ff6b35; margin-bottom: 20px;">📊 Статистика</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <h3 style="color: #ff6b35; margin-bottom: 15px;">По категорија</h3>
      <div class="category-list" id="categoryList"></div>
    </div>

    <!-- VIDEOS TAB -->
    <div class="tab-content" id="tab-videos">
      <div class="section-header">
        <h2>🎬 Видеа (<span id="videosCount">0</span>)</h2>
        <button class="btn-add" onclick="openAddVideo()">+ Додај видео</button>
      </div>
      <input type="text" class="search-bar" id="videoSearch" placeholder="🔍 Пребарај по наслов..." oninput="renderVideosList()">
      <div class="items-list" id="videosList"></div>
    </div>

    <!-- MAJSTORI TAB -->
    <div class="tab-content" id="tab-majstori">
      <div class="section-header">
        <h2>👷 Мајстори (<span id="majstoriCount">0</span>)</h2>
      </div>
      <input type="text" class="search-bar" id="majstorSearch" placeholder="🔍 Пребарај по име или град..." oninput="renderMajstoriList()">
      <div class="items-list" id="majstoriList"></div>
    </div>
  </div>
</div>

<!-- VIDEO MODAL -->
<div class="modal" id="videoModal">
  <div class="modal-content">
    <h2 id="videoModalTitle">Додај видео</h2>
    <div class="modal-msg" id="videoMsg"></div>
    <input type="text" id="vTitle" placeholder="Наслов (македонски)">
    <input type="text" id="vTitleEn" placeholder="Title (English)">
    <input type="text" id="vYoutube" placeholder="YouTube линк или ID">
    <select id="vCategory"></select>
    <input type="number" id="vLikes" placeholder="Лајкови (0)" value="0">
    <button onclick="handleSaveVideo()">Зачувај</button>
    <button onclick="closeVideoModal()" style="background:transparent; border:1px solid #333; color:#999;">Откажи</button>
  </div>
</div>

<!-- MAJSTOR MODAL -->
<div class="modal" id="majstorModal">
  <div class="modal-content">
    <h2>Уреди мајстор</h2>
    <div class="modal-msg" id="majstorMsg"></div>
    <input type="text" id="mName" placeholder="Име и презиме">
    <input type="tel" id="mPhone" placeholder="Телефон">
    <input type="text" id="mCity" placeholder="Град">
    <select id="mCategory"></select>
    <textarea id="mDescription" placeholder="Опис" rows="3"></textarea>
    <input type="number" id="mRating" placeholder="Оценка (0-5)" step="0.1" min="0" max="5">
    <button onclick="handleSaveMajstor()">Зачувај</button>
    <button onclick="closeMajstorModal()" style="background:transparent; border:1px solid #333; color:#999;">Откажи</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://brxdimqgujhemgpfujcq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyeGRpbXFndWpoZW1ncGZ1amNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTgxMjYsImV4cCI6MjEwNDc5NDEyNn0.gh0vekUMPmzg5EbkGvaRFLfBL8SWsjGUvB1BY4H5T5Y';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_EMAIL = 'marjanmladenovski1406986@gmail.com';

const CAT_NAMES = {
  elektrika: "Електрика", vodovod: "Водовод", gradeznistvo: "Градежништво",
  popravki: "Поправки", finalni: "Финални работи", plockari: "Плочкари",
  gipsari: "Гипсари и Молери", stolari: "Столари", klima: "Клима",
  greenje: "Греење", krov: "Кров", sanitarii: "Санитарии",
  pvc: "ПВЦ прозори и врати", dvorovi: "Уредување дворови", cistenje: "Чистење"
};

let allVideos = [];
let allMajstori = [];
let editingVideoId = null;
let editingMajstorId = null;

async function checkAdminAuth() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (user && user.email === ADMIN_EMAIL) {
    showAdminPanel(user.email);
  } else if (user && user.email !== ADMIN_EMAIL) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('noAccess').classList.remove('hidden');
  }
}

function showAdminPanel(email) {
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('noAccess').classList.add('hidden');
  document.getElementById('adminPanel').classList.add('active');
  document.getElementById('adminUserEmail').textContent = email;
  populateCategorySelects();
  loadAllData();
}

async function handleAdminLogin() {
  const email = document.getElementById('adminEmail').value;
  const password = document.getElementById('adminPassword').value;
  const msg = document.getElementById('loginMsg');
  if (!email || !password) { msg.textContent = 'Внеси мејл и лозинка'; msg.className = 'msg error'; return; }
  msg.textContent = 'Се најавувам...'; msg.className = 'msg';
  msg.style.display = 'block'; msg.style.background = '#1a2a3a'; msg.style.color = '#6bb8ff';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { msg.textContent = 'Грешка: ' + error.message; msg.className = 'msg error'; return; }
  if (data.user.email !== ADMIN_EMAIL) {
    msg.textContent = 'Немаш админ пристап'; msg.className = 'msg error';
    await supabaseClient.auth.signOut();
    return;
  }
  showAdminPanel(data.user.email);
}

async function handleAdminLogout() {
  await supabaseClient.auth.signOut();
  document.getElementById('adminPanel').classList.remove('active');
  document.getElementById('loginBox').classList.remove('hidden');
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function populateCategorySelects() {
  const opts = Object.entries(CAT_NAMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  document.getElementById('vCategory').innerHTML = opts;
  document.getElementById('mCategory').innerHTML = opts;
}

async function loadAllData() {
  const { data: vids } = await supabaseClient.from('videos').select('*').order('id', { ascending: false });
  allVideos = vids || [];
  const { data: maj } = await supabaseClient.from('majstor_profiles').select('*').order('id', { ascending: true });
  allMajstori = maj || [];
  renderStats();
  renderVideosList();
  renderMajstoriList();
}

function renderStats() {
  const { data: users } = { data: [] };
  const totalVideos = allVideos.length;
  const totalMajstori = allMajstori.length;
  const bezMajstor = allVideos.filter(v => !v.majstor_id).length;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="number">${totalVideos}</div><div class="label">🎬 Видеа</div></div>
    <div class="stat-card"><div class="number">${totalMajstori}</div><div class="label">👷 Мајстори</div></div>
    <div class="stat-card"><div class="number">${bezMajstor}</div><div class="label">📹 Генерални видеа</div></div>
  `;

  const counts = {};
  allVideos.forEach(v => { counts[v.category] = (counts[v.category] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  document.getElementById('categoryList').innerHTML = sorted.map(([cat, count]) =>
    `<div class="category-row"><span class="name">${CAT_NAMES[cat] || cat}</span><span class="count">${count} видеа</span></div>`
  ).join('') || '<p style="color:#666;">Нема видеа</p>';
}

function renderVideosList() {
  const search = document.getElementById('videoSearch').value.toLowerCase();
  const filtered = allVideos.filter(v => !search || v.title.toLowerCase().includes(search));
  document.getElementById('videosCount').textContent = filtered.length;
  const list = document.getElementById('videosList');
  if (filtered.length === 0) { list.innerHTML = '<p style="color:#666; text-align:center; padding:20px;">Нема видеа</p>'; return; }
  list.innerHTML = filtered.map(v => `
    <div class="item">
      <div class="item-thumb"><img src="https://img.youtube.com/vi/${v.youtube_id}/hqdefault.jpg" onerror="this.style.display='none'"></div>
      <div class="item-info">
        <div class="item-title">${v.title}</div>
        <div class="item-meta">${CAT_NAMES[v.category] || v.category} • ID: ${v.id} ${v.majstor_id ? '• Мајстор ID: ' + v.majstor_id : '• Генерално'}</div>
      </div>
      <div class="item-actions">
        <button class="btn-edit" onclick="openEditVideo(${v.id})">✏️ Уреди</button>
        <button class="btn-delete" onclick="deleteVideo(${v.id})">🗑️ Избриши</button>
      </div>
    </div>
  `).join('');
}

function renderMajstoriList() {
  const search = document.getElementById('majstorSearch').value.toLowerCase();
  const filtered = allMajstori.filter(m => !search || (m.name||'').toLowerCase().includes(search) || (m.city||'').toLowerCase().includes(search));
  document.getElementById('majstoriCount').textContent = filtered.length;
  const list = document.getElementById('majstoriList');
  if (filtered.length === 0) { list.innerHTML = '<p style="color:#666; text-align:center; padding:20px;">Нема мајстори</p>'; return; }
  list.innerHTML = filtered.map(m => {
    const avatar = m.photo_url ? `<img src="${m.photo_url}">` : (m.name||'?').charAt(0).toUpperCase();
    return `
    <div class="item">
      <div class="item-avatar">${avatar}</div>
      <div class="item-info">
        <div class="item-title">${m.name || 'Мајстор'}</div>
        <div class="item-meta">${CAT_NAMES[m.category] || m.category} • ${m.city || '-'} • ${m.phone || '-'} • ⭐ ${m.rating || 0}</div>
      </div>
      <div class="item-actions">
        <button class="btn-edit" onclick="openEditMajstor(${m.id})">✏️ Уреди</button>
        <button class="btn-delete" onclick="deleteMajstor(${m.id})">🗑️ Избриши</button>
      </div>
    </div>`;
  }).join('');
}

// VIDEO CRUD
function openAddVideo() {
  editingVideoId = null;
  document.getElementById('videoModalTitle').textContent = 'Додај видео';
  document.getElementById('vTitle').value = '';
  document.getElementById('vTitleEn').value = '';
  document.getElementById('vYoutube').value = '';
  document.getElementById('vLikes').value = '0';
  document.getElementById('videoMsg').className = 'modal-msg';
  document.getElementById('videoModal').classList.add('open');
}

function openEditVideo(id) {
  const v = allVideos.find(x => x.id === id);
  if (!v) return;
  editingVideoId = id;
  document.getElementById('videoModalTitle').textContent = 'Уреди видео';
  document.getElementById('vTitle').value = v.title || '';
  document.getElementById('vTitleEn').value = v.title_en || '';
  document.getElementById('vYoutube').value = v.youtube_id || '';
  document.getElementById('vCategory').value = v.category || 'elektrika';
  document.getElementById('vLikes').value = v.likes || 0;
  document.getElementById('videoMsg').className = 'modal-msg';
  document.getElementById('videoModal').classList.add('open');
}

function closeVideoModal() { document.getElementById('videoModal').classList.remove('open'); }

async function handleSaveVideo() {
  const msg = document.getElementById('videoMsg');
  const title = document.getElementById('vTitle').value.trim();
  const titleEn = document.getElementById('vTitleEn').value.trim();
  const youtube = document.getElementById('vYoutube').value.trim();
  const category = document.getElementById('vCategory').value;
  const likes = parseInt(document.getElementById('vLikes').value) || 0;

  if (!title || !youtube || !category) { msg.textContent = 'Пополни наслов, YouTube и категорија'; msg.className = 'modal-msg error'; return; }

  let videoId = youtube;
  const match = youtube.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  if (match) videoId = match[1];

  msg.textContent = 'Се зачувува...'; msg.className = 'modal-msg info';

  if (editingVideoId) {
    const { error } = await supabaseClient.from('videos').update({ title, title_en: titleEn || title, youtube_id: videoId, category, likes }).eq('id', editingVideoId);
    if (error) { msg.textContent = error.message; msg.className = 'modal-msg error'; return; }
    msg.textContent = '✅ Зачувано!'; msg.className = 'modal-msg success';
  } else {
    const { error } = await supabaseClient.from('videos').insert({ title, title_en: titleEn || title, youtube_id: videoId, category, likes });
    if (error) { msg.textContent = error.message; msg.className = 'modal-msg error'; return; }
    msg.textContent = '✅ Додадено!'; msg.className = 'modal-msg success';
  }
  setTimeout(() => { closeVideoModal(); loadAllData(); }, 800);
}

async function deleteVideo(id) {
  if (!confirm('Дали си сигурен?')) return;
  await supabaseClient.from('videos').delete().eq('id', id);
  loadAllData();
}

// MAJSTOR CRUD
function openEditMajstor(id) {
  const m = allMajstori.find(x => x.id === id);
  if (!m) return;
  editingMajstorId = id;
  document.getElementById('mName').value = m.name || '';
  document.getElementById('mPhone').value = m.phone || '';
  document.getElementById('mCity').value = m.city || '';
  document.getElementById('mCategory').value = m.category || 'elektrika';
  document.getElementById('mDescription').value = m.description || '';
  document.getElementById('mRating').value = m.rating || 0;
  document.getElementById('majstorMsg').className = 'modal-msg';
  document.getElementById('majstorModal').classList.add('open');
}

function closeMajstorModal() { document.getElementById('majstorModal').classList.remove('open'); }

async function handleSaveMajstor() {
  const msg = document.getElementById('majstorMsg');
  const name = document.getElementById('mName').value.trim();
  const phone = document.getElementById('mPhone').value.trim();
  const city = document.getElementById('mCity').value.trim();
  const category = document.getElementById('mCategory').value;
  const description = document.getElementById('mDescription').value.trim();
  const rating = parseFloat(document.getElementById('mRating').value) || 0;

  if (!name) { msg.textContent = 'Пополни име'; msg.className = 'modal-msg error'; return; }
  msg.textContent = 'Се зачувува...'; msg.className = 'modal-msg info';

  const { error } = await supabaseClient.from('majstor_profiles').update({ name, phone, city, category, description, rating }).eq('id', editingMajstorId);
  if (error) { msg.textContent = error.message; msg.className = 'modal-msg error'; return; }
  msg.textContent = '✅ Зачувано!'; msg.className = 'modal-msg success';
  setTimeout(() => { closeMajstorModal(); loadAllData(); }, 800);
}

async function deleteMajstor(id) {
  if (!confirm('Дали си сигурен? Ова ќе ги избрише и неговите слики/видеа.')) return;
  await supabaseClient.from('majstor_profiles').delete().eq('id', id);
  loadAllData();
}

// INIT
checkAdminAuth();
</script>
