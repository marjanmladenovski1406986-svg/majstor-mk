<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ — Majsto.mk</title>
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA" src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#0a0a0a;color:#fff;min-height:100vh}
header{background:#111;border-bottom:1px solid #222;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#ff6b35;font-size:18px;text-decoration:none}
.btn{padding:8px 14px;border-radius:8px;border:1px solid #333;background:transparent;color:#aaa;font-size:13px;cursor:pointer}
.btn-orange{background:#ff6b35;border-color:#ff6b35;color:#fff;font-weight:700}
.container{max-width:1200px;margin:0 auto;padding:20px}
.login-box{max-width:400px;margin:100px auto;padding:30px;background:#141414;border:1px solid #2a2a2a;border-radius:16px;text-align:center}
.login-box h1{color:#ff6b35;margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:16px}
.stat-card .num{font-size:28px;font-weight:800;color:#ff6b35}
.stat-card .lbl{color:#888;font-size:12px;margin-top:4px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.avatar{width:44px;height:44px;border-radius:50%;background:#ff6b35;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:200px}
.title{font-weight:700;font-size:14px}
.meta{font-size:11px;color:#888;margin-top:2px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:800}
.badge-founder{background:linear-gradient(90deg,#4caf50,#8bc34a);color:#000}
.badge-premium{background:#ff6b35;color:#000}
.btn-small{padding:6px 10px;border-radius:6px;font-size:11px;border:1px solid #333;background:transparent;color:#aaa;cursor:pointer}
.btn-small.delete{border-color:#ff6b6b;color:#ff6b6b}
.no-access{max-width:400px;margin:100px auto;padding:30px;background:#1a1a1a;border:1px solid #3a1a1a;border-radius:16px;text-align:center}
</style>
</head>
<body>
<div class="login-box" id="loginBox"><h1>🔐 Админ</h1><p style="color:#888;font-size:13px">Се вчитува...</p></div>
<div class="no-access" id="noAccess" style="display:none"><h1 style="color:#ff6b6b">❌ Нема пристап</h1><p style="color:#999;margin-top:10px">Овој панел е само за администратори.</p><button class="btn btn-orange" style="margin-top:16px" onclick="location.href='/'">← Кон сајтот</button></div>

<div id="adminPanel" style="display:none">
  <header>
    <div class="logo">🔨 Админ — Majsto.mk</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="adminEmail" style="color:#888;font-size:12px"></span>
      <button class="btn" onclick="Clerk.signOut().then(()=>location.href='/')">Одјави се</button>
      <button class="btn" onclick="location.href='/'">← Сајт</button>
    </div>
  </header>
  <div class="container">
    <h2 style="color:#ff6b35;margin-bottom:16px">👷 Сите мајстори</h2>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="list" id="majList"></div>
  </div>
</div>

<script>
const ADMIN_EMAILS=['marjanmladenovski1406986@gmail.com','majsto.info@gmail.com'];
let allMajstori=[];

window.addEventListener('load', async()=>{
  if(!window.Clerk){document.getElementById('loginBox').innerHTML='Clerk не се вчита';return}
  await Clerk.load();
  
  if(!Clerk.user){
    document.getElementById('loginBox').innerHTML='<p style="color:#ff6b35;margin-bottom:16px">Не си најавен</p><button class="btn btn-orange" onclick="window.Clerk.openSignIn({afterSignInUrl:\'/admin.html\'})">Најави се</button>';
    return;
  }

  const userEmail = Clerk.user.primaryEmailAddress.emailAddress.toLowerCase().trim();
  
  if(!ADMIN_EMAILS.includes(userEmail)){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('noAccess').style.display='block';
    return;
  }

  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminPanel').style.display='block';
  document.getElementById('adminEmail').textContent = userEmail;
  
  loadAll();
});

async function loadAll(){
  try {
    const res = await fetch('/api/majstori');
    allMajstori = await res.json();
    
    document.getElementById('statsGrid').innerHTML=`
      <div class="stat-card"><div class="num">${allMajstori.length}</div><div class="lbl">👷 Вкупно мајстори</div></div>
      <div class="stat-card"><div class="num">${allMajstori.filter(m=>m.is_founder).length}</div><div class="lbl">🚀 Founders</div></div>
      <div class="stat-card"><div class="num">${allMajstori.filter(m=>m.is_premium && !m.is_founder).length}</div><div class="lbl">👑 Premium</div></div>
    `;

    document.getElementById('majList').innerHTML = allMajstori.map(m=>{
      const avatar = (m.photo_url && m.photo_url.startsWith('http')) ? `<img src="${m.photo_url}">` : (m.name||'?').charAt(0).toUpperCase();
      const badge = m.is_founder ? '<span class="badge badge-founder">🚀 FOUNDER</span>' : (m.is_premium ? '<span class="badge badge-premium">👑 PREMIUM</span>' : '');
      return `<div class="item">
        <div class="avatar">${avatar}</div>
        <div class="info"><div class="title">${m.name} ${badge}</div><div class="meta">${m.category} • ${m.city} • ${m.phone||''} • ⭐ ${m.rating||0}</div></div>
        <div class="actions">
          <button class="btn-small" onclick="window.open('/profile.html?id=${m.id}','_blank')">👁️</button>
          <button class="btn-small delete" onclick="deleteMajstor(${m.id})">🗑️</button>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    console.error(e);
  }
}

async function deleteMajstor(id){
  if(!confirm('Избриши го мајсторот?')) return;
  await fetch('/api/delete-majstor', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id})
  });
  loadAll();
}
</script>
</body>
</html>
