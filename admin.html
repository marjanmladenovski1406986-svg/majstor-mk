
<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ — Majsto.mk</title>
<meta name="robots" content="noindex">
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsubWFqc3RvLm1rJA" src="https://clerk.majsto.mk/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
header{background:#111;border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;gap:8px;flex-wrap:wrap}
.logo{font-weight:900;color:#ff6b35;font-size:18px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid #333;background:transparent;color:#aaa;font:inherit;font-size:13px;cursor:pointer}
.btn-orange{background:#ff6b35;border-color:#ff6b35;color:#fff;font-weight:700}
.container{max-width:1200px;margin:0 auto;padding:16px}
.box{max-width:420px;margin:90px auto;padding:28px;background:#141414;border:1px solid #2a2a2a;border-radius:16px;text-align:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:10px 14px;background:#141414;border:1px solid #2a2a2a;border-radius:10px;cursor:pointer;font-size:13px;color:#999;font-weight:600}
.tab.active{background:#ff6b35;border-color:#ff6b35;color:#fff}
.pane{display:none}.pane.active{display:block}
h2{color:#ff6b35;margin-bottom:12px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sc{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:14px}
.sc .n{font-size:26px;font-weight:800;color:#ff6b35}.sc .t{color:#888;font-size:12px;margin-top:4px}
.search,.in{width:100%;padding:10px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:8px;font:inherit}
.search{max-width:400px;background:#141414}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.av{width:44px;height:44px;border-radius:50%;background:#ff6b35;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:200px}
.title{font-weight:700;font-size:14px}
.meta{font-size:11px;color:#888;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:800;margin-left:6px}
.b-f{background:#4caf50;color:#000}.b-p{background:#ff6b35;color:#000}.b-0{background:#444;color:#aaa}
.sm{padding:7px 10px;border-radius:6px;font:inherit;font-size:12px;border:1px solid #333;background:transparent;color:#aaa;cursor:pointer}
.sm.on{background:#ffd700;color:#000;border-color:#ffd700}
.sm.f{border-color:#4caf50;color:#4caf50}.sm.f.on{background:#4caf50;color:#000}
.sm.v{border-color:#4db8ff;color:#4db8ff}.sm.v.on{background:#4db8ff;color:#000}
.sm.d{border-color:#ff6b6b;color:#ff6b6b}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:16px;overflow:auto}.modal.open{display:flex}
.mc{background:#1a1a1a;border:1px solid #2a2a2a;padding:18px;border-radius:16px;max-width:500px;width:100%}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:14px;margin-bottom:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #333;padding:10px 16px;border-radius:10px;z-index:200;display:none}
</style>
</head>
<body>
<div class="box" id="loginBox"><h1 style="color:#ff6b35">🔐 Админ</h1><p style="color:#888;font-size:13px;margin-top:10px">Се вчитува...</p></div>
<div class="box" id="noAccess" style="display:none"><h1 style="color:#ff6b6b">Нема пристап</h1><p style="color:#999;margin-top:10px">Овој панел е само за администратори.</p><button class="btn btn-orange" style="margin-top:16px" onclick="location.href='/'">← Кон сајтот</button></div>
 
<div id="panel" style="display:none">
<header><div class="logo">🔨 Админ — Majsto.mk</div>
<div style="display:flex;gap:8px;align-items:center"><span id="adminEmail" style="color:#888;font-size:12px"></span><button class="btn" onclick="Clerk.signOut().then(()=>location.href='/')">Одјави се</button><button class="btn" onclick="location.href='/'">← Сајт</button></div></header>
<div class="container">
<div class="tabs" id="tabs"></div>
 
<div class="pane active" id="p-dashboard"><h2>📊 Dashboard</h2><div class="sg" id="dash"></div>
  <div class="card"><b style="color:#ff6b35">Founder статус</b>
    <div style="display:flex;align-items:center;gap:12px;margin-top:10px"><div style="flex:1;height:10px;background:#222;border-radius:20px;overflow:hidden"><div id="fBar" style="height:100%;background:#4caf50;width:0"></div></div><b id="fTxt">0/50</b></div></div></div>
 
<div class="pane" id="p-majstori"><h2>👷 Мајстори</h2><input class="search" id="majSearch" placeholder="🔍 Име, град, категорија..." oninput="renderMajstori()"><div class="list" id="majList"></div></div>
 
<div class="pane" id="p-ratings"><h2>⭐ Оценки за одобрување</h2><div class="list" id="ratList"></div></div>
 
<div class="pane" id="p-stats"><h2>📈 Статистика</h2><div class="sg" id="st2"></div><h3 style="color:#ff6b35;margin:14px 0 8px">🏆 Топ 10 по прегледи</h3><div class="card" id="top"></div></div>
 
<div class="pane" id="p-media"><h2>🖼️ Последни слики</h2><div class="list" id="medList"></div></div>
 
<div class="pane" id="p-partners"><h2>🤝 Партнери</h2>
  <div class="card"><b style="color:#ff6b35">Додај партнер</b>
    <input class="in" id="pName" placeholder="Име" style="margin-top:10px"><input class="in" id="pDesc" placeholder="Опис">
    <div style="display:flex;gap:8px"><input class="in" id="pLogo" placeholder="Лого URL (https://...)"><input type="file" id="logoFile" accept="image/*" hidden><button class="btn" onclick="document.getElementById('logoFile').click()">📁 Качи</button></div>
    <input class="in" id="pWeb" placeholder="Вебсајт (https://...)"><button class="btn btn-orange" style="width:100%" onclick="addPartner()">Додај партнер</button></div>
  <div class="list" id="partList"></div></div>
</div>
</div>
 
<div class="modal" id="editModal"><div class="mc"><h2>Уреди мајстор</h2>
<input class="in" id="eName" placeholder="Име"><input class="in" id="ePhone" placeholder="Телефон"><select class="in" id="eCity"></select><select class="in" id="eCat"></select>
<textarea class="in" id="eDesc" rows="3" placeholder="Опис"></textarea><input class="in" id="eFb" placeholder="Facebook"><input class="in" id="eWeb" placeholder="Вебсајт">
<button class="btn btn-orange" style="width:100%" onclick="saveEdit()">Зачувај</button><button class="btn" style="width:100%;margin-top:6px" onclick="closeModal()">Откажи</button></div></div>
<div class="toast" id="toast"></div>
 
<script>
const CAT_NAMES={elektrika:"⚡ Електрика",vodovod:"💧 Водовод",gradeznistvo:"🏗️ Градежништво",popravki:"🔧 Поправки",finalni:"🎨 Финални работи",plockari:"🔲 Плочкари",gipsari:"🧱 Гипсари",stolari:"🚪 Столари",klima:"❄️ Клима",greenje:"🔥 Греење",krov:"🏠 Кров",sanitarii:"🚿 Санитарии",pvc:"🪟 ПВЦ",dvorovi:"🌳 Дворови",cistenje:"🧹 Чистење",opti:"🔨 Општи",bravari:"🔨 Бравари",belatehnika:"🔌 Бела техника",videonadzor:"📹 Видео надзор",bazeni:"🏊 Базени",fasadi:"🎨 Фасади",iskop:"🚜 Ископ",hidroizolacija:"💧 Хидро изолација",otpad:"🗑️ Фрлање отпад"};
const CITIES=['Скопје','Битола','Куманово','Прилеп','Тетово','Велес','Штип','Охрид','Гостивар','Струмица','Кавадарци','Кочани','Кичево','Струга','Радовиш','Гевгелија','Дебар','Крива Паланка','Свети Николе','Неготино','Делчево','Ресен','Пробиштип','Берово','Кратово','Крушево','Валандово','Македонски Брод','Демир Хисар','Демир Капија','Богданци','Дојран','Пехчево','Виница'];
const TABS=[['dashboard','📊 Dashboard'],['majstori','👷 Мајстори'],['ratings','⭐ Оценки'],['stats','📈 Статистика'],['media','🖼️ Слики'],['partners','🤝 Партнери']];
const $=id=>document.getElementById(id);
let M=[],MEDIA=[],RAT=[],editingId=null;
 
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null) e.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null&&c!==false) e.append(c);
  return e;
}
const httpsUrl=u=>typeof u==='string'&&/^https:\/\//i.test(u)?u:null;
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',3000)}
async function api(path,opts){
  opts=opts||{};
  const token=await Clerk.session.getToken();
  opts.headers=Object.assign({},opts.headers,{Authorization:'Bearer '+token});
  const res=await fetch(path,opts);
  const data=await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data&&data.error)||'Грешка');
  return data;
}
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
async function act(fn){try{await fn();await loadAll()}catch(e){toast(e.message)}}
 
function showTab(id){
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='p-'+id));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));
}
function avatar(m){
  const a=h('div',{class:'av'});const p=httpsUrl(m&&m.photo_url);
  if(p) a.append(h('img',{src:p,alt:''})); else a.textContent=String((m&&m.name)||'?').charAt(0).toUpperCase();
  return a;
}
 
window.addEventListener('load',async()=>{
  for(let i=0;i<50&&!window.Clerk;i++) await new Promise(r=>setTimeout(r,200));
  if(!window.Clerk){$('loginBox').textContent='Не успеа да се вчита најавата.';return}
  await Clerk.load();
  if(!Clerk.user){Clerk.openSignIn({afterSignInUrl:'/admin.html'});return}
  try{await loadAll(true)}catch(e){$('loginBox').style.display='none';$('noAccess').style.display='block';return}
  $('loginBox').style.display='none';$('panel').style.display='block';
  $('adminEmail').textContent=Clerk.user.primaryEmailAddress?Clerk.user.primaryEmailAddress.emailAddress:'';
  $('tabs').replaceChildren(...TABS.map(([id,l],i)=>h('div',{class:'tab'+(i?'':' active'),'data-id':id,onclick:()=>showTab(id)},l)));
  $('eCity').replaceChildren(...CITIES.map(c=>h('option',{value:c},c)));
  $('eCat').replaceChildren(...Object.entries(CAT_NAMES).map(([k,v])=>h('option',{value:k},v)));
  $('logoFile').addEventListener('change',e=>uploadLogo(e.target));
  renderAll();
});
 
async function loadAll(first){
  const [m,md,r]=await Promise.all([api('/api/admin/majstori'),fetch('/api/media').then(x=>x.json()).catch(()=>[]),api('/api/admin/ratings')]);
  M=Array.isArray(m)?m:[];MEDIA=Array.isArray(md)?md:[];RAT=Array.isArray(r)?r:[];
  if(!first) renderAll();
  loadPartners();
}
function renderAll(){renderDash();renderMajstori();renderRatings();renderStats();renderMedia()}
 
function renderDash(){
  const founders=M.filter(m=>m.is_founder).length, prem=M.filter(m=>m.is_premium&&!m.is_founder).length;
  const pending=RAT.filter(r=>r.status==='pending'||!r.status).length;
  const sc=(n,t)=>h('div',{class:'sc'},h('div',{class:'n'},String(n)),h('div',{class:'t'},t));
  $('dash').replaceChildren(sc(M.length,'👷 Мајстори'),sc(founders,'🚀 Founders'),sc(prem,'👑 Premium'),sc(MEDIA.length,'🖼️ Слики'),sc(pending,'⭐ Чекаат одобрување'),sc(M.reduce((s,m)=>s+(m.views||0),0),'👁️ Прегледи'));
  $('fBar').style.width=Math.min(100,founders/50*100)+'%';$('fTxt').textContent=founders+'/50';
}
function renderMajstori(){
  const q=$('majSearch').value.toLowerCase();
  const list=M.filter(m=>!q||[m.name,m.city,m.category,m.email].some(x=>String(x||'').toLowerCase().includes(q)));
  $('majList').replaceChildren(...(list.length?list.map(m=>{
    const badge=m.is_founder?h('span',{class:'badge b-f'},'🚀 FOUNDER'):m.is_premium?h('span',{class:'badge b-p'},'👑 PREMIUM'):h('span',{class:'badge b-0'},'FREE');
    const mc=MEDIA.filter(x=>String(x.majstor_id)===String(m.id)).length;
    const pay=m.payment_status==='pending'?' • 💳 чека потврда за уплата':'';
    const tg=(cls,on,label,field)=>h('button',{class:'sm '+cls+(on?' on':''),onclick:()=>{
      if(field==='is_founder'&&!on&&M.filter(x=>x.is_founder).length>=50) return toast('Веќе има 50 founders');
      act(()=>post('/api/admin-toggle',{id:m.id,field,value:!on}))}},label);
    return h('div',{class:'item'},avatar(m),
      h('div',{class:'info'},h('div',{class:'title'},String(m.name||''),badge),
        h('div',{class:'meta'},(CAT_NAMES[m.category]||m.category||'')+' • '+(m.city||'')+' • '+(m.phone||'')+' • '+(m.email||'')+' • 🖼️ '+mc+' • 👁️ '+(m.views||0)+' • ⭐ '+(m.rating||0)+pay)),
      h('div',{class:'acts'},
        tg('f',m.is_founder,m.is_founder?'🚀 Founder':'Founder','is_founder'),
        tg('',m.is_premium,m.is_premium?'👑 Premium':'Premium','is_premium'),
        tg('v',m.verified,m.verified?'✅ Верификуван':'Верификувај','verified'),
        h('button',{class:'sm',onclick:()=>openEdit(m.id)},'✏️'),
        h('button',{class:'sm',onclick:()=>window.open('/profile.html?id='+encodeURIComponent(m.id),'_blank')},'👁️'),
        h('button',{class:'sm',onclick:()=>window.open('/dashboard.html?edit_id='+encodeURIComponent(m.id),'_blank')},'🛠️'),
        h('button',{class:'sm d',onclick:()=>{if(confirm('Избриши мајстор и сите негови слики и оценки?'))act(()=>post('/api/delete-majstor',{id:m.id}))}},'🗑️')));
  }):[h('p',{style:'color:#666'},'Нема мајстори')]));
}
function renderRatings(){
  const pending=RAT.filter(r=>r.status==='pending'||!r.status);
  $('ratList').replaceChildren(...(pending.length?pending.map(r=>{
    const m=M.find(x=>x.id===r.majstor_id);const n=Math.max(0,Math.min(5,Number(r.rating)||0));
    return h('div',{class:'item'},h('div',{class:'av'},'⭐'),
      h('div',{class:'info'},h('div',{class:'title'},'★'.repeat(n)+'☆'.repeat(5-n)+' → '+(m?m.name:'Непознат')),h('div',{class:'meta'},String(r.comment||'')),h('div',{class:'meta'},new Date(r.created_at).toLocaleString('mk-MK'))),
      h('div',{class:'acts'},h('button',{class:'sm v on',onclick:()=>act(()=>post('/api/approve-rating',{id:r.id,action:'approve'}))},'✅ Одобри'),
        h('button',{class:'sm d',onclick:()=>act(()=>post('/api/approve-rating',{id:r.id,action:'reject'}))},'❌ Одбиј')));
  }):[h('p',{style:'color:#666;text-align:center;padding:20px'},'✅ Нема оценки за одобрување')]));
}
function renderStats(){
  const sc=(n,t)=>h('div',{class:'sc'},h('div',{class:'n'},String(n)),h('div',{class:'t'},t));
  $('st2').replaceChildren(sc(M.reduce((s,m)=>s+(m.views||0),0),'👁️ Прегледи'),sc(M.reduce((s,m)=>s+(m.phone_clicks||0),0),'📞 Кликови на телефон'),sc(MEDIA.length,'🖼️ Слики'));
  const top=[...M].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,10);
  $('top').replaceChildren(...top.map((m,i)=>h('div',{style:'display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222'},
    h('span',{},(i+1)+'. '+m.name+' ',h('span',{style:'color:#666'},'('+(CAT_NAMES[m.category]||m.category||'')+')')),h('span',{style:'color:#ff6b35'},'👁️ '+(m.views||0)))));
}
function renderMedia(){
  $('medList').replaceChildren(...MEDIA.slice(0,50).map(x=>{
    const m=M.find(y=>String(y.id)===String(x.majstor_id));const u=httpsUrl(x.url);
    return h('div',{class:'item'},h('div',{class:'av',style:'border-radius:8px'},u&&h('img',{src:u,alt:''})),
      h('div',{class:'info'},h('div',{class:'title'},(m?m.name:'Непознат')+' • '+(x.title||'Слика'))),
      h('div',{class:'acts'},u&&h('button',{class:'sm',onclick:()=>window.open(u,'_blank','noopener')},'👁️'),h('button',{class:'sm d',onclick:()=>{if(confirm('Избриши слика?'))act(()=>post('/api/delete-media',{id:x.id}))}},'🗑️')));
  }));
}
 
// ===== уредување =====
function openEdit(id){
  const m=M.find(x=>x.id===id);if(!m)return;editingId=id;
  $('eName').value=m.name||'';$('ePhone').value=m.phone||'';$('eCity').value=m.city||'Скопје';$('eCat').value=m.category||'elektrika';
  $('eDesc').value=m.description||'';$('eFb').value=m.facebook_url||'';$('eWeb').value=m.website_url||'';
  $('editModal').classList.add('open');
}
function closeModal(){$('editModal').classList.remove('open')}
async function saveEdit(){
  await act(()=>post('/api/update-profile',{id:editingId,name:$('eName').value,phone:$('ePhone').value,city:$('eCity').value,category:$('eCat').value,description:$('eDesc').value,facebook_url:$('eFb').value,website_url:$('eWeb').value}));
  closeModal();
}
 
// ===== партнери =====
async function loadPartners(){
  try{
    const ps=await fetch('/api/partners').then(r=>r.json());
    $('partList').replaceChildren(...((Array.isArray(ps)&&ps.length)?ps.map(p=>{
      const logo=httpsUrl(p.logo_url);
      return h('div',{class:'item'},h('div',{class:'av',style:'border-radius:8px;background:#fff'},logo&&h('img',{src:logo,alt:'',style:'object-fit:contain'})),
        h('div',{class:'info'},h('div',{class:'title'},String(p.name||'')),h('div',{class:'meta'},String(p.description||'')+' • '+String(p.website_url||''))),
        h('div',{class:'acts'},h('button',{class:'sm d',onclick:()=>{if(confirm('Избриши партнер?'))act(()=>post('/api/delete-partner',{id:p.id}))}},'🗑️')));
    }):[h('p',{style:'color:#666'},'Нема партнери')]));
  }catch(e){}
}
async function uploadLogo(input){
  const file=input.files[0];if(!file)return;
  try{const fd=new FormData();fd.append('file',file);const r=await api('/api/upload',{method:'POST',body:fd});$('pLogo').value=r.url;toast('Логото е качено')}catch(e){toast(e.message)}
  input.value='';
}
async function addPartner(){
  const body={name:$('pName').value,description:$('pDesc').value,logo_url:$('pLogo').value,website_url:$('pWeb').value};
  if(!body.name||!body.website_url) return toast('Име и вебсајт се задолжителни');
  await act(()=>post('/api/partners',body));
  ['pName','pDesc','pLogo','pWeb'].forEach(i=>$(i).value='');toast('Партнерот е додаден');
}
</script>
</body>
</html>
